```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>정령의 계절</title>

<style>

/* =========================================================
   기본
========================================================= */

*{
    box-sizing:border-box;
    image-rendering:pixelated;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#17151d;

    font-family:
        "Courier New",
        monospace;

    color:white;

    touch-action:none;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =========================================================
   게임
========================================================= */

#game{
    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;

    background:#17151d;
}


/* =========================================================
   HUD
========================================================= */

#hud{
    height:78px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 18px;

    background:#25222e;

    border-bottom:4px solid #111018;

    box-shadow:
        inset 0 -2px 0 #40394c;

    z-index:50;
}

.hud-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.day-box{
    min-width:125px;

    padding:8px 12px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.day-title{
    font-size:11px;
    color:#aaa1b8;
}

.day-number{
    font-size:18px;
    font-weight:bold;
}

.season{
    color:#e8b8ff;
}

.hud-stats{
    display:flex;
    gap:10px;
}

.stat{
    min-width:120px;

    padding:8px 12px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.stat-label{
    font-size:10px;
    color:#aaa1b8;
    margin-bottom:3px;
}

.stat-value{
    font-size:15px;
    font-weight:bold;
}

.money{
    color:#f3d46a;
}

.energy-bar{
    width:90px;
    height:9px;

    margin-top:4px;

    background:#16141a;

    border:2px solid #0d0c10;
}

.energy-fill{
    width:100%;
    height:100%;

    background:#e6a54e;
}


/* =========================================================
   메인
========================================================= */

#main{
    flex:1;
    min-height:0;

    display:flex;
}


/* =========================================================
   사이드바
========================================================= */

#sidebar{
    width:190px;
    flex-shrink:0;

    padding:12px;

    background:#211e29;

    border-right:4px solid #111018;

    z-index:60;
}

.menu-title{
    font-size:12px;
    color:#aaa1b8;

    margin:4px 4px 10px;
}

.menu-button{
    width:100%;

    margin-bottom:8px;

    padding:11px 8px;

    color:white;

    background:#332f3d;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    text-align:left;

    font-size:12px;
}

.menu-button:hover{
    background:#423c4e;
}

.menu-button.active{
    background:#5b4b6d;
    border-color:#80699b;
}


/* =========================================================
   게임 화면
========================================================= */

#screen{
    position:relative;

    flex:1;
    min-width:0;

    overflow:hidden;

    background:#536b55;
}


/* =========================================================
   장소
========================================================= */

.location{
    position:absolute;

    inset:0;

    display:none;

    overflow:hidden;
}

.location.active{
    display:block;
}


/* =========================================================
   농장
========================================================= */

#farm{
    background:
        linear-gradient(
            #72936b 0 18%,
            #5f805d 18% 100%
        );
}


/* =========================================================
   집
========================================================= */

.house{
    position:absolute;

    left:7%;
    top:8%;

    width:210px;
    height:150px;

    background:#b47d61;

    border:6px solid #30221f;
}

.house-roof{
    position:absolute;

    left:-20px;
    top:-55px;

    width:240px;
    height:85px;

    background:#704e5a;

    border:6px solid #30221f;

    transform:skewX(-20deg);
}

.house-door{
    position:absolute;

    bottom:0;
    left:78px;

    width:48px;
    height:70px;

    background:#543b36;

    border:5px solid #30221f;
}

.house-window{
    position:absolute;

    top:35px;

    width:40px;
    height:40px;

    background:#9ed2d8;

    border:5px solid #30221f;
}

.house-window.left{
    left:20px;
}

.house-window.right{
    right:20px;
}


/* =========================================================
   밭
========================================================= */

.field{
    position:absolute;

    left:35%;
    top:25%;

    display:grid;

    grid-template-columns:
        repeat(5,54px);

    grid-template-rows:
        repeat(4,54px);

    gap:4px;

    padding:8px;

    background:#513c30;

    border:5px solid #30241f;
}

.crop-tile{
    position:relative;

    width:54px;
    height:54px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#795a3e;

    border:3px solid #4a3528;

    font-size:28px;
}

.crop-tile.watered{
    background:#566b72;
}

.crop-tile.ready{
    animation:pulse 1s infinite;
}

.crop-tile.empty::after{
    content:"+";

    color:#a47b59;

    font-size:18px;
}

@keyframes pulse{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.4);
    }
}


/* =========================================================
   연못
========================================================= */

.pond{
    position:absolute;

    right:9%;
    top:18%;

    width:170px;
    height:110px;

    border-radius:50%;

    background:#4b8da0;

    border:7px solid #304e56;

    box-shadow:
        inset 0 8px 0 #71b4c2;
}


/* =========================================================
   나무
========================================================= */

.tree{
    position:absolute;

    font-size:70px;

    pointer-events:none;
}

.tree.t1{
    left:8%;
    bottom:10%;
}

.tree.t2{
    right:25%;
    bottom:7%;
}

.tree.t3{
    right:5%;
    bottom:28%;
}


/* =========================================================
   플레이어
========================================================= */

.player{
    position:absolute;

    left:50%;
    top:60%;

    width:44px;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    z-index:30;

    user-select:none;

    transform:
        translate(-50%,-50%);

    transition:
        left .08s linear,
        top .08s linear;
}

.player.flip{
    transform:
        translate(-50%,-50%)
        scaleX(-1);
}

.player::after{
    content:"";

    position:absolute;

    bottom:-3px;

    width:30px;
    height:7px;

    background:#2c2630;

    border-radius:50%;
}


/* =========================================================
   플레이어 이름
========================================================= */

.player-name{
    position:absolute;

    top:-20px;
    left:50%;

    transform:translateX(-50%);

    padding:2px 5px;

    background:#27232e;

    border:2px solid #111018;

    font-size:8px;

    white-space:nowrap;

    opacity:.8;
}


/* =========================================================
   숲
========================================================= */

#forest{
    background:
        linear-gradient(
            #456149 0 30%,
            #334c38 30% 100%
        );
}

.forest-ground{
    position:absolute;

    inset:30% 0 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            #526e48 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 70% 40%,
            #526e48 0 4px,
            transparent 5px
        );
}

.forest-tree{
    position:absolute;

    font-size:82px;

    pointer-events:none;
}

.forest-tree:nth-child(1){
    left:7%;
    top:12%;
}

.forest-tree:nth-child(2){
    left:27%;
    top:7%;
}

.forest-tree:nth-child(3){
    right:25%;
    top:12%;
}

.forest-tree:nth-child(4){
    right:5%;
    top:8%;
}

.forest-center{
    position:absolute;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    width:190px;
    height:190px;

    border-radius:50%;

    background:#25352a;

    border:6px solid #18231c;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:90px;

    box-shadow:
        0 0 30px rgba(185,150,255,.18);
}

.spirit-hint{
    position:absolute;

    left:50%;
    top:75%;

    transform:translateX(-50%);

    padding:8px 14px;

    background:#201c29;

    border:3px solid #80699b;

    color:#dcbfff;

    font-size:12px;

    white-space:nowrap;

    pointer-events:none;
}


/* =========================================================
   마을
========================================================= */

#town{
    background:#8c816f;
}

.town-road{
    position:absolute;

    left:0;
    right:0;

    top:52%;

    height:100px;

    background:#c5a878;

    border-top:5px solid #8d7551;
    border-bottom:5px solid #8d7551;
}

.shop{
    position:absolute;

    width:180px;
    height:150px;

    background:#b47765;

    border:6px solid #4a302d;
}

.shop.one{
    left:10%;
    top:20%;
}

.shop.two{
    right:10%;
    top:18%;
}

.shop-roof{
    position:absolute;

    left:-8px;
    top:-42px;

    width:184px;
    height:55px;

    background:#704b57;

    border:6px solid #4a302d;
}

.shop-door{
    position:absolute;

    bottom:0;
    left:67px;

    width:45px;
    height:70px;

    background:#563d37;

    border:5px solid #4a302d;
}

.town-npc{
    position:absolute;

    font-size:40px;

    z-index:10;

    pointer-events:none;
}

.npc-a{
    left:42%;
    top:38%;
}

.npc-b{
    right:32%;
    top:65%;
}


/* =========================================================
   정보창
========================================================= */

#info{
    position:absolute;

    right:16px;
    bottom:90px;

    width:220px;

    padding:12px;

    background:#25222e;

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e;

    z-index:35;
}

.info-title{
    font-size:13px;

    color:#dcbfff;

    margin-bottom:8px;
}

.info-text{
    font-size:11px;

    line-height:1.6;

    color:#c5bdca;
}


/* =========================================================
   액션바
========================================================= */

#actionbar{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    display:flex;

    gap:8px;

    padding:8px;

    background:#25222e;

    border:4px solid #111018;

    z-index:70;
}

.action{
    width:95px;
    height:44px;

    background:#383342;

    border:3px solid #14121a;

    color:white;

    font-size:11px;
}

.action:hover{
    background:#51485d;
}


/* =========================================================
   모바일 방향키
========================================================= */

#mobileControls{
    position:absolute;

    left:18px;
    bottom:25px;

    width:145px;
    height:145px;

    z-index:90;

    display:none;
}

.control{
    position:absolute;

    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(37,34,46,.9);

    color:white;

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:20px;

    user-select:none;

    touch-action:none;
}

.control:active{
    background:#655172;

    transform:scale(.94);
}

.control.up{
    left:49px;
    top:0;
}

.control.left{
    left:0;
    top:49px;
}

.control.down{
    left:49px;
    top:49px;
}

.control.right{
    left:98px;
    top:49px;
}


/* =========================================================
   패널
========================================================= */

#panel{
    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.68);

    z-index:150;
}

#panel.open{
    display:flex;
}

.panel-box{
    width:min(560px,90vw);

    max-height:80vh;

    overflow:auto;

    padding:22px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #1a1720;
}

.panel-title{
    margin-bottom:16px;

    font-size:20px;

    font-weight:bold;
}

.panel-close{
    float:right;

    background:#4b3948;

    color:white;

    border:3px solid #17131b;

    padding:5px 10px;
}


/* =========================================================
   정령 카드
========================================================= */

.spirit-card{
    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:12px;

    padding:12px;

    background:#332e3b;

    border:3px solid #17141c;
}

.spirit-icon{
    width:60px;
    height:60px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#24202b;

    border:3px solid #51495e;

    font-size:40px;
}

.spirit-name{
    font-weight:bold;

    margin-bottom:5px;
}

.hearts{
    color:#e4a6ff;

    letter-spacing:2px;
}

.contract-btn{
    margin-top:8px;

    padding:7px 10px;

    color:white;

    background:#59456a;

    border:3px solid #18141e;
}

.contract-btn:hover{
    background:#705585;
}

.contract-btn:disabled{
    opacity:.45;
}


/* =========================================================
   토스트
========================================================= */

#toast{
    position:absolute;

    left:50%;
    top:20px;

    transform:
        translate(-50%,-20px);

    padding:10px 18px;

    background:#292531;

    border:4px solid #111018;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:200;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:700px){

    #hud{
        height:64px;
        padding:6px;
    }

    .day-box{
        min-width:90px;
        padding:6px;
    }

    .day-title{
        font-size:8px;
    }

    .day-number{
        font-size:13px;
    }

    .hud-stats{
        gap:4px;
    }

    .stat{
        min-width:72px;
        padding:5px;
    }

    .stat-label{
        font-size:8px;
    }

    .stat-value{
        font-size:10px;
    }

    .energy-bar{
        width:55px;
    }

    #sidebar{
        width:88px;
        padding:6px;
    }

    .menu-title{
        font-size:8px;
        margin:4px 2px 8px;
    }

    .menu-button{
        padding:8px 4px;
        font-size:8px;
    }

    #info{
        display:none;
    }

    #actionbar{
        bottom:10px;

        left:auto;
        right:8px;

        transform:none;

        gap:3px;

        padding:5px;
    }

    .action{
        width:55px;
        height:38px;

        font-size:8px;
    }

    #mobileControls{
        display:block;
    }

    .field{
        transform:scale(.75);

        transform-origin:
            top left;
    }

    .house{
        transform:scale(.8);

        transform-origin:
            top left;
    }

}


/* =========================================================
   아주 작은 화면
========================================================= */

@media(max-width:430px){

    #sidebar{
        width:74px;
    }

    .menu-button{
        font-size:7px;
    }

    .hud-left{
        gap:4px;
    }

    .hud-stats .stat:nth-child(2){
        display:none;
    }

    #actionbar{
        display:none;
    }

}

</style>
</head>


<body>

<div id="game">


<!-- =========================================================
     HUD
========================================================= -->

<header id="hud">

    <div class="hud-left">

        <div class="day-box">

            <div class="day-title">
                계절
            </div>

            <div class="day-number">

                <span id="day">
                    1
                </span>일

                <span class="season">
                    봄
                </span>

            </div>

        </div>


        <div class="day-box">

            <div class="day-title">
                시간
            </div>

            <div
                class="day-number"
                id="time">

                06:00

            </div>

        </div>

    </div>


    <div class="hud-stats">

        <div class="stat">

            <div class="stat-label">
                체력
            </div>

            <div class="stat-value">

                <span id="energy">
                    100
                </span>/100

            </div>

            <div class="energy-bar">

                <div
                    class="energy-fill"
                    id="energyFill">
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                소지금
            </div>

            <div class="stat-value money">

                ₩
                <span id="money">
                    500
                </span>

            </div>

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main id="main">


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside id="sidebar">

    <div class="menu-title">
        장소
    </div>


    <button
        class="menu-button active"
        onclick="moveLocation('farm')">

        🌱 농장

    </button>


    <button
        class="menu-button"
        onclick="moveLocation('town')">

        🏘️ 마을

    </button>


    <button
        class="menu-button"
        onclick="moveLocation('forest')">

        🌲 숲

    </button>


    <div
        class="menu-title"
        style="margin-top:20px;">

        관리

    </div>


    <button
        class="menu-button"
        onclick="openInventory()">

        🎒 인벤토리

    </button>


    <button
        class="menu-button"
        onclick="openSpirits()">

        ✨ 정령

    </button>


    <button
        class="menu-button"
        onclick="saveGame()">

        💾 저장

    </button>

</aside>


<!-- =========================================================
     SCREEN
========================================================= -->

<section id="screen">


<!-- =========================================================
     FARM
========================================================= -->

<div
    id="farm"
    class="location active">


    <div class="house">

        <div class="house-roof"></div>

        <div class="house-window left"></div>

        <div class="house-window right"></div>

        <div class="house-door"></div>

    </div>


    <div
        class="field"
        id="field">
    </div>


    <div class="pond"></div>


    <div class="tree t1">
        🌳
    </div>

    <div class="tree t2">
        🌳
    </div>

    <div class="tree t3">
        🌲
    </div>


    <!-- 플레이어 -->

    <div
        class="player"
        id="player">

        <div class="player-name">
            나
        </div>

        🧑🏻‍🌾

    </div>

</div>


<!-- =========================================================
     FOREST
========================================================= -->

<div
    id="forest"
    class="location">


    <div class="forest-ground"></div>


    <div class="forest-tree">
        🌳
    </div>

    <div class="forest-tree">
        🌲
    </div>

    <div class="forest-tree">
        🌳
    </div>

    <div class="forest-tree">
        🌲
    </div>


    <div
        class="forest-center"
        onclick="meetSpirit()">

        ✨

    </div>


    <div class="spirit-hint">

        가까이 다가가 보자...

    </div>

</div>


<!-- =========================================================
     TOWN
========================================================= -->

<div
    id="town"
    class="location">


    <div class="shop one">

        <div class="shop-roof"></div>

        <div class="shop-door"></div>

    </div>


    <div class="shop two">

        <div class="shop-roof"></div>

        <div class="shop-door"></div>

    </div>


    <div class="town-road"></div>


    <div class="town-npc npc-a">
        🧙🏻
    </div>


    <div class="town-npc npc-b">
        🐈
    </div>

</div>


<!-- =========================================================
     INFO
========================================================= -->

<div id="info">

    <div class="info-title">
        오늘의 기록
    </div>

    <div
        class="info-text"
        id="infoText">

        새로운 농장에서의 첫날이다.<br>
        방향키로 움직여보자.

    </div>

</div>


<!-- =========================================================
     ACTION BAR
========================================================= -->

<div id="actionbar">

    <button
        class="action"
        onclick="plantCrop()">

        🌱 심기

    </button>


    <button
        class="action"
        onclick="waterCrop()">

        💧 물주기

    </button>


    <button
        class="action"
        onclick="harvestCrop()">

        🧺 수확

    </button>


    <button
        class="action"
        onclick="rest()">

        🛏️ 휴식

    </button>


    <button
        class="action"
        onclick="endDay()">

        🌙 취침

    </button>

</div>


<!-- =========================================================
     MOBILE CONTROLLER
========================================================= -->

<div id="mobileControls">

    <button
        class="control up"
        data-key="ArrowUp">

        ▲

    </button>


    <button
        class="control left"
        data-key="ArrowLeft">

        ◀

    </button>


    <button
        class="control down"
        data-key="ArrowDown">

        ▼

    </button>


    <button
        class="control right"
        data-key="ArrowRight">

        ▶

    </button>

</div>


<!-- =========================================================
     PANEL
========================================================= -->

<div id="panel">

    <div class="panel-box">

        <button
            class="panel-close"
            onclick="closePanel()">

            X

        </button>


        <div
            class="panel-title"
            id="panelTitle">

            정령

        </div>


        <div id="panelContent"></div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div id="toast"></div>


</section>

</main>

</div>


<script>

/* =========================================================
   GAME DATA
========================================================= */

const game = {

    day:1,

    season:"봄",

    time:360,

    energy:100,

    maxEnergy:100,

    money:500,

    location:"farm",

    inventory:{
        seed:5,
        crop:0
    },

    crops:[],

    selectedCrop:0,

    player:{

        x:50,
        y:60,

        speed:1.1,

        direction:"down"

    },

    locations:{

        farm:{
            x:50,
            y:60
        },

        town:{
            x:50,
            y:70
        },

        forest:{
            x:50,
            y:75
        }

    },

    spirits:{

        earth:{

            name:"대지의 정령",

            icon:"🌱",

            affection:0,

            contracted:false,

            power:
                "땅을 빠르게 개간할 수 있다."

        },

        water:{

            name:"물의 정령",

            icon:"💧",

            affection:0,

            contracted:false,

            power:
                "물을 주면 주변 밭까지 함께 적신다."

        },

        forest:{

            name:"숲의 정령",

            icon:"🌲",

            affection:0,

            contracted:false,

            power:
                "채집물의 발견 확률이 증가한다."

        }

    }

};


/* =========================================================
   FARM
========================================================= */

function createFarm(){

    const field =
        document.getElementById("field");

    field.innerHTML="";

    game.crops=[];

    for(let i=0;i<20;i++){

        const tile =
            document.createElement("div");

        tile.className=
            "crop-tile empty";

        tile.dataset.index=i;

        tile.onclick=()=>{

            game.selectedCrop=i;

            selectCrop(i);

        };

        field.appendChild(tile);

        game.crops.push({

            planted:false,

            watered:false,

            grown:false

        });

    }

}


/* =========================================================
   PLAYER POSITION
========================================================= */

function updatePlayer(){

    const player =
        document.getElementById("player");

    player.style.left =
        game.player.x+"%";

    player.style.top =
        game.player.y+"%";


    /*
       좌우 방향 전환
    */

    if(
        game.player.direction==="left"
    ){

        player.classList.add("flip");

    }

    else if(
        game.player.direction==="right"
    ){

        player.classList.remove("flip");

    }

}


/* =========================================================
   MOVEMENT
========================================================= */

const keys={};

document.addEventListener(
    "keydown",
    e=>{

        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "w",
                "a",
                "s",
                "d",
                "W",
                "A",
                "S",
                "D"
            ].includes(e.key)
        ){

            e.preventDefault();

        }

        keys[e.key]=true;

    }
);


document.addEventListener(
    "keyup",
    e=>{

        keys[e.key]=false;

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastMove=0;

function movementLoop(timestamp){

    if(
        timestamp-lastMove>16
    ){

        movePlayer();

        lastMove=timestamp;

    }

    requestAnimationFrame(
        movementLoop
    );

}

requestAnimationFrame(
    movementLoop
);


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(){

    let dx=0;
    let dy=0;


    /*
       키보드
    */

    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx-=1;

        game.player.direction=
            "left";

    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx+=1;

        game.player.direction=
            "right";

    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dy-=1;

        game.player.direction=
            "up";

    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dy+=1;

        game.player.direction=
            "down";

    }


    if(
        dx===0 &&
        dy===0
    ){

        return;

    }


    /*
       대각선 속도 보정
    */

    if(
        dx!==0 &&
        dy!==0
    ){

        dx*=0.707;
        dy*=0.707;

    }


    /*
       이동
    */

    game.player.x +=
        dx*game.player.speed;

    game.player.y +=
        dy*game.player.speed;


    /*
       화면 경계
    */

    game.player.x=
        Math.max(
            4,
            Math.min(
                96,
                game.player.x
            )
        );

    game.player.y=
        Math.max(
            7,
            Math.min(
                92,
                game.player.y
            )
        );


    updatePlayer();

}


/* =========================================================
   MOBILE TOUCH
========================================================= */

document
    .querySelectorAll(".control")
    .forEach(button=>{

        const key =
            button.dataset.key;


        /*
           터치 시작
        */

        button.addEventListener(
            "touchstart",
            e=>{

                e.preventDefault();

                keys[key]=true;

            },
            {
                passive:false
            }
        );


        /*
           터치 종료
        */

        button.addEventListener(
            "touchend",
            e=>{

                e.preventDefault();

                keys[key]=false;

            },
            {
                passive:false
            }
        );


        button.addEventListener(
            "touchcancel",
            e=>{

                keys[key]=false;

            }
        );


        /*
           마우스로 테스트 가능
        */

        button.addEventListener(
            "mousedown",
            ()=>{

                keys[key]=true;

            }
        );


        button.addEventListener(
            "mouseup",
            ()=>{

                keys[key]=false;

            }
        );


        button.addEventListener(
            "mouseleave",
            ()=>{

                keys[key]=false;

            }
        );

    });


/* =========================================================
   LOCATION
========================================================= */

function moveLocation(location){

    /*
       현재 위치 저장
    */

    game.locations[
        game.location
    ].x=
        game.player.x;

    game.locations[
        game.location
    ].y=
        game.player.y;


    game.location=
        location;


    /*
       새 위치 불러오기
    */

    game.player.x=
        game.locations[
            location
        ].x;

    game.player.y=
        game.locations[
            location
        ].y;


    /*
       장소 변경
    */

    document
        .querySelectorAll(".location")
        .forEach(el=>{

            el.classList.remove(
                "active"
            );

        });


    document
        .getElementById(location)
        .classList.add("active");


    /*
       메뉴
    */

    document
        .querySelectorAll(".menu-button")
        .forEach(btn=>{

            btn.classList.remove(
                "active"
            );

        });


    const buttons =
        document.querySelectorAll(
            ".menu-button"
        );


    if(location==="farm")
        buttons[0].classList.add("active");

    if(location==="town")
        buttons[1].classList.add("active");

    if(location==="forest")
        buttons[2].classList.add("active");


    /*
       설명
    */

    if(location==="farm"){

        updateInfo(
            "나만의 작은 농장이다.<br>" +
            "밭을 관리하고 작물을 키워보자."
        );

    }


    if(location==="town"){

        updateInfo(
            "작은 마을이다.<br>" +
            "주민들과 이야기해보자."
        );

    }


    if(location==="forest"){

        updateInfo(
            "숲 안쪽에서 희미한 빛이 보인다.<br>" +
            "무언가가 너를 부르고 있는 것 같다."
        );

    }


    updatePlayer();

}


/* =========================================================
   INFO
========================================================= */

function updateInfo(text){

    document
        .getElementById("infoText")
        .innerHTML=text;

}


/* =========================================================
   TIME
========================================================= */

function addTime(minutes){

    game.time+=minutes;


    if(game.time>=1440){

        game.time=1440;

        showToast(
            "오늘은 너무 늦었다."
        );

    }


    updateHUD();

}


function formatTime(minutes){

    let h=
        Math.floor(
            minutes/60
        );

    let m=
        minutes%60;


    if(h>23){

        h=23;
        m=59;

    }


    return String(h)
        .padStart(2,"0")
        +":"
        +String(m)
        .padStart(2,"0");

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("day")
        .textContent=
        game.day;


    document
        .getElementById("time")
        .textContent=
        formatTime(game.time);


    document
        .getElementById("energy")
        .textContent=
        game.energy;


    document
        .getElementById("money")
        .textContent=
        game.money;


    document
        .getElementById("energyFill")
        .style.width=
        (
            game.energy/
            game.maxEnergy*
            100
        )+"%";

}


/* =========================================================
   CROP SELECT
========================================================= */

function selectCrop(index){

    game.selectedCrop=index;

    const crop=
        game.crops[index];


    if(!crop.planted){

        updateInfo(
            "빈 밭이다.<br>" +
            "씨앗을 심을 수 있다."
        );

    }

    else if(crop.grown){

        updateInfo(
            "작물이 다 자랐다.<br>" +
            "수확할 수 있다."
        );

    }

    else if(crop.watered){

        updateInfo(
            "오늘 물을 줬다.<br>" +
            "잘 자라고 있다."
        );

    }

    else{

        updateInfo(
            "작물이 말라 있다.<br>" +
            "물을 줘야 한다."
        );

    }

}


/* =========================================================
   PLANT
========================================================= */

function plantCrop(){

    if(game.location!=="farm"){

        showToast(
            "농장에서만 씨앗을 심을 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(crop.planted){

        showToast(
            "이미 무언가 심겨 있다."
        );

        return;

    }


    if(game.inventory.seed<=0){

        showToast(
            "씨앗이 없다."
        );

        return;

    }


    if(game.energy<5){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.inventory.seed--;

    game.energy-=5;

    crop.planted=true;

    crop.watered=false;

    crop.grown=false;


    const tile=
        document.querySelectorAll(
            ".crop-tile"
        )[game.selectedCrop];


    tile.classList.remove(
        "empty"
    );

    tile.textContent="🌱";


    addTime(10);

    showToast(
        "씨앗을 심었다."
    );

}


/* =========================================================
   WATER
========================================================= */

function waterCrop(){

    if(game.location!=="farm"){

        showToast(
            "농장에서만 물을 줄 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(!crop.planted){

        showToast(
            "심어진 작물이 없다."
        );

        return;

    }


    if(crop.grown){

        showToast(
            "이미 다 자랐다."
        );

        return;

    }


    if(crop.watered){

        showToast(
            "오늘은 이미 물을 줬다."
        );

        return;

    }


    if(game.energy<3){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.energy-=3;

    crop.watered=true;


    const tile=
        document.querySelectorAll(
            ".crop-tile"
        )[game.selectedCrop];


    tile.classList.add(
        "watered"
    );


    addTime(5);

    showToast(
        "물을 줬다."
    );

}


/* =========================================================
   HARVEST
========================================================= */

function harvestCrop(){

    if(game.location!=="farm"){

        showToast(
            "농장에서만 수확할 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(!crop.grown){

        showToast(
            "아직 다 자라지 않았다."
        );

        return;

    }


    crop.planted=false;

    crop.watered=false;

    crop.grown=false;


    game.inventory.crop++;

    game.money+=80;


    const tile=
        document.querySelectorAll(
            ".crop-tile"
        )[game.selectedCrop];


    tile.className=
        "crop-tile empty";

    tile.textContent="";


    addTime(10);


    showToast(
        "작물을 수확했다! +₩80"
    );

}


/* =========================================================
   REST
========================================================= */

function rest(){

    if(
        game.energy>=
        game.maxEnergy
    ){

        showToast(
            "이미 체력이 충분하다."
        );

        return;

    }


    game.energy=
        Math.min(
            game.maxEnergy,
            game.energy+25
        );


    addTime(60);


    showToast(
        "잠시 쉬었다."
    );

}


/* =========================================================
   END DAY
========================================================= */

function endDay(){

    if(
        !confirm(
            "오늘 하루를 끝내고 잠자리에 들까요?"
        )
    ){

        return;

    }


    game.day++;

    game.time=360;

    game.energy=
        game.maxEnergy;


    game.crops.forEach(
        crop=>{

            if(
                crop.planted &&
                crop.watered
            ){

                crop.grown=true;

            }

            crop.watered=false;

        }
    );


    updateCrops();

    updateHUD();


    showToast(
        game.day+
        "일째 아침이 되었다."
    );

}


/* =========================================================
   CROP UPDATE
========================================================= */

function updateCrops(){

    document
        .querySelectorAll(".crop-tile")
        .forEach(
            (tile,i)=>{

                const crop=
                    game.crops[i];


                tile.className=
                    "crop-tile";


                if(!crop.planted){

                    tile.classList.add(
                        "empty"
                    );

                    tile.textContent="";

                    return;

                }


                if(crop.grown){

                    tile.classList.add(
                        "ready"
                    );

                    tile.textContent=
                        "🥕";

                }

                else{

                    tile.textContent=
                        "🌱";

                }

            }
        );

}


/* =========================================================
   SPIRIT
========================================================= */

function meetSpirit(){

    const spirit=
        game.spirits.earth;


    if(
        spirit.contracted
    ){

        openSpiritDetail(
            "earth"
        );

        return;

    }


    if(
        spirit.affection<3
    ){

        spirit.affection++;


        showToast(
            "대지의 정령이 너를 바라본다..."
        );


        updateInfo(

            "대지의 정령이 작은 목소리로 말했다.<br><br>" +

            "「이 땅을 소중히 다루는구나.」"

        );

    }

    else{

        openSpiritDetail(
            "earth"
        );

    }

}


/* =========================================================
   SPIRIT PANEL
========================================================= */

function openSpirits(){

    openPanel(
        "정령 계약",
        createSpiritHTML()
    );

}


function createSpiritHTML(){

    let html="";


    Object.entries(
        game.spirits
    )
    .forEach(
        ([id,spirit])=>{

            let hearts="";


            for(
                let i=0;
                i<5;
                i++
            ){

                hearts +=
                    i<spirit.affection
                    ? "♥"
                    : "♡";

            }


            html+=`

                <div class="spirit-card">

                    <div class="spirit-icon">
                        ${spirit.icon}
                    </div>

                    <div>

                        <div class="spirit-name">
                            ${spirit.name}
                        </div>

                        <div class="hearts">
                            ${hearts}
                        </div>

                        <div
                            style="
                            font-size:10px;
                            color:#aaa1b8;
                            margin-top:5px;
                            ">

                            ${
                                spirit.contracted
                                ?
                                "계약 완료"
                                :
                                "계약하지 않음"
                            }

                        </div>

                        ${
                            spirit.contracted
                            ?

                            `
                            <div
                                style="
                                margin-top:7px;
                                font-size:11px;
                                color:#dcbfff;
                                ">

                                능력:
                                ${spirit.power}

                            </div>
                            `

                            :

                            `
                            <button
                                class="contract-btn"
                                onclick="
                                contractSpirit('${id}')
                                "
                                ${
                                    spirit.affection<3
                                    ? "disabled"
                                    : ""
                                }>

                                계약하기

                            </button>
                            `
                        }

                    </div>

                </div>

            `;

        }
    );


    return html;

}


/* =========================================================
   CONTRACT
========================================================= */

function contractSpirit(id){

    const spirit=
        game.spirits[id];


    if(
        spirit.affection<3
    ){

        showToast(
            "아직 정령과 충분히 가까워지지 않았다."
        );

        return;

    }


    spirit.contracted=true;


    closePanel();


    showToast(
        spirit.name+
        "과 계약했다!"
    );


    updateInfo(

        `<b>${spirit.name}</b>과 계약했다.<br><br>` +

        `${spirit.power}`

    );

}


/* =========================================================
   SPIRIT DETAIL
========================================================= */

function openSpiritDetail(id){

    const spirit=
        game.spirits[id];


    openPanel(

        spirit.name,

        `

        <div
            style="
            text-align:center;
            font-size:70px;
            margin:15px;
            ">

            ${spirit.icon}

        </div>


        <p>
            ${spirit.name}이
            너를 바라보고 있다.
        </p>


        <p style="color:#aaa1b8">

            친밀도:
            ${spirit.affection}/3

        </p>


        <p style="color:#dcbfff">

            ${spirit.power}

        </p>


        ${
            !spirit.contracted

            ?

            `
            <button
                class="contract-btn"
                onclick="
                contractSpirit('${id}')
                ">

                정령과 계약한다

            </button>
            `

            :

            `
            <p>
                이미 계약을 맺었다.
            </p>
            `
        }

        `

    );

}


/* =========================================================
   INVENTORY
========================================================= */

function openInventory(){

    openPanel(

        "인벤토리",

        `

        <div class="spirit-card">

            <div class="spirit-icon">
                🌱
            </div>

            <div>

                씨앗

                <strong>
                    ×${game.inventory.seed}
                </strong>

            </div>

        </div>


        <div class="spirit-card">

            <div class="spirit-icon">
                🥕
            </div>

            <div>

                작물

                <strong>
                    ×${game.inventory.crop}
                </strong>

            </div>

        </div>

        `

    );

}


/* =========================================================
   PANEL
========================================================= */

function openPanel(
    title,
    content
){

    document
        .getElementById(
            "panelTitle"
        )
        .textContent=title;


    document
        .getElementById(
            "panelContent"
        )
        .innerHTML=content;


    document
        .getElementById(
            "panel"
        )
        .classList.add("open");

}


function closePanel(){

    document
        .getElementById(
            "panel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );


    toast.innerHTML=message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer=
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    localStorage.setItem(

        "spiritFarmSave",

        JSON.stringify(game)

    );


    showToast(
        "게임을 저장했다."
    );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const save=
        localStorage.getItem(
            "spiritFarmSave"
        );


    if(!save){

        createFarm();

        updateHUD();

        updatePlayer();

        return;

    }


    const data=
        JSON.parse(save);


    Object.assign(
        game,
        data
    );


    createFarm();

    updateCrops();

    updateHUD();

    updatePlayer();


    moveLocation(
        game.location
    );

}


/* =========================================================
   KEY SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
