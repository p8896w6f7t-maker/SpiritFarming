<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>정령의 계절</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    image-rendering:pixelated;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#17151d;
    color:#fff;

    font-family:
        "Courier New",
        monospace;

    touch-action:none;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =========================================================
   GAME
========================================================= */

#game{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#17151d;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:absolute;
    inset:0;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(20,18,27,.45),
            rgba(20,18,27,.78)
        ),
        #506851;
}

.startBox{
    width:min(480px,90vw);

    padding:42px 32px;

    text-align:center;

    background:#292531;

    border:6px solid #111018;

    box-shadow:
        inset 4px 4px 0 #51495e,
        inset -4px -4px 0 #17141c,
        0 20px 60px rgba(0,0,0,.45);
}

.startIcon{
    font-size:68px;

    margin-bottom:8px;
}

.startTitle{
    margin:0;

    color:#ead6f5;

    font-size:32px;

    letter-spacing:3px;
}

.startSub{
    margin:12px 0 28px;

    color:#aaa1b8;

    font-size:11px;

    line-height:1.8;
}

.startButton{
    width:100%;

    padding:16px;

    color:#fff;

    background:#5d4b70;

    border:4px solid #15121a;

    box-shadow:
        inset 3px 3px 0 #8a71a0,
        inset -3px -3px 0 #35293f;

    font-size:14px;
}

.startButton:active{
    transform:translateY(2px);
}

.startNote{
    margin-top:18px;

    color:#77717e;

    font-size:9px;

    line-height:1.7;
}


/* =========================================================
   SAVE SCREEN
========================================================= */

#saveScreen{
    position:absolute;
    inset:0;

    z-index:2100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.84);
}

#saveScreen.open{
    display:flex;
}

.saveBox{
    width:min(620px,92vw);
    max-height:85vh;

    overflow:auto;

    padding:24px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.saveTitle{
    margin-bottom:18px;

    color:#e5c8f5;

    font-size:20px;
}

.saveSlot{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:14px;
    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.saveInfo{
    flex:1;
}

.saveName{
    margin-bottom:5px;

    font-size:13px;
    font-weight:bold;
}

.saveDetail{
    color:#aaa1b8;

    font-size:9px;

    line-height:1.7;
}

.saveButtons{
    display:flex;

    gap:5px;
}

.saveButton,
.backButton{
    padding:9px 11px;

    color:#fff;

    background:#51445e;

    border:3px solid #17131b;

    font-size:9px;
}

.saveButton.new{
    background:#5d4b70;
}

.saveButton.delete{
    background:#49343e;
}

.backButton{
    margin-top:5px;
}


/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;

    left:0;
    right:0;
    top:0;

    height:76px;

    z-index:500;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:9px 18px;

    background:#25222e;

    border-bottom:4px solid #111018;
}

.hudLeft,
.hudRight{
    display:flex;

    gap:9px;
}

.dayBox,
.statBox{
    min-width:115px;

    padding:7px 10px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.hudLabel{
    color:#aaa1b8;

    font-size:9px;
}

.hudValue{
    margin-top:2px;

    font-size:16px;

    font-weight:bold;
}

.spring{
    color:#e8b8ff;
}

.energyBar{
    width:85px;
    height:8px;

    margin-top:3px;

    background:#151319;

    border:2px solid #0c0b0f;
}

.energyFill{
    width:100%;
    height:100%;

    background:#e6a54e;
}

.money{
    color:#f3d46a;
}


/* =========================================================
   MAIN
========================================================= */

#main{
    position:absolute;

    left:0;
    right:0;
    top:76px;
    bottom:0;

    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar{
    width:185px;

    flex-shrink:0;

    padding:12px;

    background:#211e29;

    border-right:4px solid #111018;

    z-index:400;
}

.menuTitle{
    margin:5px;

    color:#aaa1b8;

    font-size:10px;
}

.menuButton{
    width:100%;

    padding:11px 8px;

    margin-bottom:7px;

    color:#fff;

    text-align:left;

    background:#332f3d;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:10px;
}

.menuButton:active{
    background:#584665;
}


/* =========================================================
   SCREEN
========================================================= */

#screen{
    position:relative;

    flex:1;

    min-width:0;

    overflow:hidden;

    background:#637d61;
}

.location{
    position:absolute;

    inset:0;

    display:none;

    overflow:hidden;
}

.location.active{
    display:block;
}

.locationName{
    position:absolute;

    left:16px;
    top:14px;

    padding:7px 12px;

    background:rgba(37,34,46,.88);

    border:3px solid #111018;

    color:#ead8f2;

    font-size:11px;

    z-index:300;
}


/* =========================================================
   FARM
========================================================= */

#farm{
    background:
        linear-gradient(
            #799a70 0 18%,
            #668660 18% 100%
        );
}

.farmPath{
    position:absolute;

    left:0;
    right:0;

    top:65%;

    height:105px;

    background:#c6aa7a;

    border-top:5px solid #987c53;
    border-bottom:5px solid #987c53;
}

.farmExit{
    position:absolute;

    right:0;
    top:53%;

    width:100px;
    height:140px;

    background:#c6aa7a;

    border-top:5px solid #987c53;
    border-bottom:5px solid #987c53;
}

.house{
    position:absolute;

    left:7%;
    top:10%;

    width:215px;
    height:155px;

    background:#b57d61;

    border:6px solid #30221f;

    z-index:20;
}

.houseRoof{
    position:absolute;

    left:-18px;
    top:-54px;

    width:245px;
    height:85px;

    background:#704e5a;

    border:6px solid #30221f;

    transform:skewX(-20deg);
}

.houseDoor{
    position:absolute;

    left:78px;
    bottom:0;

    width:48px;
    height:70px;

    background:#543b36;

    border:5px solid #30221f;
}

.houseWindow{
    position:absolute;

    top:35px;

    width:40px;
    height:40px;

    background:#9ed2d8;

    border:5px solid #30221f;
}

.houseWindow.left{
    left:20px;
}

.houseWindow.right{
    right:20px;
}

.field{
    position:absolute;

    left:35%;
    top:25%;

    display:grid;

    grid-template-columns:
        repeat(5,54px);

    grid-template-rows:
        repeat(4,54px);

    gap:4px;

    padding:8px;

    background:#513c30;

    border:5px solid #30241f;

    z-index:20;
}

.crop{
    width:54px;
    height:54px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#795a3e;

    border:3px solid #4a3528;

    font-size:27px;
}

.crop.watered{
    background:#536d74;
}

.crop.ready{
    animation:pulse 1s infinite;
}

.crop.empty::after{
    content:"+";

    color:#a47b59;
}

@keyframes pulse{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.4);
    }
}

.pond{
    position:absolute;

    right:9%;
    top:18%;

    width:170px;
    height:110px;

    border-radius:50%;

    background:#4b8da0;

    border:7px solid #304e56;

    box-shadow:
        inset 0 8px 0 #71b4c2;

    z-index:15;
}

.tree{
    position:absolute;

    font-size:70px;

    z-index:5;

    pointer-events:none;
}


/* =========================================================
   TOWN
========================================================= */

#town{
    background:
        linear-gradient(
            #99917e 0 30%,
            #817765 30% 100%
        );
}

.townRoadHorizontal{
    position:absolute;

    left:0;
    right:0;

    top:52%;

    height:110px;

    background:#c6aa7a;

    border-top:5px solid #8d7551;
    border-bottom:5px solid #8d7551;
}

.townRoadVertical{
    position:absolute;

    left:50%;
    top:0;

    width:105px;
    height:58%;

    transform:translateX(-50%);

    background:#c6aa7a;

    border-left:5px solid #8d7551;
    border-right:5px solid #8d7551;
}

.townExitForest{
    position:absolute;

    left:calc(50% - 52px);
    top:0;

    width:105px;
    height:65px;

    background:#c6aa7a;

    border-left:5px solid #8d7551;
    border-right:5px solid #8d7551;
}

.townExitSea{
    position:absolute;

    right:0;
    top:42%;

    width:90px;
    height:115px;

    background:#c6aa7a;

    border-top:5px solid #8d7551;
    border-bottom:5px solid #8d7551;
}

.shop{
    position:absolute;

    width:180px;
    height:150px;

    background:#b47765;

    border:6px solid #4a302d;

    z-index:15;
}

.shop1{
    left:8%;
    top:18%;
}

.shop2{
    right:8%;
    top:18%;
}

.shopRoof{
    position:absolute;

    left:-8px;
    top:-42px;

    width:184px;
    height:55px;

    background:#704b57;

    border:6px solid #4a302d;
}

.shopDoor{
    position:absolute;

    left:67px;
    bottom:0;

    width:45px;
    height:70px;

    background:#563d37;

    border:5px solid #4a302d;
}


/* =========================================================
   FOREST
========================================================= */

#forest{
    background:
        linear-gradient(
            #456149 0 30%,
            #334c38 30% 100%
        );
}

.forestGround{
    position:absolute;

    inset:30% 0 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            #526e48 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 70% 40%,
            #526e48 0 4px,
            transparent 5px
        );
}

.forestTree{
    position:absolute;

    font-size:82px;

    z-index:10;

    pointer-events:none;
}

.spiritShrine{
    position:absolute;

    width:150px;
    height:150px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#26372b;

    border:6px solid #17241a;

    box-shadow:
        0 0 30px rgba(190,160,255,.2);

    font-size:72px;

    z-index:30;
}

#earthShrine{
    left:24%;
    top:42%;
}

#forestShrine{
    right:20%;
    top:55%;
}


/* =========================================================
   SEA
========================================================= */

#sea{
    background:
        linear-gradient(
            #80aeb9 0 35%,
            #4e8494 35% 100%
        );
}

.seaWater{
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 25px,
            rgba(255,255,255,.08) 26px 29px
        );
}

.beach{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:30%;

    background:#d0b47e;

    border-top:6px solid #a38859;
}

.dock{
    position:absolute;

    left:42%;
    top:34%;

    width:230px;
    height:90px;

    background:#76533c;

    border:7px solid #493326;

    transform:rotate(-4deg);

    z-index:20;
}

.dockPost{
    position:absolute;

    width:18px;
    height:80px;

    bottom:-55px;

    background:#493326;
}

.dockPost.one{
    left:20px;
}

.dockPost.two{
    right:20px;
}

.boat{
    position:absolute;

    right:12%;
    top:45%;

    font-size:65px;

    z-index:20;
}

.fishingSpot{
    position:absolute;

    left:52%;
    top:29%;

    width:55px;
    height:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#6db0c0;

    border:4px solid #3f737f;

    font-size:23px;

    z-index:30;
}


/* =========================================================
   HOUSE INTERIOR
========================================================= */

#house{
    background:#665246;
}

.houseInterior{
    position:absolute;

    inset:5%;

    background:#8d6c55;

    border:8px solid #392a28;

    overflow:hidden;
}

.interiorWall{
    position:absolute;

    left:0;
    right:0;
    top:0;

    height:28%;

    background:#694b48;

    border-bottom:8px solid #392a28;
}

.interiorFloor{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:72%;

    background:
        repeating-linear-gradient(
            90deg,
            #a17b5c 0 45px,
            #966f53 45px 90px
        );
}

.bed{
    position:absolute;

    left:12%;
    top:18%;

    width:125px;
    height:75px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#76505a;

    border:6px solid #392a28;

    font-size:42px;

    z-index:10;
}

.table{
    position:absolute;

    right:17%;
    top:30%;

    width:100px;
    height:70px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#6c4936;

    border:6px solid #392a28;

    font-size:35px;

    z-index:10;
}

.fireplace{
    position:absolute;

    right:7%;
    top:7%;

    font-size:52px;

    z-index:10;
}

.interiorRug{
    position:absolute;

    left:35%;
    bottom:20%;

    width:230px;
    height:100px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#80566a;

    border:6px solid #503744;

    font-size:35px;

    z-index:5;
}

.interiorExit{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:65px;
    height:75px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#4c3632;

    border:6px solid #302321;

    font-size:30px;

    z-index:20;
}


/* =========================================================
   PLAYER
========================================================= */

#player{
    position:absolute;

    width:50px;
    height:62px;

    transform:
        translate(-50%,-50%);

    z-index:100;

    pointer-events:none;
}

.playerSprite{
    font-size:40px;

    line-height:1;
}

#player.flip .playerSprite{
    transform:scaleX(-1);
}

.playerShadow{
    position:absolute;

    left:50%;
    bottom:-2px;

    width:29px;
    height:7px;

    transform:translateX(-50%);

    background:#2c2630;

    border-radius:50%;

    z-index:-1;
}

.playerName{
    position:absolute;

    left:50%;
    top:-20px;

    transform:translateX(-50%);

    padding:2px 5px;

    background:#27232e;

    border:2px solid #111018;

    font-size:8px;

    white-space:nowrap;
}


/* =========================================================
   NPC
========================================================= */

.npc{
    position:absolute;

    width:52px;
    height:70px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:40px;

    z-index:80;

    transition:
        transform .15s;
}

.npc.near{
    transform:
        translateY(-3px)
        scale(1.06);
}

.npcName{
    position:absolute;

    top:-22px;
    left:50%;

    transform:translateX(-50%);

    padding:2px 5px;

    background:#292531;

    border:2px solid #111018;

    color:#fff;

    font-size:8px;

    white-space:nowrap;
}


/* =========================================================
   INTERACTION
========================================================= */

#interactionButton{
    position:absolute;

    right:20px;
    bottom:105px;

    z-index:500;

    display:none;

    padding:13px 18px;

    color:#fff;

    background:#584665;

    border:4px solid #17131b;

    box-shadow:
        inset 2px 2px 0 #846b92;

    font-size:10px;
}

#interactionButton.show{
    display:block;
}


/* =========================================================
   ACTION BAR
========================================================= */

#actionBar{
    position:absolute;

    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    display:flex;

    gap:6px;

    padding:7px;

    background:#25222e;

    border:4px solid #111018;

    z-index:400;
}

.actionButton{
    width:88px;
    height:42px;

    color:#fff;

    background:#383342;

    border:3px solid #14121a;

    font-size:9px;
}


/* =========================================================
   MOBILE CONTROLS
========================================================= */

#mobileControls{
    position:absolute;

    left:14px;
    bottom:18px;

    width:150px;
    height:150px;

    display:none;

    z-index:500;
}

.control{
    position:absolute;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    background:rgba(37,34,46,.92);

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:20px;
}

.control:active{
    transform:scale(.93);

    background:#655172;
}

.up{
    left:50px;
    top:0;
}

.left{
    left:0;
    top:50px;
}

.down{
    left:50px;
    top:50px;
}

.right{
    left:100px;
    top:50px;
}


/* =========================================================
   PANEL
========================================================= */

#panel{
    position:absolute;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.72);
}

#panel.open{
    display:flex;
}

.panelBox{
    width:min(620px,90vw);
    max-height:82vh;

    overflow:auto;

    padding:22px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.panelClose{
    float:right;

    padding:5px 10px;

    color:#fff;

    background:#4b3948;

    border:3px solid #17131b;
}

.panelTitle{
    margin-bottom:18px;

    color:#e5c8f5;

    font-size:20px;
}

.card{
    padding:13px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.cardTitle{
    margin-bottom:7px;

    font-size:13px;

    font-weight:bold;
}

.cardText{
    color:#aaa1b8;

    font-size:10px;

    line-height:1.7;
}


/* =========================================================
   CHARACTER STATS
========================================================= */

.statRow{
    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;
}

.statName{
    width:55px;

    font-size:10px;
}

.statTrack{
    flex:1;

    height:10px;

    background:#16141a;

    border:2px solid #0d0c10;
}

.statTrackFill{
    height:100%;

    background:#8b6ca2;
}

.statNumber{
    width:25px;

    text-align:right;

    font-size:10px;
}


/* =========================================================
   INVENTORY
========================================================= */

.inventoryGrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.inventoryItem{
    min-height:90px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#332e3b;

    border:3px solid #17141c;

    font-size:28px;
}

.inventoryCount{
    margin-top:6px;

    color:#c5bdca;

    font-size:9px;
}


/* =========================================================
   SPIRIT
========================================================= */

.spiritCard{
    display:flex;

    align-items:center;

    gap:15px;

    padding:12px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.spiritIcon{
    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#24202b;

    border:3px solid #51495e;

    font-size:40px;
}

.spiritName{

<script>

/* =========================================================
   DEFAULT DATA
========================================================= */

const DEFAULT_GAME={

    day:1,

    season:"봄",

    time:360,

    energy:100,

    maxEnergy:100,

    money:500,

    location:"farm",

    saveSlot:1,

    player:{

        x:50,

        y:75,

        speed:.85,

        direction:"down"

    },

    inventory:{

        seed:5,

        crop:0,

        fish:0,

        wood:0,

        stone:0

    },

    stats:{

        level:1,

        exp:0,

        farming:1,

        fishing:1,

        gathering:1,

        strength:1,

        luck:1

    },

    crops:[],

    npc:{

        mina:{
            name:"미나",
            affection:0
        },

        theo:{
            name:"테오",
            affection:0
        },

        luna:{
            name:"루나",
            affection:0
        },

        elder:{
            name:"엘더",
            affection:0
        },

        marin:{
            name:"마린",
            affection:0
        }

    },

    spirits:{

        earth:{
            name:"대지의 정령",
            icon:"🌱",
            affection:0,
            contracted:false,
            power:
                "밭을 개간하고 작물 성장에 도움을 준다."
        },

        water:{
            name:"물의 정령",
            icon:"💧",
            affection:0,
            contracted:false,
            power:
                "물을 주면 주변 밭까지 함께 적신다."
        },

        forest:{
            name:"숲의 정령",
            icon:"🌲",
            affection:0,
            contracted:false,
            power:
                "숲에서 희귀한 채집물을 발견할 확률이 증가한다."
        },

        wind:{
            name:"바람의 정령",
            icon:"🍃",
            affection:0,
            contracted:false,
            power:
                "이동 속도가 빨라진다."
        },

        moon:{
            name:"달의 정령",
            icon:"🌙",
            affection:0,
            contracted:false,
            power:
                "밤에 특별한 힘을 얻는다."
        }

    }

};


/* =========================================================
   GLOBAL
========================================================= */

let game=null;

let keys={};

let nearbyNPC=null;

let nearbySpirit=null;

let selectedCrop=0;

let inactivityTimer=null;

let warningTimer=null;

let toastTimer=null;

let lastFrame=0;


/* =========================================================
   DEFAULT GAME
========================================================= */

function createDefaultGame(){

    const data=
        JSON.parse(
            JSON.stringify(
                DEFAULT_GAME
            )
        );


    for(
        let i=0;
        i<20;
        i++
    ){

        data.crops.push({

            planted:false,

            watered:false,

            grown:false

        });

    }


    return data;

}


/* =========================================================
   SAVE
========================================================= */

function saveKey(slot){

    return "spiritSeasonSave_"+slot;

}


function saveGame(){

    if(!game){

        return;

    }


    localStorage.setItem(
        saveKey(
            game.saveSlot
        ),
        JSON.stringify(game)
    );

}


function manualSave(){

    if(!game){

        return;

    }


    registerActivity();

    saveGame();

    showToast(
        "저장했다."
    );

}


/* =========================================================
   START / SAVE SCREEN
========================================================= */

function showSaveScreen(){

    renderSaveSlots();

    document
        .getElementById("saveScreen")
        .classList.add("open");

}


function hideSaveScreen(){

    document
        .getElementById("saveScreen")
        .classList.remove("open");

}


function renderSaveSlots(){

    const container=
        document.getElementById(
            "saveSlots"
        );


    container.innerHTML="";


    for(
        let slot=1;
        slot<=3;
        slot++
    ){

        const raw=
            localStorage.getItem(
                saveKey(slot)
            );


        const box=
            document.createElement(
                "div"
            );


        box.className="saveSlot";


        if(!raw){

            box.innerHTML=`

                <div class="saveInfo">

                    <div class="saveName">
                        슬롯 ${slot}
                    </div>

                    <div class="saveDetail">
                        비어 있음
                    </div>

                </div>

                <div class="saveButtons">

                    <button
                        class="saveButton new"
                        onclick="
                        startNewGame(${slot})
                        ">

                        새 게임

                    </button>

                </div>

            `;

        }

        else{

            let data=null;


            try{

                data=
                    JSON.parse(raw);

            }

            catch(error){

                data=null;

            }


            if(!data){

                box.innerHTML=`

                    <div class="saveInfo">

                        <div class="saveName">
                            슬롯 ${slot}
                        </div>

                        <div class="saveDetail">
                            저장 데이터 오류
                        </div>

                    </div>

                    <button
                        class="saveButton delete"
                        onclick="
                        deleteSave(${slot})
                        ">

                        삭제

                    </button>

                `;

            }

            else{

                box.innerHTML=`

                    <div class="saveInfo">

                        <div class="saveName">
                            슬롯 ${slot}
                        </div>

                        <div class="saveDetail">

                            ${data.day}일차
                            ·
                            ${data.season}
                            ·
                            ${locationName(
                                data.location
                            )}

                            <br>

                            ₩${data.money}
                            ·
                            Lv.${data.stats.level}

                        </div>

                    </div>

                    <div class="saveButtons">

                        <button
                            class="saveButton"
                            onclick="
                            loadGame(${slot})
                            ">

                            불러오기

                        </button>

                        <button
                            class="saveButton delete"
                            onclick="
                            deleteSave(${slot})
                            ">

                            삭제

                        </button>

                    </div>

                `;

            }

        }

========================================================= */

function startNewGame(slot){

    game=
        createDefaultGame();


    game.saveSlot=slot;


    document
        .getElementById("startScreen")
        .style.display="none";


    document
        .getElementById("saveScreen")
        .classList.remove("open");


    createFarm();


    setLocation(
        "farm",
        true
    );


    updateAll();

    resetInactivityTimer();


    showToast(
        "새로운 하루가 시작되었다."
    );

}


/* =========================================================
   LOAD GAME
========================================================= */

function loadGame(slot){

    const raw=
        localStorage.getItem(
            saveKey(slot)
        );


    if(!raw){

        startNewGame(slot);

        return;

    }


    try{

        game=
            JSON.parse(raw);


        const fresh=
            createDefaultGame();


        game.inventory=
            Object.assign(
                fresh.inventory,
                game.inventory || {}
            );


        game.stats=
            Object.assign(
                fresh.stats,
                game.stats || {}
            );


        game.npc=
            Object.assign(
                fresh.npc,
                game.npc || {}
            );


        game.spirits=
            Object.assign(
                fresh.spirits,
                game.spirits || {}
            );


        if(
            !Array.isArray(
                game.crops
            )
        ){

            game.crops=
                fresh.crops;

        }


        while(
            game.crops.length<20
        ){

            game.crops.push({

                planted:false,

                watered:false,

                grown:false

            });

        }


        if(
            !game.player
        ){

            game.player=
                fresh.player;

        }


        game.saveSlot=slot;


        document
            .getElementById("startScreen")
            .style.display="none";


        document
            .getElementById("saveScreen")
            .classList.remove("open");


        createFarm();


        setLocation(
            game.location || "farm",
            true
        );


        updateAll();

        resetInactivityTimer();


        showToast(
            "슬롯 "+
            slot+
            "을 불러왔다."
        );

    }

    catch(error){

        console.error(error);

        alert(
            "저장 데이터를 불러오지 못했습니다."
        );

    }

}


function deleteSave(slot){

    if(
        !confirm(
            "슬롯 "+
            slot+
            "의 저장 데이터를 삭제할까요?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        saveKey(slot)
    );


    renderSaveSlots();

}


/* =========================================================
   FARM
========================================================= */

function createFarm(){

    const field=
        document.getElementById(
            "field"
        );


    field.innerHTML="";


    for(
        let i=0;
        i<20;
        i++
    ){

        const tile=
            document.createElement(
                "div"
            );


        tile.className="crop";


        tile.addEventListener(
            "click",
            function(){

                selectedCrop=i;

                updateCropInfo();

            }
        );


        field.appendChild(tile);

    }


    updateCrops();

}


function updateCrops(){

    if(!game){

        return;

    }


    const tiles=
        document.querySelectorAll(
            ".crop"
        );


    tiles.forEach(
        function(tile,index){

            const crop=
                game.crops[index];


            tile.className="crop";


            if(
                !crop.planted
            ){

                tile.classList.add(
                    "empty"
                );

                tile.textContent="";

                return;

            }


            if(
                crop.grown
            ){

                tile.classList.add(
                    "ready"
                );

                tile.textContent="🥕";

            }

            else{

                tile.textContent="🌱";

            }


            if(
                crop.watered
            ){

                tile.classList.add(
                    "watered"
                );

            }

        }
    );

}

function updateAll(){

    if(!game){

        return;

    }


    document.getElementById(
        "day"
    ).textContent=
        game.day;


    document.getElementById(
        "time"
    ).textContent=
        formatTime(
            game.time
        );


    document.getElementById(
        "energy"
    ).textContent=
        game.energy;


    document.getElementById(
        "money"
    ).textContent=
        game.money;


    document.getElementById(
        "energyFill"
    ).style.width=
        (
            game.energy/
            game.maxEnergy*
            100
        )+"%";


    document.getElementById(
        "locationLabel"
    ).textContent=
        locationName(
            game.location
        );


    updatePlayer();

    updateNearby();

    updateCrops();

}


function formatTime(minutes){

    let h=
        Math.floor(
            minutes/60
        );


    let m=
        minutes%60;


    if(h>23){

        h=23;

        m=59;

    }


    return(
        String(h).padStart(2,"0")
        +
        ":"
        +
        String(m).padStart(2,"0")
    );

}


function addTime(minutes){

    game.time+=minutes;


    if(
        game.time>=1440
    ){

        game.time=1440;

    }


    updateAll();

}

function locationName(location){

    const names={

        farm:"농장",

        town:"마을",

        forest:"숲",

        sea:"바다",

        house:"집"

    };


    return(
        names[location] ||
        location
    );

}


function setLocation(
    location,
    silent=false
){

    if(!game){

        return;

    }


    game.location=
        location;


    document
        .querySelectorAll(
            ".location"
        )
        .forEach(
            el=>{
                el.classList.remove(
                    "active"
                );
            }
        );


    const target=
        document.getElementById(
            location
        );


    if(!target){

        game.location="farm";

        document
            .getElementById("farm")
            .classList.add("active");

        return;

    }


    target.classList.add(
        "active"
    );


    /*
       지역 입구 위치
    */

    if(
        location==="farm"
    ){

        if(
            game.player.x<20
        ){

            game.player.x=92;

        }

        game.player.y=67;

    }


    if(
        location==="town"
    ){

        if(
            game.player.x>80
        ){

            game.player.x=7;

            game.player.y=68;

        }

        else if(
            game.player.y<20
        ){

            game.player.x=50;

            game.player.y=88;

        }

        else if(
            game.player.y>85
        ){

            game.player.x=50;

            game.player.y=12;

        }

    }


    if(
        location==="forest"
    ){

        game.player.x=50;

        game.player.y=88;

    }


    if(
        location==="sea"
    ){

        game.player.x=8;

        game.player.y=68;

    }


    if(
        location==="house"
    ){

        game.player.x=50;

        game.player.y=82;

    }


    updateAll();


    if(!silent){

        showToast(
            locationName(location)
        );

    }

}

/* =========================================================
   MOVE
========================================================= */

function movePlayer(){

    if(!game){

        return;

    }


    if(
        document
            .getElementById("panel")
            .classList
            .contains("open")
    ){

        return;

    }


    let dx=0;

    let dy=0;


    if(
        keys.ArrowLeft ||
        keys.a ||
        keys.A
    ){

        dx=-1;

        game.player.direction=
            "left";

    }


    if(
        keys.ArrowRight ||
        keys.d ||
        keys.D
    ){

        dx=1;

        game.player.direction=
            "right";

    }


    if(
        keys.ArrowUp ||
        keys.w ||
        keys.W
    ){

        dy=-1;

        game.player.direction=
            "up";

    }


    if(
        keys.ArrowDown ||
        keys.s ||
        keys.S
    ){

        dy=1;

        game.player.direction=
            "down";

    }


    if(
        dx===0 &&
        dy===0
    ){

        return;

    }


    if(
        dx!==0 &&
        dy!==0
    ){

        dx*=.707;

        dy*=.707;

    }


    let speed=
        game.player.speed;


    /*
       바람의 정령 계약
    */

    if(
        game.spirits.wind &&
        game.spirits.wind.contracted
    ){

        speed=
            game.player.speed*
            1.25;

    }


    const nx=
        game.player.x+
        dx*speed;


    const ny=
        game.player.y+
        dy*speed;


    if(
        canMove(nx,ny)
    ){

        game.player.x=nx;

        game.player.y=ny;

    }


    updatePlayer();

    checkTransitions();

    updateNearby();

}


/* =========================================================
   COLLISION
========================================================= */

function canMove(x,y){

    if(
        x<1 ||
        x>99 ||
        y<1 ||
        y>99
    ){

        return false;

    }


    /* FARM */

    if(
        game.location==="farm"
    ){

        /*
           집 본체
        */

        if(
            inside(
                x,
                y,
                7,
                9,
                22,
                28
            )
        ){

            /*
               문 앞 통과 허용
            */

            if(
                !(
                    x>=13 &&
                    x<=21 &&
                    y>=26 &&
                    y<=35
                )
            ){

                return false;

            }

        }


        /*
           밭
        */

        if(
            inside(
                x,
                y,
                34,
                24,
                30,
                31
            )
        ){

            return false;

        }


        /*
           연못
        */

        if(
            ellipse(
                x,
                y,
                91,
                23,
                8,
                7
            )
        ){

            return false;

        }

    }


    /* TOWN */

    if(
        game.location==="town"
    ){

        if(
            inside(
                x,
                y,
                8,
                18,
                26,
                28
            )
        ){

            return false;

        }


        if(
            inside(
                x,
                y,
                66,
                18,
                26,
                28
            )
        ){

            return false;

        }

    }


    /* FOREST */

    if(
        game.location==="forest"
    ){

        if(
            ellipse(
                x,
                y,
                31,
                49,
                10,
                10
            )
        ){

            return false;

        }


        if(
            ellipse(
                x,
                y,
                79,
                62,
                10,
                10
            )
        ){

            return false;

        }

    }


    /* SEA */

    if(
        game.location==="sea"
    ){

        if(
            y<25
        ){

            return false;

        }

    }


    /* HOUSE */

    if(
        game.location==="house"
    ){

        /*
           침대
        */

        if(
            inside(
                x,
                y,
                12,
                18,
                25,
                18
            )
        ){

            return false;

        }


        /*
           테이블
        */

        if(
            inside(
                x,
                y,
                67,
                30,
                22,
                22
            )
        ){

            return false;

        }


        /*
           벽난로
        */

        if(
            inside(
                x,
                y,
                83,
                5,
                12,
                18
            )
        ){

            return false;

        }

    }


    return true;

}


function inside(
    x,
    y,
    left,
    top,
    width,
    height
){

    return(
        x>left &&
        x<left+width &&
        y>top &&
        y<top+height
    );

}


function ellipse(
    x,
    y,
    cx,
    cy,
    rx,
    ry
){

    const dx=
        (x-cx)/rx;

    const dy=
        (y-cy)/ry;


    return(
        dx*dx+
        dy*dy<1
    );

}


/* =========================================================
   TRANSITIONS
========================================================= */

function checkTransitions(){

    /*
       FARM → HOUSE
    */

    if(
        game.location==="farm" &&
        game.player.x>=13 &&
        game.player.x<=21 &&
        game.player.y>=28 &&
        game.player.y<=36
    ){

        game.player.x=50;

        game.player.y=82;

        setLocation(
            "house"
        );

        return;

    }


    /*
       HOUSE → FARM
    */

    if(
        game.location==="house" &&
        game.player.x>=43 &&
        game.player.x<=57 &&
        game.player.y>=96
    ){

        game.player.x=17;

        game.player.y=37;

        setLocation(
            "farm"
        );

        return;

    }


    /*
       FARM → TOWN
    */

    if(
        game.location==="farm" &&
        game.player.x>=98 &&
        game.player.y>=53 &&
        game.player.y<=83
    ){

        game.player.x=8;

        game.player.y=68;

        setLocation(
            "town"
        );

        return;

    }


    /*
       TOWN → FARM
    */

    if(
        game.location==="town" &&
        game.player.x<=2 &&
        game.player.y>=53 &&
        game.player.y<=83
    ){

        game.player.x=92;

        game.player.y=68;

        setLocation(
            "farm"
        );

        return;

    }


    /*
       TOWN → FOREST
    */

    if(
        game.location==="town" &&
        game.player.y<=2 &&
        game.player.x>=43 &&
        game.player.x<=57
    ){

        game.player.x=50;

        game.player.y=88;

        setLocation(
            "forest"
        );

        return;

    }


    /*
       FOREST → TOWN
    */

    if(
        game.location==="forest" &&
        game.player.y>=98 &&
        game.player.x>=43 &&
        game.player.x<=57
    ){

        game.player.x=50;

        game.player.y=12;

        setLocation(
            "town"
        );

        return;

    }


    /*
       TOWN → SEA
    */

    if(
        game.location==="town" &&
        game.player.x>=98 &&
        game.player.y>=40 &&
        game.player.y<=60
    ){

        game.player.x=8;

        game.player.y=68;

        setLocation(
            "sea"
        );

        return;

    }


    /*
       SEA → TOWN
    */

    if(
        game.location==="sea" &&
        game.player.x<=2 &&
        game.player.y>=40 &&
        game.player.y<=85
    ){

        game.player.x=92;

        game.player.y=52;

        setLocation(
            "town"
        );

    }

}

function updatePlayer(){

    if(!game){

        return;

    }


    const player=
        document.getElementById(
            "player"
        );


    player.style.left=
        game.player.x+"%";


    player.style.top=
        game.player.y+"%";


    if(
        game.player.direction==="left"
    ){

        player.classList.add(

        );

    }

    else if(
        game.player.direction==="right"
    ){

        player.classList.remove(
            "flip"
        );

    }

}


/* =========================================================
   NEARBY
========================================================= */

function distance(a,b){

    const dx=
        a.x-b.x;

    const dy=
        a.y-b.y;


    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


function updateNearby(){

    if(!game){

        return;

    }


    nearbyNPC=null;

    nearbySpirit=null;


    let nearestNPCDistance=999;


    const screen=
        document.getElementById(
            "screen"
        );


    const screenRect=
        screen.getBoundingClientRect();


    /*
       NPC
    */

    document
        .querySelectorAll(
            ".npc"
        )
        .forEach(
            npc=>{

                /*
                   현재 지역의 NPC만 검사
                */

                const location=
                    npc.closest(
                        ".location"
                    );


                if(
                    !location ||
                    !location.classList.contains(
                        "active"
                    )
                ){

                    npc.classList.remove(
                        "near"
                    );

                    return;

                }


                const rect=
                    npc.getBoundingClientRect();


                const nx=
                    (
                        rect.left+
                        rect.width/2-
                        screenRect.left
                    )/
                    screenRect.width*
                    100;


                const ny=
                    (
                        rect.top+
                        rect.height/2-
                        screenRect.top
                    )/
                    screenRect.height*
                    100;


                const d=
                    distance(
                        game.player,
                        {
                            x:nx,
                            y:ny
                        }
                    );


                npc.classList.remove(
                    "near"
                );


                if(
                    d<13 &&
                    d<nearestNPCDistance
                ){

                    nearestNPCDistance=d;

                    nearbyNPC=
                        npc.dataset.npc;

                    npc.classList.add(
                        "near"
                    );

                }

            }
        );


    /*
       SPIRITS
    */

    document
        .querySelectorAll(
            ".spiritShrine"
        )
        .forEach(
            shrine=>{

                const location=
                    shrine.closest(
                        ".location"
                    );


                if(
                    !location ||
                    !location.classList.contains(
                        "active"
                    )
                ){

                    return;

                }


                const rect=
                    shrine.getBoundingClientRect();


                const sx=
                    (
                        rect.left+
                        rect.width/2-
                        screenRect.left
                    )/
                    screenRect.width*
                    100;


                const sy=
                    (
                        rect.top+
                        rect.height/2-
                        screenRect.top
                    )/
                    screenRect.height*
                    100;


                const d=
                    distance(
                        game.player,
                        {
                            x:sx,
                            y:sy
                        }
                    );


                if(
                    d<14
                ){

                    nearbySpirit=
                        shrine.dataset.spirit;

                }

            }
        );


    const button=
        document.getElementById(
            "interactionButton"
        );


    if(
        nearbyNPC ||
        nearbySpirit
    ){

        button.classList.add(
            "show"
        );

    }

    else{

        button.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   INTERACT
========================================================= */

function interactNearby(){

    registerActivity();


    if(
        nearbyNPC
    ){

        interactNPC(
            nearbyNPC
        );

        return;

    }


    if(
        nearbySpirit
    ){

        interactSpirit(
            nearbySpirit
        );

        return;

    }


    /*
       집에서 침대 근처라면 취침
    */

    if(
        game.location==="house" &&
        distance(
            game.player,
            {
                x:24,
                y:27
            }
        )<15
    ){

        sleep();

        return;

    }


    showToast(
        "주변에 상호작용할 대상이 없다."
    );

}

/* =========================================================
   NPC INTERACTION
========================================================= */

function interactNPC(id){

    const npc=
        NPC_DIALOGUE[id];


    const data=
        game.npc[id];


    if(
        !npc ||
        !data
    ){

        return;

    }


    let text;


    if(
        data.affection>=5
    ){

        text=
            npc.special;

    }

    else{

        text=
            npc.normal[
                Math.floor(
                    Math.random()*
                    npc.normal.length
                )
            ];

    }


    openDialogue(
        id,
        text
    );

}

/* =========================================================
   DIALOGUE CHOICE
========================================================= */

function chooseDialogue(
    id,
    choiceIndex
){

    registerActivity();


    const npc=
        NPC_DIALOGUE[id];


    const choice=
        npc.choices[
            choiceIndex
        ];


    if(!choice){

        return;

    }


    game.npc[id].affection=
        Math.max(
            0,
            Math.min(
                10,
                game.npc[id].affection+
                choice.affection
            )
        );


    game.stats.exp+=3;


    checkLevel();


    let changeText;


    if(
        choice.affection>1
    ){

        changeText=
            "호감도 ++";

    }

    else if(
        choice.affection>0
    ){

        changeText=
            "호감도 +";

    }

    else{

        changeText=
            "호감도 -";

    }


    openPanel(
        npc.name,
        `

        <div class="dialogue">

            <div class="dialogueName">

                ${npc.icon}

                ${npc.name}

            </div>


            <div class="dialogueText">

                ${choice.reply}

            </div>


            <div
                class="cardText"
                style="
                margin-top:14px;
                color:
                ${
                    choice.affection>=0
                    ? "#dcbfff"
                    : "#c58b9d"
                };
                ">

                ${changeText}

                <br>

                현재 호감도:
                ${game.npc[id].affection}/10

            </div>


            <div class="dialogueActions">

                <button
                    class="dialogueButton"
                    onclick="
                    openDialogue(
                        '${id}',
                        '${escapeHTML(
                            npc.special
                        )}'
                    )
                    ">

                    계속 이야기

                </button>


                <button
                    class="dialogueButton"
                    onclick="
                    closePanel()
                    ">

                    대화 끝내기

                </button>

            </div>

        </div>

        `
    );


    saveGame();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return text
        .replace(/'/g,"&#39;")
        .replace(/"/g,"&quot;");

}


/* =========================================================
   GIFT
========================================================= */

function giveGift(id){

    registerActivity();


    if(
        game.inventory.crop<=0 &&
        game.inventory.fish<=0
    ){

        showToast(
            "선물할 아이템이 없다."
        );

        return;

    }


    if(
        game.inventory.crop>0
    ){

        game.inventory.crop--;

    }

    else{

        game.inventory.fish--;

    }


    game.npc[id].affection=
        Math.min(
            10,
            game.npc[id].affection+1
        );


    game.stats.exp+=5;


    checkLevel();

    saveGame();


    openPanel(
        NPC_DIALOGUE[id].name,
        `

        <div class="dialogue">

            <div class="dialogueName">

                ${NPC_DIALOGUE[id].icon}

                ${NPC_DIALOGUE[id].name}

            </div>

        `

}


/* =========================================================
   SPIRIT
========================================================= */

function interactSpirit(id){

    const spirit=
        game.spirits[id];


    if(!spirit){

        return;

    }


    if(
        spirit.contracted
    ){

        showToast(
            spirit.name+
            "과 이미 계약했다."
        );

        return;

    }


    spirit.affection=
        Math.min(
            5,
            spirit.affection+1
        );


    showToast(
        spirit.name+
        "의 호감도 +1"
    );


    openSpirits();

}


function openSpirits(){

    registerActivity();


    let html="";


    Object.entries(
        game.spirits
    )
    .forEach(
        ([id,spirit])=>{

            let hearts="";


            for(
                let i=0;
                i<5;
                i++
            ){

                hearts+=
                    i<
                    spirit.affection
                    ? "♥"
                    : "♡";

            }


            html+=`

            <div class="spiritCard">

                <div class="spiritIcon">

                    ${spirit.icon}

                </div>


                <div style="flex:1;">

                    <div class="spiritName">

                        ${spirit.name}

                    </div>


                    <div class="hearts">

                        ${hearts}

                    </div>


                    <div
                        class="cardText"
                        style="
                        margin-top:5px;
                        ">

                        ${
                            spirit.contracted
                            ?
                            "계약 완료"
                            :
                            "계약 전"
                        }

                    </div>


                    <div
                        class="cardText"
                        style="
                        margin-top:6px;
                        color:#dcbfff;
                        ">

                        능력:
                        ${spirit.power}

                    </div>


                    ${
                        spirit.contracted
                        ?
                        ""
                        :
                        `

                        <button
                            class="contractButton"
                            onclick="
                            contractSpirit(
                                '${id}'
                            )
                            "
                            ${
                                spirit.affection<3
                                ?
                                "disabled"
                                :
                                ""
                            }>

                            ${
                                spirit.affection>=3
                                ?
                                "계약하기"
                                :
                                "호감도 3 필요"
                            }

                        </button>

                        `
                    }

                </div>

            </div>

            `;

        }
    );


    openPanel(
        "정령 계약",
        html
    );

}


/* =========================================================
   CONTRACT SPIRIT
========================================================= */

function contractSpirit(id){

    registerActivity();


    const spirit=
        game.spirits[id];


    if(
        spirit.affection<3
    ){

        showToast(
            "정령과 조금 더 가까워져야 한다."
        );

        return;

    }


    spirit.contracted=true;


    if(
        id==="wind"
    ){

        game.player.speed=
            1.15;

    }


    if(
        id==="moon"
    ){

        game.stats.luck+=2;

    }


    saveGame();


    openSpirits();


    showToast(
        spirit.name+
        "과 계약했다!"
    );

}

========================================================= */

document
    .getElementById(
        "fishingSpot"
    )
    .addEventListener(
        "click",
        function(){

            fish();

        }
    );


function fish(){

    registerActivity();


    if(
        game.location!=="sea"
    ){

        return;

    }


    if(
        game.energy<5
    ){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.energy-=5;

    addTime(20);


    const rare=
        Math.random()<
        (
            .1+
            game.stats.luck*.02
        );


    if(rare){

        game.inventory.fish++;

        game.money+=150;

        game.stats.exp+=20;


        showToast(
            "희귀한 물고기를 잡았다! +₩150"
        );

    }

    else{

        game.inventory.fish++;

        game.money+=50;

        game.stats.exp+=8;


        showToast(
            "물고기를 잡았다! +₩50"
        );

    }


    game.stats.fishing++;


    checkLevel();

    updateAll();

}

/* =========================================================
   PLANT
========================================================= */

function plantCrop(){

    registerActivity();


    if(
        game.location!=="farm"
    ){

        showToast(
            "농장에서만 심을 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            selectedCrop
        ];


    if(
        crop.planted
    ){

        showToast(
            "이미 작물이 있다."
        );

        return;

    }


    if(
        game.inventory.seed<=0
    ){

        showToast(
            "씨앗이 없다."
        );

        return;

    }


    if(
        game.energy<5
    ){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.inventory.seed--;

    game.energy-=5;

    crop.planted=true;

    crop.watered=false;

    crop.grown=false;

    game.stats.farming++;

    addTime(10);

    updateAll();


    showToast(
        "씨앗을 심었다."
    );

}

   WATER
========================================================= */

function waterCrop(){

    registerActivity();


    if(
        game.location!=="farm"
    ){

        showToast(
            "농장에서만 물을 줄 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            selectedCrop
        ];


    if(
        !crop.planted
    ){

        showToast(
            "작물이 없다."
        );

        return;

    }


    if(
        crop.grown
    ){

        showToast(
            "이미 다 자랐다."
        );

        return;

    }


    if(
        crop.watered
    ){

        showToast(
            "이미 물을 줬다."
        );

        return;

    }


    if(
        game.energy<3
    ){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.energy-=3;

    crop.watered=true;


    /*
       물의 정령
    */

    if(
        game.spirits.water.contracted
    ){

        [
            selectedCrop-1,
            selectedCrop+1,
            selectedCrop-5,
            selectedCrop+5
        ]
        .forEach(
            index=>{

                if(
                    game.crops[index]
                ){

                    game.crops[index]
                        .watered=true;

                }

            }
        );

    }


    addTime(5);

    updateAll();


    showToast(
        "물을 줬다."
    );

}

/* =========================================================
   SLEEP
========================================================= */

function sleep(){

    registerActivity();


    if(
        game.location!=="house"
    ){

        showToast(
            "집의 침대에서 자야 한다."
        );

        return;

    }


    game.day++;

    game.time=360;

    game.energy=
        game.maxEnergy;


    game.crops.forEach(
        crop=>{

            if(
                crop.planted &&
                crop.watered
            ){

                crop.grown=true;

            }

            crop.watered=false;

        }
    );


    saveGame();

    updateAll();


    showToast(
        game.day+
        "일째 아침이 되었다."
    );

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

    const required=
        game.stats.level*100;


    if(
        game.stats.exp>=required
    ){

        game.stats.exp-=required;

        game.stats.level++;

        game.maxEnergy+=5;

        game.energy=
            game.maxEnergy;


        showToast(
            "레벨 업! Lv."+
            game.stats.level
        );

    }

}

/* =========================================================
   PANEL
========================================================= */

function openPanel(
    title,
    content
){

    document
        .getElementById(
            "panelTitle"
        )
        .textContent=title;


    document
        .getElementById(
            "panelContent"
        )
        .innerHTML=content;


    document
        .getElementById(
            "panel"
        )
        .classList.add("open");

}


function closePanel(){

    document
        .getElementById(
            "panel"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );


    toast.innerHTML=
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer=
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   INACTIVITY
========================================================= */

const INACTIVE_TIME=
    10*60*1000;

const WARNING_TIME=
    9*60*1000;


function resetInactivityTimer(){

    if(!game){

        return;

    }


    clearTimeout(
        inactivityTimer
    );

    clearTimeout(
        warningTimer
    );


    document
        .getElementById(
            "inactiveWarning"
        )
        .classList.remove(
            "show"
        );


    warningTimer=
        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "inactiveWarning"
                    )
                    .classList.add(
                        "show"
                    );

            },
            WARNING_TIME
        );


    inactivityTimer=
        setTimeout(
            ()=>{

                saveGame();

                stopGame();

            },
            INACTIVE_TIME
        );

}


function registerActivity(){

    if(!game){

        return;

    }


    resetInactivityTimer();

}


function stopGame(){

    clearTimeout(
        inactivityTimer
    );

    clearTimeout(
        warningTimer
    );


    keys={};


    closePanel();


    document
        .getElementById(
            "startScreen"
        )
        .style.display="flex";


    document
        .getElementById(
            "saveScreen"
        )
        .classList.remove(
            "open"
        );


    game=null;

}


/* =========================================================
   GLOBAL ACTIVITY
========================================================= */

[
    "mousedown",
    "touchstart",
    "pointerdown"
]
.forEach(
    eventName=>{

        document.addEventListener(
            eventName,
            function(){

                registerActivity();

            },
            {
                passive:true
            }
        );

    }
);


/* =========================================================
   INITIAL
========================================================= */

createFarm();


document
    .getElementById(
        "startScreen"
    )
    .style.display="flex";


</script>
