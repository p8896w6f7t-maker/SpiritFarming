<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta
    name="format-detection"
    content="telephone=no"
>

<title>정령의 계절</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10151c;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
    user-select:none;
}

button{
    font:inherit;
    border:0;
    cursor:pointer;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* =========================
   START
========================= */

#startScreen,
#saveScreen{
    position:absolute;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 30%,#445e73 0%,#1b2632 40%,#0c1117 100%);
}

.startBox,
.saveBox{
    width:min(92vw,520px);
    padding:42px 30px;
    border-radius:28px;
    background:rgba(17,24,32,.94);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
    text-align:center;
    color:white;
}

.startTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:10px;
}

.startSub{
    color:#aeb8c3;
    margin-bottom:35px;
}

/* =========================
   CHARACTER SETUP
========================= */

.characterSetup{
    margin:0 auto 18px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    text-align:left;
}

.setupLabel{
    margin-bottom:6px;
    color:#dbe2e8;
    font-size:12px;
    font-weight:900;
}

.nicknameInput{
    width:100%;
    padding:11px 12px;
    margin-bottom:13px;
    border:1px solid #3a4855;
    border-radius:9px;
    outline:none;
    background:#202b37;
    color:white;
    font-size:13px;
}

.nicknameInput:focus{
    border-color:#e5c36a;
}

.nicknameInput::placeholder{
    color:#7f8b96;
}

.outfitColors{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.outfitColor{
    width:29px;
    height:29px;
    padding:0;
    border-radius:50%;
    border:3px solid transparent;
    box-shadow:0 2px 7px rgba(0,0,0,.25);
}

.outfitColor.active{
    border-color:white;
    box-shadow:0 0 0 2px #e5c36a;
}

.playerNickname{
    position:absolute;
    left:50%;
    top:-19px;
    transform:translateX(-50%);
    padding:2px 6px;
    border-radius:5px;
    background:rgba(12,17,23,.78);
    color:white;
    font-size:10px;
    font-weight:900;
    line-height:1.2;
    white-space:nowrap;
    text-shadow:0 1px 2px #000;
}

.mainStartBtn{
    width:100%;
    padding:18px;
    border-radius:15px;
    background:#e5c36a;
    color:#302817;
    font-size:20px;
    font-weight:900;
}

.mainStartBtn:active{
    transform:scale(.97);
}

.hidden{
    display:none !important;
}

/* =========================
   SAVE
========================= */

.saveBox h2{
    margin-bottom:22px;
}

.saveSlots{
    display:grid;
    gap:12px;
}

.saveSlot{
    padding:18px;
    border-radius:16px;
    background:#202b37;
    color:white;
    text-align:left;
    border:1px solid #334252;
}

.saveSlot:hover{
    background:#2b3948;
}

.saveSlotTitle{
    font-weight:900;
    margin-bottom:6px;
}

.saveSlotInfo{
    color:#aeb8c3;
    font-size:13px;
}

.saveSlotButtons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.saveSlotButtons button{
    padding:8px 12px;
    border-radius:9px;
    background:#e5c36a;
    color:#292218;
    font-weight:800;
}

.saveSlotButtons .deleteBtn{
    background:#553139;
    color:#ffdce1;
}

.backBtn{
    margin-top:18px;
    padding:11px 20px;
    border-radius:10px;
    background:#333e49;
    color:#ddd;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    left:15px;
    right:15px;
    top:15px;
    z-index:100;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudLeft,
.hudRight{
    display:flex;
    gap:8px;
}

.hudItem{
    padding:9px 13px;
    border-radius:12px;
    background:rgba(16,22,29,.82);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:13px;
    backdrop-filter:blur(8px);
}

#money{
    color:#f0d36e;
    font-weight:900;
}

/* =========================
   MAIN
========================= */

#main{
    position:absolute;
    inset:0;
}

#screen{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.location{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.location::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08),
            transparent 30%,
            rgba(0,0,0,.15)
        );
}

/* =========================
   FARM
========================= */

#farm{
    background:
        linear-gradient(
            #91b86a 0 28%,
            #b2c978 28% 100%
        );
}

.farmHouse{
    position:absolute;
    left:9%;
    top:8%;
    width:27%;
    height:27%;
    min-width:190px;
    min-height:150px;
    background:#b87554;
    border:8px solid #6a4035;
    border-radius:12px;
    z-index:5;
}

.farmHouseRoof{
    position:absolute;
    left:-10px;
    top:-55px;
    width:calc(100% + 20px);
    height:75px;
    background:#754d55;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.farmHouseDoor{
    position:absolute;
    left:40%;
    bottom:-2px;
    width:20%;
    height:32%;
    min-width:38px;
    background:#4b3028;
    border:4px solid #2e211c;
    border-radius:7px 7px 0 0;
    z-index:10;
}

.farmHouseDoor::after{
    content:"E";
    position:absolute;
    left:50%;
    top:-30px;
    transform:translateX(-50%);
    padding:2px 7px;
    border-radius:5px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:11px;
}

.field{
    position:absolute;
    left:40%;
    top:45%;
    width:45%;
    height:40%;
    background:#8d6849;
    border:7px solid #6b4d38;
    border-radius:8px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:6px;
    padding:8px;
}

.cropTile{
    background:#a67d56;
    border-radius:4px;
    position:relative;
}

.cropTile.watered{
    background:#647d78;
}

.crop{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
}

.farmTree{
    position:absolute;
    font-size:58px;
    z-index:3;
}

.tree1{left:4%;top:48%;}
.tree2{left:86%;top:15%;}
.tree3{left:90%;top:70%;}
.tree4{left:24%;top:70%;}

.pond{
    position:absolute;
    left:8%;
    bottom:10%;
    width:25%;
    height:25%;
    border-radius:50%;
    background:#5b9eb0;
    border:7px solid #42767f;
}

/* =========================
   TOWN
========================= */

#town{
    background:
        linear-gradient(
            #9bc4d1 0 30%,
            #c9b89a 30% 100%
        );
}

.townRoad{
    position:absolute;
    left:0;
    right:0;
    top:47%;
    height:25%;
    background:#b69d7c;
}

.townBuilding{
    position:absolute;
    width:23%;
    height:24%;
    background:#d59c78;
    border:6px solid #704d43;
    border-radius:10px;
}

.building1{
    left:8%;
    top:13%;
}

.building2{
    right:8%;
    top:13%;
}

.shopBuilding{
    left:38%;
    top:9%;
    width:25%;
    height:30%;
    background:#c98560;
    border-color:#674239;
}

.shopSign{
    position:absolute;
    top:-34px;
    left:50%;
    transform:translateX(-50%);
    padding:5px 16px;
    border-radius:8px;
    background:#e6c66d;
    color:#392e1c;
    font-weight:900;
    white-space:nowrap;
}

/* =========================
   FOREST
========================= */

#forest{
    background:
        linear-gradient(
            #4e7d59,
            #294c37
        );
}

.forestTree{
    position:absolute;
    font-size:70px;
}

.ft1{left:5%;top:8%;}
.ft2{left:25%;top:25%;}
.ft3{right:10%;top:10%;}
.ft4{right:30%;bottom:10%;}
.ft5{left:8%;bottom:12%;}

.shrine{
    position:absolute;
    left:43%;
    top:42%;
    width:15%;
    height:20%;
    min-width:100px;
    min-height:100px;
    border-radius:50%;
    background:#775a92;
    border:8px solid #4d3b61;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

/* =========================
   SEA
========================= */

#sea{
    background:
        linear-gradient(
            #73b6cb,
            #32798f
        );
}

.wave{
    position:absolute;
    color:rgba(255,255,255,.25);
    font-size:55px;
}

.w1{left:10%;top:25%;}
.w2{left:45%;top:15%;}
.w3{right:10%;top:35%;}
.w4{left:25%;bottom:20%;}
.w5{right:30%;bottom:10%;}

.dock{
    position:absolute;
    right:0;
    top:37%;
    width:30%;
    height:25%;
    background:#8c6549;
}

/* =========================
   HOUSE
========================= */

#house{
    background:
        linear-gradient(
            #b98663 0 22%,
            #d8bb91 22% 100%
        );
}

.houseFloor{
    position:absolute;
    left:5%;
    top:25%;
    width:90%;
    height:65%;
    background:#cba87b;
    border:8px solid #795544;
    border-radius:10px;
}

.houseBed{
    position:absolute;
    left:10%;
    top:15%;
    width:28%;
    height:30%;
    background:#e3e6eb;
    border:8px solid #694e4b;
    border-radius:10px;
}

.houseTable{
    position:absolute;
    right:15%;
    top:22%;
    width:22%;
    height:20%;
    background:#80583e;
    border:6px solid #573a2c;
}

.houseChest{
    position:absolute;
    right:17%;
    bottom:15%;
    width:18%;
    height:13%;
    background:#90623f;
    border:5px solid #573a2c;
}

.houseDoorInside{
    position:absolute;
    left:45%;
    bottom:-1px;
    width:10%;
    min-width:55px;
    height:18%;
    background:#4b3028;
    border:5px solid #2e211c;
    z-index:10;
}

/* =========================
   PLAYER
========================= */

#player{
    position:absolute;
    width:48px;
    height:58px;
    z-index:50;
    transform:translate(-50%,-50%);
    transition:transform .04s linear;
    pointer-events:none;
}

.playerBody{
    position:absolute;
    left:8px;
    bottom:0;
    width:32px;
    height:39px;
    background:#5476a5;
    border-radius:10px 10px 6px 6px;
    border:3px solid #27394f;
}

.playerHead{
    position:absolute;
    left:9px;
    top:0;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#efc39e;
    border:3px solid #6a483c;
}

 .playerHair{
    position:absolute;
    left:7px;
    top:-3px;
    width:34px;
    height:17px;
    background:#4c342e;
    border-radius:18px 18px 7px 7px;
    transition:all .12s ease;
}

.playerHair.hair-short{
    left:7px; top:-3px; width:34px; height:17px;
    border-radius:18px 18px 7px 7px;
}

.playerHair.hair-long{
    left:5px; top:-3px; width:38px; height:29px;
    border-radius:18px 18px 11px 11px;
}

.playerHair.hair-bob{
    left:4px; top:-2px; width:40px; height:24px;
    border-radius:19px 19px 12px 12px;
}

.playerHair.hair-spiky{
    left:6px; top:-6px; width:36px; height:20px;
    border-radius:4px 14px 7px 7px;
    clip-path:polygon(0 45%,12% 8%,27% 32%,42% 0,55% 31%,72% 5%,83% 35%,100% 18%,91% 100%,8% 100%);
}

.playerHair.hair-ponytail{
    left:7px; top:-3px; width:34px; height:18px;
    border-radius:18px 18px 7px 7px;
}
.playerHair.hair-ponytail::after{
    content:""; position:absolute; right:-8px; top:7px;
    width:14px; height:18px; background:#4c342e;
    border-radius:50% 60% 60% 40%;
}

.playerHair.hair-curly{
    left:4px; top:-5px; width:40px; height:21px;
    border-radius:50%;
    box-shadow:-4px 7px 0 #4c342e, 4px 9px 0 #4c342e, 12px 6px 0 #4c342e, 20px 8px 0 #4c342e;
}

/* =========================
   NPC
========================= */

.npc{
    position:absolute;
    width:86px;
    height:108px;
    transform:translate(-50%,-50%);
    z-index:45;
    text-align:center;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    pointer-events:auto;
}

/* NPC sprites are supplied as transparent PNGs. Keep the original NPC
   dialogue/schedule logic intact and only replace the visual layer. */
.npcSprite{
    position:absolute;
    left:50%;
    top:0;
    width:82px;
    height:88px;
    transform:translateX(-50%);
    object-fit:contain;
    object-position:center bottom;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.22));
}

.npcName{
    position:absolute;
    bottom:-20px;
    width:100%;
    color:white;
    font-size:11px;
    font-weight:800;
    text-shadow:0 2px 4px #000;
}

.npcShop .npcBody{
    background:#c99449;
}

.npcSpecial .npcBody{
    background:#8061a4;
}

.interactMark{
    position:absolute;
    top:-27px;
    left:50%;
    transform:translateX(-50%);
    padding:3px 7px;
    border-radius:6px;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:11px;
    white-space:nowrap;
    display:none;
}

.npc.near .interactMark{
    display:block;
}

@media(max-width:700px){
    .npc{
        width:100px;
        height:122px;
    }

    .npcSprite{
        width:96px;
        height:102px;
    }

    .npcName{
        bottom:-13px;
        font-size:10px;
    }
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
    position:absolute;
    right:15px;
    top:75px;
    z-index:120;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.sideBtn{
    width:48px;
    height:48px;
    border-radius:13px;
    background:rgba(16,22,29,.87);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:21px;
    backdrop-filter:blur(8px);
}

.sideBtn:active{
    transform:scale(.93);
}

/* =========================
   ACTION BAR
========================= */

#actionBar{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    gap:8px;
}

.actionBtn{
    padding:10px 13px;
    border-radius:10px;
    background:rgba(17,24,31,.88);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:12px;
    font-weight:800;
}


/* =========================
   SEA DETAILS
========================= */

.seaBeach{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#d9c184,#c9aa6c);z-index:1;}
.seaShore{position:absolute;left:0;right:0;bottom:38%;height:8%;background:rgba(255,255,255,.22);z-index:2;border-top:3px solid rgba(255,255,255,.28);}
.seaSun{position:absolute;right:8%;top:8%;font-size:58px;z-index:2;}
.seaCloud{position:absolute;font-size:42px;opacity:.65;z-index:2;}
.cloud1{left:12%;top:10%;}.cloud2{left:38%;top:22%;}
.boat{position:absolute;left:34%;top:28%;font-size:58px;z-index:3;}
.lighthouse{position:absolute;right:8%;bottom:31%;font-size:68px;z-index:4;}
.seaRock{position:absolute;font-size:28px;z-index:5;}.rock1{left:18%;bottom:12%;}.rock2{left:58%;bottom:8%;}.rock3{right:25%;bottom:16%;}
.shell{position:absolute;font-size:25px;z-index:5;}.shell1{left:35%;bottom:12%;}.shell2{right:40%;bottom:20%;}
.palm{position:absolute;font-size:65px;z-index:5;}.palm1{left:4%;bottom:18%;}.palm2{right:5%;bottom:12%;}
.fishingSpot{position:absolute;left:24%;bottom:34%;z-index:6;padding:8px 12px;border-radius:12px;background:rgba(30,75,88,.7);color:white;font-weight:900;text-align:center;}.fishingSpot span{display:block;font-size:10px;margin-top:2px;}

/* =========================
   NPC HOUSES
========================= */

.building1,.building2{overflow:visible;}
.building3{left:69%;top:75%;width:23%;height:20%;}
.homeSign{position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:7px;background:#e2bd69;color:#382d1d;font-size:11px;font-weight:900;white-space:nowrap;}
.npcHomeDoor{position:absolute;left:40%;bottom:-1px;width:20%;height:27%;min-width:30px;background:#4b3028;border:4px solid #2e211c;border-radius:6px 6px 0 0;}

/* =========================
   NPC HOUSE INTERIOR
========================= */

#npcHouse{background:linear-gradient(#a97858 0 20%,#d5b785 20% 100%);}
.npcHouseInterior{position:absolute;left:5%;top:15%;width:90%;height:75%;background:#c9a879;border:9px solid #704d3f;border-radius:12px;overflow:hidden;}
.npcHouseRoofTrim{position:absolute;left:0;right:0;top:0;height:13%;background:#8a5a48;}
.npcHouseTitle{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:white;font-size:20px;font-weight:900;z-index:3;text-shadow:0 2px 4px #000;white-space:nowrap;}
.npcHouseBed{position:absolute;left:10%;top:23%;width:25%;height:28%;background:#e5e9ed;border:7px solid #694e4b;border-radius:10px;}
.npcHouseTable{position:absolute;right:15%;top:28%;width:22%;height:18%;background:#80583e;border:6px solid #573a2c;}
.npcHouseCabinet{position:absolute;right:13%;bottom:15%;width:20%;height:18%;background:#90623f;border:5px solid #573a2c;}
.npcHouseDoor{position:absolute;left:45%;bottom:-1px;width:10%;min-width:50px;height:17%;background:#4b3028;border:5px solid #2e211c;z-index:5;}
.npcHouseOwner{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:12px;color:#5a4034;font-weight:900;}

/* tree interaction */
.farmTree,.forestTree{cursor:pointer;}
.farmTree.chopped,.forestTree.chopped{display:none;}

/* =========================
   MOBILE CONTROL
========================= */

#mobileControls{
    position:absolute;
    left:20px;
    bottom:20px;
    z-index:150;
    width:145px;
    height:145px;
}

.dpad{
    position:absolute;
    inset:0;
}

.dpad button{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:12px;
    background:rgba(20,27,34,.78);
    color:white;
    font-size:22px;
    border:1px solid rgba(255,255,255,.12);
    touch-action:none;
}

.up{left:49px;top:0;}
.left{left:0;top:49px;}
.right{right:0;top:49px;}
.down{left:49px;bottom:0;}

/* =========================
   PANEL
========================= */

#panel{
    position:absolute;
    inset:0;
    z-index:500;
    background:rgba(5,8,11,.67);
    display:flex;
    justify-content:flex-end;
}

.panelBox{
    width:min(520px,92vw);
    height:100%;
    background:#151d25;
    color:white;
    padding:30px;
    overflow:auto;
    box-shadow:-20px 0 60px rgba(0,0,0,.4);
}

.panelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.panelHeader h2{
    font-size:24px;
}

.closePanel{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#2b3641;
    color:white;
    font-size:20px;
}

/* =========================
   CHARACTER
========================= */

.stat{
    margin-bottom:18px;
}

.statLabel{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:13px;
}

.statBar{
    height:10px;
    background:#2c3742;
    border-radius:20px;
    overflow:hidden;
}

.statFill{
    height:100%;
    background:#e0bb5e;
}

/* =========================
   INVENTORY
========================= */

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.itemCard{
    min-height:110px;
    padding:12px;
    border-radius:13px;
    background:#202b36;
    border:1px solid #33414f;
    text-align:center;
}

.itemIcon{
    font-size:32px;
    margin-bottom:5px;
}

.itemName{
    font-size:12px;
    font-weight:800;
}

.itemCount{
    color:#e3c66e;
    font-size:13px;
    margin-top:4px;
}

.itemPrice{
    color:#9ca9b5;
    font-size:11px;
    margin-top:5px;
}

/* =========================
   SPIRIT
========================= */


.spiritWorld{
    position:absolute;
    z-index:6;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
}
.spiritWorldIcon{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    background:rgba(25,32,40,.72);
    border:3px solid rgba(255,255,255,.5);
    box-shadow:0 0 24px rgba(255,255,255,.22);
}
.spiritWorldName{
    margin-top:3px;padding:2px 6px;border-radius:6px;
    background:rgba(20,25,30,.72);color:white;font-size:9px;font-weight:900;
}
.spiritWorld.near .spiritWorldIcon{
    border-color:#f1d77a;
    box-shadow:0 0 18px rgba(241,215,122,.55);
}
.spiritWorldMark{
    position:absolute;left:50%;top:-19px;transform:translateX(-50%);
    white-space:nowrap;color:#f7e6a4;font-size:9px;font-weight:900;
}
.spiritInteractBox{
    display:grid;gap:5px;margin-top:9px;
}
.spiritInteractBox button{
    border:0;border-radius:7px;padding:6px 8px;background:#2d3945;color:white;
    font-size:11px;font-weight:800;cursor:pointer;
}
.spiritInteractBox button:hover{background:#40515f}
.spiritGiftGrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.spiritGiftGrid button{font-size:10px;padding:5px 7px}
.spiritGiftGrid button:disabled{opacity:.35;cursor:not-allowed}
.spiritMood{margin-top:5px;color:#e3c66e;font-size:11px;font-weight:900}

.spiritCard{
    padding:15px;
    margin-bottom:10px;
    background:#202b36;
    border-radius:14px;
}

.spiritTop{
    display:flex;
    align-items:center;
    gap:12px;
}

.spiritIcon{
    font-size:36px;
}

.spiritName{
    font-weight:900;
}

.spiritDesc{
    color:#aeb9c4;
    font-size:12px;
    margin-top:7px;
}

.spiritAction{
    margin-top:12px;
    width:100%;
    padding:10px;
    border-radius:9px;
    background:#735e98;
    color:white;
    font-weight:800;
}

/* =========================
   MAP
========================= */

.mapGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.mapLocation{
    position:relative;
    min-height:120px;
    border-radius:16px;
    padding:18px;
    background:#25323e;
    border:1px solid #3a4855;
    color:white;
    text-align:left;
    overflow:hidden;
}

.mapLocation:hover{
    background:#314150;
}

.mapLocationIcon{
    font-size:40px;
}

.mapLocationName{
    margin-top:10px;
    font-weight:900;
}

.mapLocationDesc{
    margin-top:4px;
    color:#aeb9c4;
    font-size:11px;
}

/* =========================
   DIALOGUE
========================= */

#dialogue{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:min(850px,92vw);
    z-index:400;
}

.dialogueBox{
    background:rgba(17,24,31,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    padding:9px 12px;
    color:white;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    width:fit-content;
    max-width:min(430px,78vw);
    margin:0 auto;
}
.dialogueName{
    color:#e3c66e;
    font-weight:900;
    margin-bottom:3px;
    font-size:11px;
}
.dialogueText{
    line-height:1.35;
    color:#e4e8eb;
    margin-bottom:6px;
    font-size:11px;
}

.dialogueName{
    color:#e3c66e;
    font-weight:900;
    margin-bottom:8px;
}

.dialogueText{
    line-height:1.6;
    color:#e4e8eb;
    margin-bottom:14px;
}

.dialogueChoices{
    display:grid;
    gap:8px;
}

.dialogueChoice{
    padding:11px;
    border-radius:10px;
    background:#2a3642;
    color:white;
    text-align:left;
}

.dialogueChoice:hover{
    background:#374654;
}

.dialogueFooter{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.dialogueFooter button{
    padding:9px 13px;
    border-radius:9px;
    background:#5a6d7e;
    color:white;
    font-size:12px;
}

/* =========================
   SHOP
========================= */

.shopTabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.shopTab{
    flex:1;
    padding:10px;
    border-radius:9px;
    background:#293641;
    color:#b8c2cb;
    font-weight:800;
}

.shopTab.active{
    background:#d5b45c;
    color:#312817;
}

.shopList{
    display:grid;
    gap:9px;
}

.shopItem{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:13px;
    background:#202b36;
    border:1px solid #34414d;
}

.shopItemIcon{
    width:50px;
    height:50px;
    border-radius:10px;
    background:#2d3945;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.shopItemInfo{
    flex:1;
}

.shopItemName{
    font-weight:900;
}

.shopItemDesc{
    color:#9eabb7;
    font-size:11px;
    margin-top:3px;
}

.shopItemPrice{
    color:#e6c96b;
    font-size:12px;
    margin-top:4px;
}

.shopItem button{
    padding:9px 11px;
    border-radius:9px;
    background:#d5b45c;
    color:#302719;
    font-weight:900;
}

.shopItem button.sell{
    background:#6d8b70;
    color:white;
}

.shopItem button:disabled{
    opacity:.35;
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;
    left:50%;
    top:85px;
    transform:translateX(-50%) translateY(-10px);
    z-index:900;
    padding:11px 17px;
    border-radius:12px;
    background:rgba(16,22,29,.92);
    color:white;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   INACTIVITY
========================= */

#inactiveWarning{
    position:absolute;
    inset:0;
    z-index:800;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.5);
    pointer-events:none;
}

.warningBox{
    padding:20px 25px;
    border-radius:15px;
    background:#171e26;
    color:white;
    text-align:center;
}

.warningBox strong{
    color:#e4c565;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .startTitle{
        font-size:32px;
    }

    #hud{
        top:8px;
        left:8px;
        right:8px;
    }

    .hudItem{
        padding:7px 9px;
        font-size:10px;
    }

    #sidebar{
        top:60px;
        right:8px;
    }

    .sideBtn{
        width:42px;
        height:42px;
        font-size:18px;
    }

    #actionBar{
        bottom:12px;
        left:auto;
        right:10px;
        transform:none;
        flex-direction:column;
        align-items:flex-end;
    }

    .actionBtn{
        padding:8px 10px;
    }

    .panelBox{
        width:100%;
        padding:22px;
    }

    .inventoryGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .farmHouse{
        min-width:150px;
        min-height:120px;
    }

}

/* =========================
   DESKTOP TOUCH HIDE
========================= */

@media(min-width:801px){
    #mobileControls{
        opacity:.25;
    }
}


.shopSellButtons{
    display:flex;
    gap:6px;
    margin-left:auto;
}

.shopSellButtons button{
    padding:8px 10px;
    border-radius:8px;
    color:white;
    font-weight:800;
    white-space:nowrap;
}

.shopSellButtons .sell{
    background:#596a78;
}
 .hairStyles{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:10px;
}

.hairStyle{
    min-height:38px;
    padding:7px 4px;
    border:2px solid #d8cdbd;
    border-radius:9px;
    background:#fffaf2;
    color:#4a4038;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    touch-action:manipulation;
}

.hairStyle.active{
    border-color:#7b604d;
    background:#ead8c5;
    box-shadow:0 0 0 2px rgba(123,96,77,.14);
}

.shopSellButtons .sellAll{
    background:#8a5c66;
}

/* Character selection uses the existing NPC artwork only as selectable player portraits. */
.characterChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.characterChoice{min-height:82px;padding:6px 4px;border:2px solid #d8cdbd;border-radius:9px;background:#fffaf2;color:#4a4038;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;}
.characterChoice.active{border-color:#7b604d;background:#ead8c5;box-shadow:0 0 0 2px rgba(123,96,77,.14);}
.characterChoicePreview{width:48px;height:58px;display:block;background-repeat:no-repeat;background-position:center;background-size:contain;}
.playerCharacter{position:absolute;left:50%;top:0;width:70px;height:82px;transform:translateX(-50%);object-fit:contain;z-index:2;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22));}
#player>.playerHead,#player>.playerHair,#player>.playerBody{display:none;}
.npcCssBody{position:absolute;left:27px;bottom:8px;width:32px;height:40px;border-radius:10px 10px 6px 6px;border:3px solid #27394f;}
.npcCssHead{position:absolute;left:28px;top:7px;width:30px;height:30px;border-radius:50%;background:#efc39e;border:3px solid #6a483c;}
.npcCssHair{position:absolute;left:26px;top:4px;width:34px;height:17px;background:#4c342e;border-radius:18px 18px 7px 7px;z-index:2;}
.npcCssHair.long{height:29px;border-radius:18px 18px 11px 11px;}
.npcCssHair.bob{width:40px;height:24px;left:23px;border-radius:19px 19px 12px 12px;}
.npcCssHair.spiky{clip-path:polygon(0 45%,12% 8%,27% 32%,42% 0,55% 31%,72% 5%,83% 35%,100% 18%,91% 100%,8% 100%);}
.spiritWorld{pointer-events:auto;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.spiritWorldIcon{pointer-events:auto;}
@media(max-width:600px){.characterChoices{grid-template-columns:repeat(3,1fr)}.characterChoice{min-height:76px}.playerCharacter{width:64px;height:76px;}}
</style>
</head>

<body>

<div id="game">

    <!-- START -->
    <div id="startScreen">
        <div class="startBox">
            <div class="startTitle">정령의 계절</div>
            <div class="startSub">
                작은 마을과 정령 그리고 당신의 이야기
            </div>

            <div class="characterSetup">
                <div class="setupLabel">닉네임</div>
                <input
                    id="nicknameInput"
                    class="nicknameInput"
                    type="text"
                    maxlength="12"
                    placeholder="닉네임을 입력하세요"
                    autocomplete="off"
                >

                <div class="setupLabel">캐릭터 선택</div>
                <div class="characterChoices" id="characterChoices">
                    <button type="button" class="characterChoice active" data-character="mina" aria-label="미나 캐릭터">
                        <span class="characterChoicePreview" data-preview="mina"></span><span>미나</span>
                    </button>
                    <button type="button" class="characterChoice" data-character="theo" aria-label="테오 캐릭터">
                        <span class="characterChoicePreview" data-preview="theo"></span><span>테오</span>
                    </button>
                    <button type="button" class="characterChoice" data-character="luna" aria-label="루나 캐릭터">
                        <span class="characterChoicePreview" data-preview="luna"></span><span>루나</span>
                    </button>
                    <button type="button" class="characterChoice" data-character="elder" aria-label="장로 캐릭터">
                        <span class="characterChoicePreview" data-preview="elder"></span><span>장로</span>
                    </button>
                    <button type="button" class="characterChoice" data-character="marin" aria-label="마린 캐릭터">
                        <span class="characterChoicePreview" data-preview="marin"></span><span>마린</span>
                    </button>
                    <button type="button" class="characterChoice" data-character="rose" aria-label="로제 캐릭터">
                        <span class="characterChoicePreview" data-preview="rose"></span><span>로제</span>
                    </button>
                </div>
            </div>

            <button class="mainStartBtn" id="startButton">
                게임 시작
            </button>
        </div>
    </div>

    <!-- SAVE -->
    <div id="saveScreen" class="hidden">
        <div class="saveBox">
            <h2>저장 슬롯</h2>

            <div class="saveSlots" id="saveSlots"></div>

            <button class="backBtn" id="saveBackButton">
                뒤로
            </button>
        </div>
    </div>

    <!-- GAME -->
    <div id="gameWorld" class="hidden">

        <div id="hud">
            <div class="hudLeft">
                <div class="hudItem" id="dayText">1일차</div>
                <div class="hudItem" id="timeText">08:00</div>
                <div class="hudItem" id="locationText">농장</div>
            </div>

            <div class="hudRight">
                <div class="hudItem" id="energyText">에너지 100/100</div>
                <div class="hudItem" id="money">₩1000</div>
            </div>
        </div>

        <div id="main">

            <div id="screen">

                <!-- FARM -->
                <div id="farm" class="location">

                    <div class="farmHouse">
                        <div class="farmHouseRoof"></div>
                        <div class="farmHouseDoor"></div>
                    </div>

                    <div class="field" id="field"></div>

                    <div class="pond"></div>

                    <div class="farmTree tree1" data-tree-id="farm-tree1">🌳</div>
                    <div class="farmTree tree2" data-tree-id="farm-tree2">🌳</div>
                    <div class="farmTree tree3" data-tree-id="farm-tree3">🌳</div>
                    <div class="farmTree tree4" data-tree-id="farm-tree4">🌳</div>

                </div>

                <!-- TOWN -->
                <div id="town" class="location hidden">

                    <div class="townRoad"></div>

                    <div class="townBuilding building1 npcHomeBuilding">
                        <div class="homeSign">미나의 집</div>
                        <div class="npcHomeDoor"></div>
                    </div>
                    <div class="townBuilding building2 npcHomeBuilding">
                        <div class="homeSign">테오의 집</div>
                        <div class="npcHomeDoor"></div>
                    </div>
                    <div class="townBuilding building3 npcHomeBuilding">
                        <div class="homeSign">장로의 집</div>
                        <div class="npcHomeDoor"></div>
                    </div>

                    <div class="townBuilding shopBuilding">
                        <div class="shopSign">상점</div>
                    </div>

                </div>

                <!-- FOREST -->
                <div id="forest" class="location hidden">

                    <div class="forestTree ft1" data-tree-id="forest-ft1">🌲</div>
                    <div class="forestTree ft2" data-tree-id="forest-ft2">🌲</div>
                    <div class="forestTree ft3" data-tree-id="forest-ft3">🌲</div>
                    <div class="forestTree ft4" data-tree-id="forest-ft4">🌲</div>
                    <div class="forestTree ft5" data-tree-id="forest-ft5">🌲</div>

                    <div class="shrine">
                        ✨
                    </div>

                </div>

                <!-- SEA -->
                <div id="sea" class="location hidden">

                    <div class="seaSun">☀️</div>
                    <div class="seaCloud cloud1">☁️</div>
                    <div class="seaCloud cloud2">☁️</div>

                    <div class="wave w1">〰〰</div>
                    <div class="wave w2">〰〰</div>
                    <div class="wave w3">〰〰</div>
                    <div class="wave w4">〰〰</div>
                    <div class="wave w5">〰〰</div>

                    <div class="seaBeach"></div>
                    <div class="seaShore"></div>
                    <div class="dock"></div>
                    <div class="boat">⛵</div>
                    <div class="lighthouse">🗼</div>
                    <div class="seaRock rock1">🪨</div>
                    <div class="seaRock rock2">🪨</div>
                    <div class="seaRock rock3">🪨</div>
                    <div class="shell shell1">🐚</div>
                    <div class="shell shell2">🐚</div>
                    <div class="palm palm1">🌴</div>
                    <div class="palm palm2">🌴</div>
                    <div class="fishingSpot">🎣<span>낚시터</span></div>

                </div>

                <!-- NPC HOUSE -->
                <div id="npcHouse" class="location hidden">
                    <div class="npcHouseInterior">
                        <div class="npcHouseRoofTrim"></div>
                        <div class="npcHouseTitle" id="npcHouseTitle">NPC의 집</div>
                        <div class="npcHouseBed"></div>
                        <div class="npcHouseTable"></div>
                        <div class="npcHouseCabinet"></div>
                        <div class="npcHouseDoor"></div>
                        <div class="npcHouseOwner" id="npcHouseOwner">집주인</div>
                    </div>
                </div>

                <!-- HOUSE -->
                <div id="house" class="location hidden">

                    <div class="houseFloor">

                        <div class="houseBed"></div>
                        <div class="houseTable"></div>
                        <div class="houseChest"></div>

                        <div class="houseDoorInside"></div>

                    </div>

                </div>

                <div id="player">
                    <div class="playerNickname" id="playerNickname"></div>
                    <img class="playerCharacter" id="playerCharacter" alt="" draggable="false">
                    <div class="playerHead"></div>
                    <div class="playerHair"></div>
                    <div class="playerBody"></div>
                </div>

            </div>

            <!-- SIDEBAR -->
            <div id="sidebar">

                <button class="sideBtn" data-panel="map">
                    🗺️
                </button>

                <button class="sideBtn" data-panel="character">
                    👤
                </button>

                <button class="sideBtn" data-panel="inventory">
                    🎒
                </button>

                <button class="sideBtn" data-panel="spirits">
                    ✨
                </button>

                <button class="sideBtn" id="saveGameButton">
                    💾
                </button>

            </div>

            <!-- ACTION BAR -->
            <div id="actionBar">

                <button class="actionBtn" id="plantButton">
                    🌱 심기
                </button>

                <button class="actionBtn" id="waterButton">
                    💧 물주기
                </button>

                <button class="actionBtn" id="harvestButton">
                    🧺 수확
                </button>

                <button class="actionBtn" id="fishButton">
                    🎣 낚시
                </button>

                <button class="actionBtn" id="chopButton">
                    🪓 나무 베기
                </button>

                <button class="actionBtn" id="sleepButton">
                    🛏️ 자기
                </button>

            </div>

            <!-- MOBILE -->
            <div id="mobileControls">

                <div class="dpad">

                    <button class="up" data-dir="up">▲</button>
                    <button class="left" data-dir="left">◀</button>
                    <button class="right" data-dir="right">▶</button>
                    <button class="down" data-dir="down">▼</button>

                </div>

            </div>

        </div>

    </div>

    <!-- PANEL -->
    <div id="panel" class="hidden">

        <div class="panelBox">

            <div class="panelHeader">
                <h2 id="panelTitle">메뉴</h2>
                <button class="closePanel" id="closePanel">
                    ×
                </button>
            </div>

            <div id="panelContent"></div>

        </div>

    </div>

    <!-- DIALOGUE -->
    <div id="dialogue" class="hidden"></div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- INACTIVE -->
    <div id="inactiveWarning" class="hidden">
        <div class="warningBox">
            <strong>잠시 자리를 비우셨습니다.</strong>
            <br>
            1분 후 시작 화면으로 돌아갑니다.
        </div>
    </div>

</div>

<script>

/* =========================================================
   DATA

const SAVE_PREFIX = "spirit_season_save_";

const DEFAULT_GAME = {

function setupCharacterChoices(){
    const wrap=document.getElementById("characterChoices");
    if(!wrap) return;
    wrap.querySelectorAll(".characterChoicePreview").forEach(preview=>{

    });
}

function getNPCSchedule(id){
    const list=NPC_SCHEDULES[id];
    if(!list) return null;
    return list.find(s=>game.time>=s.start && game.time<s.end) || list[list.length-1];
}

function getNPCWorld(id){
    if(!game.npcWorld) game.npcWorld={};
    if(!game.npcWorld[id]){
        const n=NPC_DATA[id];
        game.npcWorld[id]={x:n.x,y:n.y,targetX:n.x,targetY:n.y,home:false};
    }
    return game.npcWorld[id];
}

function initializeNPCWorld(){
    if(!game.npcWorld) game.npcWorld={};
    Object.keys(NPC_DATA).forEach(id=>{
        const w=getNPCWorld(id), sc=getNPCSchedule(id);
        if(sc){ w.targetX=sc.x; w.targetY=sc.y; w.home=!!sc.home; }
    });
}

function updateNPCSchedules(force=false){
    if(!game) return;
    let changed=false;
    Object.keys(NPC_DATA).forEach(id=>{
        const sc=getNPCSchedule(id), w=getNPCWorld(id);
        if(!sc) return;
        if(force || w.targetX!==sc.x || w.targetY!==sc.y || w.home!==!!sc.home){
            w.targetX=sc.x; w.targetY=sc.y; w.home=!!sc.home; changed=true;
        }
    });
    if(changed){
        createNPCs();
        renderNPCInHouse();
    }
}

function updateNPCMovement(delta){
    if(!game) return;
    let moved=false;
    Object.keys(NPC_DATA).forEach(id=>{
        const w=getNPCWorld(id);
        if(w.home) return;
        const dx=w.targetX-w.x, dy=w.targetY-w.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d>0.15){
            const step=Math.min(d,0.006*delta);
            w.x += dx/d*step;
            w.y += dy/d*step;
            moved=true;
        }
    });
    if(moved){
        document.querySelectorAll('.npc').forEach(el=>{
            const w=game.npcWorld && game.npcWorld[el.dataset.npc];
            if(w){el.style.left=w.x+'%';el.style.top=w.y+'%';}
        });
        updateNearby();
    }
}

function renderNPCInHouse(){
    document.querySelectorAll('.npcHouseResident').forEach(el=>el.remove());
    if(!game || game.location!=='npcHouse' || !game.npcHome) return;
    const id=game.npcHome, npc=NPC_DATA[id], w=getNPCWorld(id);
    if(!npc || !w.home) return;
    const el=document.createElement('div');
    el.className='npc npcHouseResident';
    el.dataset.npc=id;
    el.style.left='50%';
    el.style.top='58%';
    el.innerHTML='<div class="npcCssHead"></div><div class="npcCssHair '+(id==='luna'?'long':id==='rose'?'bob':id==='elder'?'spiky':'')+'"></div><div class="npcCssBody" style="background:'+(npc.color || '#5476a5')+'"></div><div class="npcName">'+npc.name+'</div>';
    screen.appendChild(el);
}

function clone(obj){
    return JSON.parse(JSON.stringify(obj));
}


function moneyText(value){
    return "₩" + Number(value).toLocaleString();
}


function showToast(text){

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },1800);
}


function formatTime(minutes){

    minutes = Math.max(0,Math.min(1439,minutes));

    const h =
        String(Math.floor(minutes / 60)).padStart(2,"0");

    const m =
        String(minutes % 60).padStart(2,"0");

    return `${h}:${m}`;
}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    if(!game || !game.saveSlot) return;

    localStorage.setItem(
        SAVE_PREFIX + game.saveSlot,
        JSON.stringify(game)
    );

}


function getSave(slot){

    const raw =
        localStorage.getItem(SAVE_PREFIX + slot);

    if(!raw) return null;

    try{
        return JSON.parse(raw);
    }catch{
        return null;
    }

}


function showSaveScreen(){

    startScreen.classList.add("hidden");

    saveScreen.classList.remove("hidden");

    gameWorld.classList.add("hidden");

    renderSaveSlots();

}


function renderSaveSlots(){

    const box =
        document.getElementById("saveSlots");

    box.innerHTML = "";

    for(let slot=1;slot<=3;slot++){

        const data = getSave(slot);

        const el =
            document.createElement("div");

        el.className = "saveSlot";

        if(data){

            el.innerHTML = `
                <div class="saveSlotTitle">
                    슬롯 ${slot}
                </div>

                <div class="saveSlotInfo">
                    ${data.day}일차 · ${data.season}
                    · ${data.location}
                    · ${moneyText(data.money)}
                </div>

                <div class="saveSlotButtons">

                    <button data-load="${slot}">
                        이어하기
                    </button>

                    <button
                        class="deleteBtn"
                        data-delete="${slot}"
                    >
                        삭제
                    </button>

                </div>
            `;

        }else{

            el.innerHTML = `
                <div class="saveSlotTitle">
                    슬롯 ${slot}
                </div>

                <div class="saveSlotInfo">
                    비어 있음
                </div>

                <div class="saveSlotButtons">

                    <button data-new="${slot}">

function startNewGame(slot){

    game = clone(DEFAULT_GAME);

    game.saveSlot = slot;

    const nicknameInput =
        document.getElementById("nicknameInput");

    const nickname =
        nicknameInput
            ? nicknameInput.value.trim()
            : "";

    game.player.nickname =
        nickname.slice(0,12) || "플레이어";

    game.player.characterId =
        CHARACTER_IDS.includes(window.selectedCharacterId)
            ? window.selectedCharacterId
            : "mina";

    game.location = "farm";

    game.player.x = 50;
    game.player.y = 68;

    createFarm();

    enterGame();

    saveGame();

}


function loadGame(slot){

    const data = getSave(slot);

    if(!data) return;

    const fresh = clone(DEFAULT_GAME);

    game = Object.assign(fresh,data);

    game.player =
        Object.assign(
            fresh.player,
            data.player || {}
        );

    game.inventory =
        Object.assign(
            fresh.inventory,
            data.inventory || {}
        );

    game.stats =
        Object.assign(
            fresh.stats,
            data.stats || {}
        );

    game.npc =
        Object.assign(
            fresh.npc,
            data.npc || {}
        );

    game.spirits =
        Object.assign(
            fresh.spirits,
            data.spirits || {}
        );

    game.crops =
        Object.assign(
            fresh.crops,
            data.crops || {}
        );

    game.saveSlot = slot;

    enterGame();

}


function deleteSave(slot){

    localStorage.removeItem(
        SAVE_PREFIX + slot
    );

    renderSaveSlots();

}

function enterGame(){

    dialogue.classList.add("hidden");

function stopGame(){

    saveGame();

    game = null;

    currentNPC = null;

    keys = {};
    gameClockAccumulator = 0;

    dialogue.classList.add("hidden");

    panel.classList.add("hidden");

    gameWorld.classList.add("hidden");

    inactiveWarning.classList.add("hidden");

    startScreen.classList.remove("hidden");

    clearTimeout(inactivityTimer);

    clearTimeout(inactivityWarningTimer);

}

function createFarm(){

    const field =
        document.getElementById("field");

    if(!field) return;

    field.innerHTML = "";

    for(let i=0;i<24;i++){

        const tile =
            document.createElement("div");

        tile.className = "cropTile";

        tile.dataset.index = i;

        const crop =
            game?.crops?.[i];

        if(crop){

            if(crop.watered){
                tile.classList.add("watered");
            }

            const icon =
                document.createElement("div");

            icon.className = "crop";

            icon.textContent =
                crop.grown
                ? "🥬"
                : "🌱";

            tile.appendChild(icon);

        }

        field.appendChild(tile);

    }

}

function isNearFarmHouseDoor(){

    if(!game || game.location !== "farm") return false;

    return (
        game.player.x >= 8 &&
        game.player.x <= 37 &&
        game.player.y >= 25 &&
        game.player.y <= 44
    );

}

function isNearHouseExit(){

    if(!game || game.location !== "house") return false;

    return (
        game.player.x >= 35 &&
        game.player.x <= 65 &&
        game.player.y >= 74
    );

}

function enterHouse(){

    if(!game || game.location !== "farm") return false;

    setLocation("house");

    game.player.x = 50;
    game.player.y = 73;

    updatePlayer();

    showToast("집에 들어왔습니다.");

    return true;

}

function leaveHouse(){

    setLocation("farm");

    game.player.x = 23;
    game.player.y = 45;

    updatePlayer();

    showToast("농장으로 나왔습니다.");

}

function getTownHomeAtPlayer(){

    if(!game || game.location !== "town") return null;

    const x=game.player.x, y=game.player.y;

    if(x>=14 && x<=25 && y>=34 && y<=46) return "mina";
    if(x>=76 && x<=87 && y>=34 && y<=46) return "theo";
    if(x>=76 && x<=87 && y>=91 && y<=98) return "elder";
    if(x>=46 && x<=55 && y>=34 && y<=46) return "rose";

    return null;

}

function renderNPCHouse(){

function checkTransitions(){

    if(!game) return;

    const x = game.player.x;
    const y = game.player.y;

    if(game.location === "farm"){

        if(isNearFarmHouseDoor()){

            enterHouse();

            return;
        }

        if(
            x >= 97 &&
            y >= 48 &&
            y <= 82
        ){

            setLocation("town");

            game.player.x = 8;
            game.player.y = 65;

            updatePlayer();

            return;
        }

    }


    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return;
        }

    }

    if(game.location === "npcHouse"){

        if(y >= 86 && x >= 40 && x <= 60){
            leaveNPCHouse();
            return;
        }

    }


    if(game.location === "town"){

        const homeOwner = getTownHomeAtPlayer();
        if(homeOwner){
            enterNPCHouse(homeOwner);
            return;
        }

        if(
            x <= 3 &&
            y >= 45 &&
            y <= 85
        ){

            setLocation("farm");

            game.player.x = 92;
            game.player.y = 65;

            updatePlayer();

            return;
        }

        if(
            y <= 3 &&
            x >= 40 &&
            x <= 62
        ){

            setLocation("forest");

            game.player.x = 50;
            game.player.y = 91;

            updatePlayer();

            return;
        }

        if(
            x >= 97 &&
            y >= 35 &&
            y <= 65
        ){

            setLocation("sea");

            game.player.x = 8;
            game.player.y = 65;

            updatePlayer();

            return;
        }

    }


    if(game.location === "forest"){

        if(
            y >= 97 &&
            x >= 35 &&
            x <= 65
        ){

            setLocation("town");

            game.player.x = 50;
            game.player.y = 8;

            updatePlayer();

            return;
        }

    }


    if(game.location === "sea"){

        if(
            x <= 3 &&
            y >= 35 &&
            y <= 85
        ){

            setLocation("town");

            game.player.x = 92;
            game.player.y = 55;

            updatePlayer();

            return;
        }

    }

}


/* =========================================================
   MOVEMENT
========================================================= */

function canMove(nx,ny){

    if(nx < 2 || nx > 98 || ny < 2 || ny > 98){
        return false;
    }

    if(game.location === "farm"){

        /*
            집 본체 충돌.
            문 중앙은 통과 가능.
        */

        const inHouse =
            nx >= 8 &&
            nx <= 37 &&
            ny >= 8 &&
            ny <= 35;

        const door =
            nx >= 17 &&
            nx <= 27 &&
            ny >= 26 &&
            ny <= 43;

        if(inHouse && !door){
            return false;
        }

        /*
            연못
        */

        if(
            nx >= 8 &&
            nx <= 33 &&
            ny >= 65 &&
            ny <= 92
        ){
            return false;
        }

    }


    if(game.location === "town"){

        if(
            nx >= 8 &&
            nx <= 31 &&
            ny >= 13 &&
            ny <= 38
        ){
            return false;
        }

        if(
            nx >= 69 &&
            nx <= 92 &&
            ny >= 13 &&
            ny <= 38
        ){
            return false;
        }

        /*
            상점 건물.
            입구 앞은 비워둠.
        */

        if(
            nx >= 38 &&
            nx <= 63 &&
            ny >= 9 &&
            ny <= 39
        ){

            const shopDoor =
                nx >= 46 &&
                nx <= 55 &&
                ny >= 35 &&
                ny <= 44;

            if(!shopDoor){
                return false;
            }

        }

    }


    if(game.location === "forest"){

        if(
            nx >= 39 &&
            nx <= 61 &&
            ny >= 40 &&
            ny <= 63
        ){
            return false;
        }

    }


    if(game.location === "npcHouse"){

        if(nx >= 10 && nx <= 35 && ny >= 39 && ny <= 55){
            return false;
        }
        if(nx >= 68 && nx <= 90 && ny >= 43 && ny <= 58){
            return false;
        }
        if(nx >= 67 && nx <= 87 && ny >= 73 && ny <= 88){
            return false;
        }

    }

    if(game.location === "house"){

        /*
            가구 충돌
        */

        if(
            nx >= 10 &&
            nx <= 38 &&
            ny >= 39 &&
            ny <= 55
        ){
            return false;
        }

        if(
            nx >= 68 &&
            nx <= 90 &&
            ny >= 43 &&
            ny <= 58
        ){
            return false;
        }

        if(
            nx >= 67 &&
            nx <= 87 &&
            ny >= 73 &&
            ny <= 88
        ){
            return false;
        }

    }

    return true;

}


function movePlayer(dx,dy){

    if(!game) return;

    let speed = 0.38;

    if(game.spirits.wind.contract){
        speed = 0.46;
    }

    const nx =
        game.player.x + dx * speed;

    const ny =
        game.player.y + dy * speed;

    if(canMove(nx,ny)){

        game.player.x = nx;
        game.player.y = ny;

        if(Math.abs(dx)>Math.abs(dy)){

            game.player.direction =
                dx > 0 ? "right" : "left";

        }else if(dy !== 0){

            game.player.direction =
                dy > 0 ? "down" : "up";

        }

        updatePlayer();

        updateNearby();

        checkTransitions();

    }

}


function updatePlayer(){

    if(!game) return;

    playerEl.style.left =
        game.player.x + "%";

    playerEl.style.top =
        game.player.y + "%";

    const nicknameEl =
        document.getElementById("playerNickname");

    if(nicknameEl){
        nicknameEl.textContent =
            game.player.nickname || "플레이어";
    }

    const characterEl = document.getElementById("playerCharacter");
    const characterId = game.player.characterId || "mina";
    const characterSprite = NPC_SPRITES[characterId];
    if(characterEl && characterSprite){
        characterEl.src = characterSprite;
        characterEl.alt = NPC_DATA[characterId]?.name || "캐릭터";
    }

    const bodyEl =
        playerEl.querySelector(".playerBody");

    if(bodyEl){
        bodyEl.style.background =
            game.player.outfitColor || "#5476a5";
    }

    const hairEl =
        playerEl.querySelector(".playerHair");

    if(hairEl){
        const allowedHair =
            ["short","long","bob","spiky","ponytail","curly"];
        const hair =
            allowedHair.includes(game.player.hairStyle)
                ? game.player.hairStyle
                : "short";

        hairEl.className = "playerHair hair-" + hair;
    }

}


/* =========================================================
   TREE CHOPPING
========================================================= */

function getTreePositions(){
    return {
        farm:{
            "farm-tree1":[7,55],
            "farm-tree2":[89,22],
            "farm-tree3":[93,77],
            "farm-tree4":[27,77]
        },
        forest:{
            "forest-ft1":[8,18],
            "forest-ft2":[28,35],
            "forest-ft3":[88,20],
            "forest-ft4":[70,86],
            "forest-ft5":[12,84]
        }
    };
}

function updateChoppableTrees(){
    if(!game) return;
    document.querySelectorAll("[data-tree-id]").forEach(el=>{
        const id=el.dataset.treeId;
        el.classList.toggle("chopped", !!game.choppedTrees[id]);
    });
}

function getNearbyTree(){
    if(!game || !["farm","forest"].includes(game.location)) return null;
    let closest=null, best=Infinity;
    const positions=getTreePositions()[game.location] || {};
    Object.entries(positions).forEach(([id,pos])=>{
        if(game.choppedTrees[id]) return;
        const dx=game.player.x-pos[0], dy=game.player.y-pos[1];
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<best){best=d; closest={id,x:pos[0],y:pos[1]};}
    });
    return best<=11 ? closest : null;
}

function chopTree(){
    if(!game || !["farm","forest"].includes(game.location)){
        showToast("농장이나 숲에서만 나무를 벨 수 있습니다.");
        return;
    }
    if(game.energy < 5){
        showToast("에너지가 부족합니다.");
        return;
    }
    const tree=getNearbyTree();
    if(!tree){
        showToast("나무 가까이에서 나무 베기를 사용하세요.");
        return;
    }
    game.energy-=5;
    const amount=game.spirits.forest.contract ? 3 : 2;
    game.inventory.wood=(game.inventory.wood||0)+amount;
    game.inventory.stone=(game.inventory.stone||0)+1;
    game.stats.exp+=8;
    game.stats.farming++;
    game.choppedTrees[tree.id]=true;
    checkLevel();
    updateChoppableTrees();
    updateHUD();
    saveGame();
    showToast(`나무를 베었습니다. 나무 +${amount}`);
}

function createNPCs(){

        .querySelectorAll(".npc")
        .forEach(el=>el.remove());

    Object.entries(NPC_DATA).forEach(([id,npc])=>{

        if(npc.location !== game.location) return;

        const el =
            document.createElement("div");

        el.className = "npc";

        if(npc.shop){
            el.classList.add("npcShop");
        }

        el.dataset.npc = id;

        el.style.left =
            npc.x + "%";

        el.style.top =
            npc.y + "%";

        el.innerHTML = `

            <div class="interactMark">터치 / E 상호작용</div>

/* =========================================================
   NPC NEARBY
========================================================= */

function distanceToNPC(npc){

    const dx =
        game.player.x - npc.x;

    const dy =
        game.player.y - npc.y;

    return Math.sqrt(
        dx*dx + dy*dy
    );

}


function getNearbyNPC(){

    if(!game) return null;

    let closest = null;

    let distance = Infinity;

    Object.entries(NPC_DATA).forEach(([id,npc])=>{

        if(npc.location !== game.location) return;

        const d =
            distanceToNPC(npc);

        if(d < distance){

            distance = d;

            closest = {
                id,
                npc
            };

        }

    });

    if(distance <= 12){
        return closest;
    }

    return null;

}


function updateNearby(){

    if(!game) return;

    const nearby =
        getNearbyNPC();

    document
        .querySelectorAll(".npc")
        .forEach(el=>{

            if(
                nearby &&
                el.dataset.npc === nearby.id
            ){
                el.classList.add("near");
            }else{
                el.classList.remove("near");
            }

        });

}

function isSpiritNight(){
    return game && (game.time >= 1140 || game.time < 360);
}

function createSpiritWorlds(){
    document.querySelectorAll(".spiritWorld").forEach(el=>el.remove());
    if(!game) return;

    Object.entries(SPIRIT_DATA).forEach(([id,spirit])=>{
        if(spirit.location !== game.location) return;
        if(spirit.nightOnly && !isSpiritNight()) return;

        const state = game.spirits[id];
        const el = document.createElement("div");
        el.className = "spiritWorld";
        el.dataset.spirit = id;
        el.style.left = spirit.x + "%";
        el.style.top = spirit.y + "%";
        el.innerHTML = `
            <div class="spiritWorldMark">E 상호작용</div>
            <div class="spiritWorldIcon">${spirit.icon}</div>
            <div class="spiritWorldName">${spirit.name}</div>
        `;
        screen.appendChild(el);
    });
    updateNearbySpirit();
}

function getNearbySpirit(){
    if(!game) return null;
    let closest=null, distance=Infinity;
    Object.entries(SPIRIT_DATA).forEach(([id,spirit])=>{
        if(spirit.location !== game.location) return;
        if(spirit.nightOnly && !isSpiritNight()) return;
        // 정령은 장식/상호작용 오브젝트일 뿐 이동 충돌을 만들지 않는다.
        const dx=game.player.x-spirit.x;
        const dy=game.player.y-spirit.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<distance){ distance=d; closest={id,spirit}; }
    });
    return distance<=13 ? closest : null;
}

function updateNearbySpirit(){
    const nearby=getNearbySpirit();
    document.querySelectorAll(".spiritWorld").forEach(el=>{
        el.classList.toggle("near",!!nearby && el.dataset.spirit===nearby.id);
    });
}

function interactNearby(){

    if(!game) return;

    if(game.location === "npcHouse"){
        if(game.player.y >= 82 && game.player.x >= 38 && game.player.x <= 62){
            leaveNPCHouse();
            return;
        }
    }

    const nearbySpirit = getNearbySpirit();

    if(nearbySpirit){
        showSpiritDialogue(nearbySpirit.id, SPIRIT_DATA[nearbySpirit.id].talk[(game.day-1)%SPIRIT_DATA[nearbySpirit.id].talk.length]);
        return;
    }

    const nearby =
        getNearbyNPC();

    if(nearby){

        openDialogue(
            nearby.id
        );

        return;
    }

    /*
        숲 제단
    */

    if(game.location === "forest"){

        const dx =
            game.player.x - 50;

        const dy =
            game.player.y - 52;

        if(Math.sqrt(dx*dx+dy*dy) < 15){

            openPanel("spirits");

            return;
        }

    }

    /*
        집 침대
    */

    if(game.location === "house"){

        if(
            game.player.x >= 10 &&
            game.player.x <= 42 &&
            game.player.y >= 30 &&
            game.player.y <= 60
        ){

            sleep();

            return;
        }

    }

    /*
        집 문
    */

    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return;
        }

    }

}

function openDialogue(id){

    const npc =

}


function renderDialogue(){

    if(!currentNPC) return;

    const npc =
        NPC_DATA[currentNPC];

    const data =
        npc.dialogue[dialogueIndex];

    dialogue.classList.remove("hidden");

    dialogue.innerHTML = `

        <div class="dialogueBox">

            <div class="dialogueName">
                ${npc.name}
                · 호감도 ${game.npc[currentNPC] || 0}
            </div>

            </div>

            <div class="dialogueChoices">

                ${data.choices.map((choice,index)=>`

                    <button
                        class="dialogueChoice"
                        data-choice="${index}"
                    >
                        ${choice[0]}
                    </button>

                `).join("")}

            </div>

            <div class="dialogueFooter">

                ${
                    npc.shop
                    ?
                    `<button id="openShopFromDialogue">
                        상점 열기
                    </button>`
                    :
                    ""
                }

                <button id="giftButton">
                    선물하기
                </button>

                <button id="closeDialogueButton">
                    닫기
                </button>

            </div>

        </div>

    `;

}


function chooseDialogue(index){

    if(!currentNPC) return;

    const npc =
        NPC_DATA[currentNPC];

    const data =
        npc.dialogue[dialogueIndex];

    const amount =
        data.choices[index][1];

    game.npc[currentNPC] =
        Math.max(
            0,
            (game.npc[currentNPC] || 0) + amount
        );

    if(amount > 0){

        showToast(
            `호감도 +${amount}`
        );

    }else if(amount < 0){

        showToast(
            `호감도 ${amount}`
        );

    }else{

        showToast(
            "호감도 변화 없음"
        );

    }

    game.stats.friendship +=
        amount > 0 ? 1 : 0;

    checkLevel();

    dialogueIndex++;

    if(dialogueIndex >= npc.dialogue.length){

        dialogueIndex = 0;

    }

    saveGame();

    renderDialogue();

}


function giveGift(){

    if(!currentNPC) return;

    if(game.inventory.herb > 0){

        game.inventory.herb--;

        game.npc[currentNPC] += 5;

        showToast(
            `${NPC_DATA[currentNPC].name}의 호감도 +5`
        );

    }else if(game.inventory.turnip > 0){

        game.inventory.turnip--;

        game.npc[currentNPC] += 3;

        showToast(
            `${NPC_DATA[currentNPC].name}의 호감도 +3`
        );

    }else{

        showToast(
            "선물할 아이템이 없습니다."
        );

    }

    saveGame();

    renderDialogue();

}

function buyItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.buy) return;

    if(game.money < item.buy){

        showToast("돈이 부족합니다.");

        return;
    }

    game.money -= item.buy;

    game.inventory[id] =
        (game.inventory[id] || 0) + 1;

    showToast(
        `${item.name} 1개 구매`
    );

    updateHUD();

    saveGame();

    renderShop();

}


function sellAllItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.sell) return;

    const count =
        game.inventory[id] || 0;

    if(count <= 0){

        showToast("아이템이 없습니다.");

        return;
    }

    const total =
        item.sell * count;

    game.inventory[id] = 0;

    game.money += total;

    showToast(
        `${item.name} ${count}개를 모두 판매했습니다. +${moneyText(total)}`
    );

    updateHUD();

    saveGame();

    renderShop();

}


function sellItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.sell) return;

    if(
        !game.inventory[id] ||
        game.inventory[id] <= 0
    ){

        showToast("아이템이 없습니다.");

        return;
    }

    game.inventory[id]--;

    game.money += item.sell;

    showToast(
        `${item.name} 1개 판매`
    );

    updateHUD();

    saveGame();

    renderShop();

}

        `${spirit.name}과 계약했습니다.`

/* =========================================================
   FARM ACTIONS
========================================================= */

function getSelectedCropTile(){

    if(!game || game.location !== "farm"){
        return null;
    }

    const field =
        document.getElementById("field");

    const rect =
        field.getBoundingClientRect();

    const px =
        window.innerWidth *
        game.player.x / 100;

    const py =
        window.innerHeight *
        game.player.y / 100;

    if(
        px < rect.left ||
        px > rect.right ||
        py < rect.top ||
        py > rect.bottom
    ){
        return null;
    }

    const cols = 6;
    const rows = 4;

    const col =
        Math.floor(
            (px - rect.left) /
            rect.width *
            cols
        );

    const row =
        Math.floor(
            (py - rect.top) /
            rect.height *
            rows
        );

    if(
        col < 0 ||
        col >= cols ||
        row < 0 ||
        row >= rows
    ){
        return null;
    }

    return row * cols + col;

}


function plantCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 심을 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    if(game.crops[index]){

        showToast("이미 작물이 있습니다.");

        return;
    }

    let seed = null;

    if(game.inventory.turnip_seed > 0){
        seed = "turnip";
        game.inventory.turnip_seed--;
    }else if(game.inventory.potato_seed > 0){
        seed = "potato";
        game.inventory.potato_seed--;
    }else if(game.inventory.wheat_seed > 0){
        seed = "wheat";
        game.inventory.wheat_seed--;
    }

    if(!seed){

        showToast("씨앗이 없습니다.");

        return;
    }

    game.crops[index] = {
        type:seed,
        watered:false,
        grown:false,
        age:0
    };

    game.energy =
        Math.max(0,game.energy - 5);

    createFarm();

    updateHUD();

    saveGame();

    showToast("씨앗을 심었습니다.");

}


function waterCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 물을 줄 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    const crop =
        game.crops[index];

    if(!crop){

        showToast("심어진 작물이 없습니다.");

        return;
    }

    crop.watered = true;

    game.energy =
        Math.max(0,game.energy - 3);

    createFarm();

    updateHUD();

    saveGame();

    showToast("작물에 물을 줬습니다.");

}


function harvestCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 수확할 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    const crop =
        game.crops[index];

    if(!crop){

        showToast("작물이 없습니다.");

        return;
    }

    if(!crop.grown){

        showToast("아직 자라지 않았습니다.");

        return;
    }

    const type =
        crop.type;

    game.inventory[type] =
        (game.inventory[type] || 0) + 1;

    delete game.crops[index];

    game.stats.farming++;

    game.stats.exp += 15;

    checkLevel();

    createFarm();

    updateHUD();

    saveGame();

    showToast(
        `${ITEMS[type].name}을 수확했습니다.`
    );

}


/* =========================================================
   FISHING
========================================================= */

function fish(){

    if(game.location !== "sea"){

        showToast("바다에서만 낚시할 수 있습니다.");

        return;
    }

    if(game.energy < 8){

        showToast("에너지가 부족합니다.");

        return;
    }

    game.energy -= 8;

    const success =
        Math.random() < .75;

    if(success){

        game.inventory.fish++;

        game.stats.fishing++;

        game.stats.exp += 12;

        if(
            game.spirits.water.contract
        ){
            game.inventory.fish++;
        }

        showToast("물고기를 낚았습니다.");

    }else{

        showToast("물고기를 놓쳤습니다.");

    }

    checkLevel();

    updateHUD();

    saveGame();

}


/* =========================================================
   NEXT DAY
========================================================= */

function nextDay(){

    game.day++;
    game.npcWorld = {};
    initializeNPCWorld();
    updateNPCSchedules(true);

    game.energy =
        game.maxEnergy;

    game.choppedTrees = {};

    Object.values(game.crops)
        .forEach(crop=>{

            crop.age++;

            crop.watered = false;

            if(crop.age >= 1){
                crop.grown = true;
            }

        });

    createFarm();

    showToast(
        `${game.day}일차가 되었습니다.`
    );

    saveGame();

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(){

    if(game.location !== "house"){

        showToast("집에서 잠을 잘 수 있습니다.");

        return;
    }

    nextDay();

    game.time = 480;

    showToast(
        "푹 쉬었습니다."
    );

    saveGame();

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

    while(
        game.stats.exp >=
        game.stats.nextExp
    ){

        game.stats.exp -=
            game.stats.nextExp;

        game.stats.level++;

        game.stats.nextExp =
            Math.floor(
                game.stats.nextExp * 1.35
            );

        game.maxEnergy += 5;

        game.energy =
            game.maxEnergy;

        showToast(
            `레벨 ${game.stats.level} 달성!`
        );

    }

}

/* =========================================================
   MOVEMENT LOOP
========================================================= */

function gameLoop(timestamp){

    if(!lastTime){
        lastTime = timestamp;
    }

    const delta =
        Math.min(
            timestamp - lastTime,
            100
        );

    lastTime = timestamp;

    if(game){

        gameClockAccumulator += delta;

        /* 게임 시간은 실제 5초마다 게임 내 1분씩 흐릅니다. */
        while(gameClockAccumulator >= 5000){
            gameClockAccumulator -= 5000;
            game.time += 1;
            updateNPCSchedules(false);

            if(game.time >= 1440){
                game.time = 480;
                nextDay();
            }

            updateHUD();
        }

        updateNPCMovement(delta);

        let dx = 0;
        let dy = 0;

        if(
            keys["arrowup"] ||
            keys["w"]
        ){
            dy -= 1;
        }

        if(
            keys["arrowdown"] ||
            keys["s"]
        ){
            dy += 1;
        }

        if(
            keys["arrowleft"] ||
            keys["a"]
        ){
            dx -= 1;
        }

        if(
            keys["arrowright"] ||
            keys["d"]
        ){
            dx += 1;
        }

        if(dx !== 0 || dy !== 0){

            if(dx !== 0 && dy !== 0){

                dx *= .707;
                dy *= .707;

            }

            movePlayer(
                dx * delta / 16,
                dy * delta / 16
            );

        }

    }

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

/* =========================================================
   INACTIVITY
========================================================= */

function resetInactivityTimer(){

    if(!game) return;

    clearTimeout(inactivityTimer);

    clearTimeout(inactivityWarningTimer);

    inactiveWarning.classList.add("hidden");

    /*
        9분 후 경고
    */

    inactivityWarningTimer =
        setTimeout(()=>{

            if(!game) return;

            inactiveWarning.classList.remove(
                "hidden"
            );

        },9 * 60 * 1000);


    /*
        10분 후 시작 화면
    */

    inactivityTimer =
        setTimeout(()=>{

            if(!game) return;

            stopGame();

        },10 * 60 * 1000);

}


function registerActivity(){

    if(!game) return;

    resetInactivityTimer();

}


[
    "pointerdown",
    "pointermove",
    "touchstart"
].forEach(event=>{

    window.addEventListener(
        event,
        ()=>{
            if(game){
                resetInactivityTimer();
            }
        },
        {
            passive:true
        }
    );

});


/* =========================================================
   SPECIAL E INTERACTION
========================================================= */

function handleSpecialInteraction(){

    if(!game) return;

    /*
        집 문
    */

    if(game.location === "farm"){

        if(isNearFarmHouseDoor()){

            enterHouse();

            return true;
        }

    }


    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return true;
        }

    }


    /*
        나무 베기
    */

    if(getNearbyTree()){
        chopTree();
        return true;
    }

    /*
        NPC 집
    */

    if(game.location === "town"){
        const homeOwner=getTownHomeAtPlayer();
        if(homeOwner){
            enterNPCHouse(homeOwner);
            return true;
        }
    }

    if(game.location === "npcHouse" && game.player.y >= 82 && game.player.x >= 38 && game.player.x <= 62){
        leaveNPCHouse();
        return true;
    }

    /*
        상점 NPC
    */

    const npc =
        getNearbyNPC();

    if(
        npc &&
        npc.npc.shop
    ){

        openShop();

        return true;
    }

    return false;

}


/*
    기존 E 상호작용을 확장
*/

const originalInteract =
    interactNearby;

interactNearby = function(){

    if(
        handleSpecialInteraction()
    ){
        return;
    }

    originalInteract();

};
