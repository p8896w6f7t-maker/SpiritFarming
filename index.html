<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta
    name="format-detection"
    content="telephone=no"
>

<title>정령의 계절</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10151c;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
    user-select:none;
}

button{
    font:inherit;
    border:0;
    cursor:pointer;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* =========================
   START
========================= */

#startScreen,
#saveScreen{
    position:absolute;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 30%,#445e73 0%,#1b2632 40%,#0c1117 100%);
}

.startBox,
.saveBox{
    width:min(92vw,520px);
    padding:42px 30px;
    border-radius:28px;
    background:rgba(17,24,32,.94);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
    text-align:center;
    color:white;
}

.startTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:10px;
}

.startSub{
    color:#aeb8c3;
    margin-bottom:35px;
}

/* =========================
   CHARACTER SETUP
========================= */

.characterSetup{
    margin:0 auto 18px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    text-align:left;
}

.setupLabel{
    margin-bottom:6px;
    color:#dbe2e8;
    font-size:12px;
    font-weight:900;
}

.nicknameInput{
    width:100%;
    padding:11px 12px;
    margin-bottom:13px;
    border:1px solid #3a4855;
    border-radius:9px;
    outline:none;
    background:#202b37;
    color:white;
    font-size:13px;
}

.nicknameInput:focus{
    border-color:#e5c36a;
}

.nicknameInput::placeholder{
    color:#7f8b96;
}




.playerNickname{
    position:absolute;
    left:50%;
    top:-19px;
    transform:translateX(-50%);
    padding:2px 6px;
    border-radius:5px;
    background:rgba(12,17,23,.78);
    color:white;
    font-size:10px;
    font-weight:900;
    line-height:1.2;
    white-space:nowrap;
    text-shadow:0 1px 2px #000;
}

.mainStartBtn{
    width:100%;
    padding:18px;
    border-radius:15px;
    background:#e5c36a;
    color:#302817;
    font-size:20px;
    font-weight:900;
}

.mainStartBtn:active{
    transform:scale(.97);
}

.hidden{
    display:none !important;
}

/* =========================
   SAVE
========================= */

.saveBox h2{
    margin-bottom:22px;
}

.saveSlots{
    display:grid;
    gap:12px;
}

.saveSlot{
    padding:18px;
    border-radius:16px;
    background:#202b37;
    color:white;
    text-align:left;
    border:1px solid #334252;
}

.saveSlot:hover{
    background:#2b3948;
}

.saveSlotTitle{
    font-weight:900;
    margin-bottom:6px;
}

.saveSlotInfo{
    color:#aeb8c3;
    font-size:13px;
}

.saveSlotButtons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.saveSlotButtons button{
    padding:8px 12px;
    border-radius:9px;
    background:#e5c36a;
    color:#292218;
    font-weight:800;
}

.saveSlotButtons .deleteBtn{
    background:#553139;
    color:#ffdce1;
}

.backBtn{
    margin-top:18px;
    padding:11px 20px;
    border-radius:10px;
    background:#333e49;
    color:#ddd;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    left:15px;
    right:15px;
    top:15px;
    z-index:100;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudLeft,
.hudRight{
    display:flex;
    gap:8px;
}

.hudItem{
    padding:9px 13px;
    border-radius:12px;
    background:rgba(16,22,29,.82);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:13px;
    backdrop-filter:blur(8px);
}

#money{
    color:#f0d36e;
    font-weight:900;
}

/* =========================
   MAIN
========================= */

#main{
    position:absolute;
    inset:0;
}

#screen{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.location{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.location::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08),
            transparent 30%,
            rgba(0,0,0,.15)
        );
}

/* =========================
   FARM
========================= */

#farm{
    background:
        linear-gradient(
            #91b86a 0 28%,
            #b2c978 28% 100%
        );
}

.farmHouse{
    position:absolute;
    left:9%;
    top:8%;
    width:27%;
    height:27%;
    min-width:190px;
    min-height:150px;
    background:#b87554;
    border:8px solid #6a4035;
    border-radius:12px;
    z-index:5;
}

.farmHouseRoof{
    position:absolute;
    left:-10px;
    top:-55px;
    width:calc(100% + 20px);
    height:75px;
    background:#754d55;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.farmHouseDoor{
    position:absolute;
    left:40%;
    bottom:-2px;
    width:20%;
    height:32%;
    min-width:38px;
    background:#4b3028;
    border:4px solid #2e211c;
    border-radius:7px 7px 0 0;
    z-index:10;
}

.farmHouseDoor::after{
    content:"E";
    position:absolute;
    left:50%;
    top:-30px;
    transform:translateX(-50%);
    padding:2px 7px;
    border-radius:5px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:11px;
}

.field{
    position:absolute;
    left:40%;
    top:45%;
    width:45%;
    height:40%;
    background:#8d6849;
    border:7px solid #6b4d38;
    border-radius:8px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:6px;
    padding:8px;
}

.cropTile{
    background:#a67d56;
    border-radius:4px;
    position:relative;
}

.cropTile.watered{
    background:#647d78;
}

.crop{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:27px;
}

.farmTree{
    position:absolute;
    font-size:58px;
    z-index:3;
}

.tree1{left:4%;top:48%;}
.tree2{left:86%;top:15%;}
.tree3{left:90%;top:70%;}
.tree4{left:24%;top:70%;}

.pond{
    position:absolute;
    left:8%;
    bottom:10%;
    width:25%;
    height:25%;
    border-radius:50%;
    background:#5b9eb0;
    border:7px solid #42767f;
}

/* =========================
   TOWN
========================= */

#town{
    background:
        linear-gradient(
            #9bc4d1 0 30%,
            #c9b89a 30% 100%
        );
}

.townRoad{
    position:absolute;
    left:0;
    right:0;
    top:47%;
    height:25%;
    background:#b69d7c;
}

.townBuilding{
    position:absolute;
    width:23%;
    height:24%;
    background:#d59c78;
    border:6px solid #704d43;
    border-radius:10px;
}

.building1{
    left:8%;
    top:13%;
}

.building2{
    right:8%;
    top:13%;
}

.shopBuilding{
    left:38%;
    top:9%;
    width:25%;
    height:30%;
    background:#c98560;
    border-color:#674239;
}

.shopSign{
    position:absolute;
    top:-34px;
    left:50%;
    transform:translateX(-50%);
    padding:5px 16px;
    border-radius:8px;
    background:#e6c66d;
    color:#392e1c;
    font-weight:900;
    white-space:nowrap;
}

/* =========================
   FOREST
========================= */

#forest{
    background:
        linear-gradient(
            #4e7d59,
            #294c37
        );
}

.forestTree{
    position:absolute;
    font-size:70px;
}

.ft1{left:5%;top:8%;}
.ft2{left:25%;top:25%;}
.ft3{right:10%;top:10%;}
.ft4{right:30%;bottom:10%;}
.ft5{left:8%;bottom:12%;}

.shrine{
    position:absolute;
    left:43%;
    top:42%;
    width:15%;
    height:20%;
    min-width:100px;
    min-height:100px;
    border-radius:50%;
    background:#775a92;
    border:8px solid #4d3b61;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
}

/* =========================
   SEA
========================= */

#sea{
    background:
        linear-gradient(
            #73b6cb,
            #32798f
        );
}

.wave{
    position:absolute;
    color:rgba(255,255,255,.25);
    font-size:55px;
}

.w1{left:10%;top:25%;}
.w2{left:45%;top:15%;}
.w3{right:10%;top:35%;}
.w4{left:25%;bottom:20%;}
.w5{right:30%;bottom:10%;}

.dock{
    position:absolute;
    right:0;
    top:37%;
    width:30%;
    height:25%;
    background:#8c6549;
}

/* =========================
   HOUSE
========================= */

#house{
    background:
        linear-gradient(
            #b98663 0 22%,
            #d8bb91 22% 100%
        );
}

.houseFloor{
    position:absolute;
    left:5%;
    top:25%;
    width:90%;
    height:65%;
    background:#cba87b;
    border:8px solid #795544;
    border-radius:10px;
}

.houseBed{
    position:absolute;
    left:10%;
    top:15%;
    width:28%;
    height:30%;
    background:#e3e6eb;
    border:8px solid #694e4b;
    border-radius:10px;
}

.houseTable{
    position:absolute;
    right:15%;
    top:22%;
    width:22%;
    height:20%;
    background:#80583e;
    border:6px solid #573a2c;
}

.houseChest{
    position:absolute;
    right:17%;
    bottom:15%;
    width:18%;
    height:13%;
    background:#90623f;
    border:5px solid #573a2c;
}

.houseDoorInside{
    position:absolute;
    left:45%;
    bottom:-1px;
    width:10%;
    min-width:55px;
    height:18%;
    background:#4b3028;
    border:5px solid #2e211c;
    z-index:10;
}

/* =========================
   PLAYER
========================= */

#player{
    position:absolute;
    width:48px;
    height:58px;
    z-index:50;
    transform:translate(-50%,-50%);
    transition:transform .04s linear;
    pointer-events:none;
}

.playerBody{
    position:absolute;
    left:8px;
    bottom:0;
    width:32px;
    height:39px;
    background:#5476a5;
    border-radius:10px 10px 6px 6px;
    border:3px solid #27394f;
}

.playerHead{
    position:absolute;
    left:9px;
    top:0;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#efc39e;
    border:3px solid #6a483c;
}

 .playerHair{
    position:absolute;
    left:7px;
    top:-3px;
    width:34px;
    height:17px;
    background:#4c342e;
    border-radius:18px 18px 7px 7px;
    transition:all .12s ease;
}

.playerHair.hair-short{
    left:7px; top:-3px; width:34px; height:17px;
    border-radius:18px 18px 7px 7px;
}

.playerHair.hair-long{
    left:5px; top:-3px; width:38px; height:29px;
    border-radius:18px 18px 11px 11px;
}

.playerHair.hair-bob{
    left:4px; top:-2px; width:40px; height:24px;
    border-radius:19px 19px 12px 12px;
}

.playerHair.hair-spiky{
    left:6px; top:-6px; width:36px; height:20px;
    border-radius:4px 14px 7px 7px;
    clip-path:polygon(0 45%,12% 8%,27% 32%,42% 0,55% 31%,72% 5%,83% 35%,100% 18%,91% 100%,8% 100%);
}

.playerHair.hair-ponytail{
    left:7px; top:-3px; width:34px; height:18px;
    border-radius:18px 18px 7px 7px;
}
.playerHair.hair-ponytail::after{
    content:""; position:absolute; right:-8px; top:7px;
    width:14px; height:18px; background:#4c342e;
    border-radius:50% 60% 60% 40%;
}

.playerHair.hair-curly{
    left:4px; top:-5px; width:40px; height:21px;
    border-radius:50%;
    box-shadow:-4px 7px 0 #4c342e, 4px 9px 0 #4c342e, 12px 6px 0 #4c342e, 20px 8px 0 #4c342e;
}

/* =========================
   NPC
========================= */

.npc{
    position:absolute;
    width:86px;
    height:108px;
    transform:translate(-50%,-50%);
    z-index:45;
    text-align:center;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    pointer-events:auto;
}

/* NPC sprites are supplied as transparent PNGs. Keep the original NPC
   dialogue/schedule logic intact and only replace the visual layer. */
.npcSprite{
    position:absolute;
    left:50%;
    top:0;
    width:82px;
    height:88px;
    transform:translateX(-50%);
    object-fit:contain;
    object-position:center bottom;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.22));
}

.npcName{
    position:absolute;
    bottom:-20px;
    width:100%;
    color:white;
    font-size:11px;
    font-weight:800;
    text-shadow:0 2px 4px #000;
}

.npcShop .npcBody{
    background:#c99449;
}

.npcSpecial .npcBody{
    background:#8061a4;
}

.interactMark{
    position:absolute;
    top:-27px;
    left:50%;
    transform:translateX(-50%);
    padding:3px 7px;
    border-radius:6px;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:11px;
    white-space:nowrap;
    display:none;
}

.npc.near .interactMark{
    display:block;
}

@media(max-width:700px){
    .npc{
        width:100px;
        height:122px;
    }

    .npcSprite{
        width:96px;
        height:102px;
    }

    .npcName{
        bottom:-13px;
        font-size:10px;
    }
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
    position:absolute;
    right:15px;
    top:75px;
    z-index:120;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.sideBtn{
    width:48px;
    height:48px;
    border-radius:13px;
    background:rgba(16,22,29,.87);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:21px;
    backdrop-filter:blur(8px);
}

.sideBtn:active{
    transform:scale(.93);
}

/* =========================
   ACTION BAR
========================= */

#actionBar{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    gap:8px;
}

.actionBtn{
    padding:10px 13px;
    border-radius:10px;
    background:rgba(17,24,31,.88);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:12px;
    font-weight:800;
}


/* =========================
   SEA DETAILS
========================= */

.seaBeach{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#d9c184,#c9aa6c);z-index:1;}
.seaShore{position:absolute;left:0;right:0;bottom:38%;height:8%;background:rgba(255,255,255,.22);z-index:2;border-top:3px solid rgba(255,255,255,.28);}
.seaSun{position:absolute;right:8%;top:8%;font-size:58px;z-index:2;}
.seaCloud{position:absolute;font-size:42px;opacity:.65;z-index:2;}
.cloud1{left:12%;top:10%;}.cloud2{left:38%;top:22%;}
.boat{position:absolute;left:34%;top:28%;font-size:58px;z-index:3;}
.lighthouse{position:absolute;right:8%;bottom:31%;font-size:68px;z-index:4;}
.seaRock{position:absolute;font-size:28px;z-index:5;}.rock1{left:18%;bottom:12%;}.rock2{left:58%;bottom:8%;}.rock3{right:25%;bottom:16%;}
.shell{position:absolute;font-size:25px;z-index:5;}.shell1{left:35%;bottom:12%;}.shell2{right:40%;bottom:20%;}
.palm{position:absolute;font-size:65px;z-index:5;}.palm1{left:4%;bottom:18%;}.palm2{right:5%;bottom:12%;}
.fishingSpot{position:absolute;left:24%;bottom:34%;z-index:6;padding:8px 12px;border-radius:12px;background:rgba(30,75,88,.7);color:white;font-weight:900;text-align:center;}.fishingSpot span{display:block;font-size:10px;margin-top:2px;}

/* =========================
   NPC HOUSES
========================= */

.building1,.building2{overflow:visible;}
.building3{left:69%;top:75%;width:23%;height:20%;}
.homeSign{position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:7px;background:#e2bd69;color:#382d1d;font-size:11px;font-weight:900;white-space:nowrap;}
.npcHomeDoor{position:absolute;left:40%;bottom:-1px;width:20%;height:27%;min-width:30px;background:#4b3028;border:4px solid #2e211c;border-radius:6px 6px 0 0;}

/* =========================
   NPC HOUSE INTERIOR
========================= */

#npcHouse{background:linear-gradient(#a97858 0 20%,#d5b785 20% 100%);}
.npcHouseInterior{position:absolute;left:5%;top:15%;width:90%;height:75%;background:#c9a879;border:9px solid #704d3f;border-radius:12px;overflow:hidden;}
.npcHouseRoofTrim{position:absolute;left:0;right:0;top:0;height:13%;background:#8a5a48;}
.npcHouseTitle{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:white;font-size:20px;font-weight:900;z-index:3;text-shadow:0 2px 4px #000;white-space:nowrap;}
.npcHouseBed{position:absolute;left:10%;top:23%;width:25%;height:28%;background:#e5e9ed;border:7px solid #694e4b;border-radius:10px;}
.npcHouseTable{position:absolute;right:15%;top:28%;width:22%;height:18%;background:#80583e;border:6px solid #573a2c;}
.npcHouseCabinet{position:absolute;right:13%;bottom:15%;width:20%;height:18%;background:#90623f;border:5px solid #573a2c;}
.npcHouseDoor{position:absolute;left:45%;bottom:-1px;width:10%;min-width:50px;height:17%;background:#4b3028;border:5px solid #2e211c;z-index:5;}
.npcHouseOwner{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:12px;color:#5a4034;font-weight:900;}

/* tree interaction */
.farmTree,.forestTree{cursor:pointer;}
.farmTree.chopped,.forestTree.chopped{display:none;}

/* =========================
   MOBILE CONTROL
========================= */

#mobileControls{
    position:absolute;
    left:20px;
    bottom:20px;
    z-index:150;
    width:145px;
    height:145px;
}

.dpad{
    position:absolute;
    inset:0;
}

.dpad button{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:12px;
    background:rgba(20,27,34,.78);
    color:white;
    font-size:22px;
    border:1px solid rgba(255,255,255,.12);
    touch-action:none;
}

.up{left:49px;top:0;}
.left{left:0;top:49px;}
.right{right:0;top:49px;}
.down{left:49px;bottom:0;}

/* =========================
   PANEL
========================= */

#panel{
    position:absolute;
    inset:0;
    z-index:500;
    background:rgba(5,8,11,.67);
    display:flex;
    justify-content:flex-end;
}

.panelBox{
    width:min(520px,92vw);
    height:100%;
    background:#151d25;
    color:white;
    padding:30px;
    overflow:auto;
    box-shadow:-20px 0 60px rgba(0,0,0,.4);
}

.panelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.panelHeader h2{
    font-size:24px;
}

.closePanel{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#2b3641;
    color:white;
    font-size:20px;
}

/* =========================
   CHARACTER
========================= */

.stat{
    margin-bottom:18px;
}

.statLabel{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:13px;
}

.statBar{
    height:10px;
    background:#2c3742;
    border-radius:20px;
    overflow:hidden;
}

.statFill{
    height:100%;
    background:#e0bb5e;
}

/* =========================
   INVENTORY
========================= */

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.itemCard{
    min-height:110px;
    padding:12px;
    border-radius:13px;
    background:#202b36;
    border:1px solid #33414f;
    text-align:center;
}

.itemIcon{
    font-size:32px;
    margin-bottom:5px;
}

.itemName{
    font-size:12px;
    font-weight:800;
}

.mapLocationDesc{

}

/* =========================

========================= */

}

    background:rgba(17,24,31,.96);

/* =========================

========================= */

.shopTabs{

}

.shopTab.active{

.shopList{
    display:grid;
    gap:9px;
}

.shopItem{

    border:1px solid #34414d;
}

.shopItemIcon{

    height:50px;
    border-radius:10px;
    background:#2d3945;

.shopItemName{
    font-weight:900;
}

.shopItemDesc{
    color:#9eabb7;

}

.shopItemPrice{

    font-size:12px;
    margin-top:4px;
}

.shopItem button{
    padding:9px 11px;
    border-radius:9px;
    background:#d5b45c;
    color:#302719;
    font-weight:900;
}

.shopItem button.sell{
    background:#6d8b70;
    color:white;
}

.shopItem button:disabled{
    opacity:.35;
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;
    left:50%;
    top:85px;
    transform:translateX(-50%) translateY(-10px);
    z-index:900;
    padding:11px 17px;
    border-radius:12px;
    background:rgba(16,22,29,.92);
    color:white;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   INACTIVITY
========================= */

#inactiveWarning{
    position:absolute;
    inset:0;
    z-index:800;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.5);
    pointer-events:none;
}

.warningBox{
    padding:20px 25px;
    border-radius:15px;
    background:#171e26;
    color:white;
    text-align:center;
}

.warningBox strong{
    color:#e4c565;
}

/* =========================

========================= */

@media(max-width:700px){

function getNPCSchedule(id){
    const list=NPC_SCHEDULES[id];
    if(!list) return null;
    return list.find(s=>game.time>=s.start && game.time<s.end) || list[list.length-1];
}

function getNPCWorld(id){
    if(!game.npcWorld) game.npcWorld={};
    if(!game.npcWorld[id]){
        const n=NPC_DATA[id];
        game.npcWorld[id]={x:n.x,y:n.y,targetX:n.x,targetY:n.y,home:false};
    }
    return game.npcWorld[id];
}

function initializeNPCWorld(){
    if(!game.npcWorld) game.npcWorld={};
    Object.keys(NPC_DATA).forEach(id=>{
        const w=getNPCWorld(id), sc=getNPCSchedule(id);
        if(sc){ w.targetX=sc.x; w.targetY=sc.y; w.home=!!sc.home; }
    });
}

function updateNPCSchedules(force=false){
    if(!game) return;
    let changed=false;
    Object.keys(NPC_DATA).forEach(id=>{
        const sc=getNPCSchedule(id), w=getNPCWorld(id);
        if(!sc) return;
        if(force || w.targetX!==sc.x || w.targetY!==sc.y || w.home!==!!sc.home){
            w.targetX=sc.x; w.targetY=sc.y; w.home=!!sc.home; changed=true;
        }
    });
    if(changed){
        createNPCs();
        renderNPCInHouse();
    }
}

function updateNPCMovement(delta){
    if(!game) return;
    let moved=false;
    Object.keys(NPC_DATA).forEach(id=>{
        const w=getNPCWorld(id);
        if(w.home) return;
        const dx=w.targetX-w.x, dy=w.targetY-w.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d>0.15){
            const step=Math.min(d,0.006*delta);
            w.x += dx/d*step;
            w.y += dy/d*step;
            moved=true;
        }
    });
    if(moved){
        document.querySelectorAll('.npc').forEach(el=>{
            const w=game.npcWorld && game.npcWorld[el.dataset.npc];
            if(w){el.style.left=w.x+'%';el.style.top=w.y+'%';}
        });
        updateNearby();
    }
}

function renderNPCInHouse(){
    document.querySelectorAll('.npcHouseResident').forEach(el=>el.remove());
    if(!game || game.location!=='npcHouse' || !game.npcHome) return;
    const id=game.npcHome, npc=NPC_DATA[id], w=getNPCWorld(id);
    if(!npc || !w.home) return;
    const el=document.createElement('div');
    el.className='npc npcHouseResident';
    el.dataset.npc=id;
    el.style.left='50%';
    el.style.top='58%';
    el.innerHTML='<div class="npcCssHead"></div><div class="npcCssHair '+(id==='luna'?'long':id==='rose'?'bob':id==='elder'?'spiky':'')+'"></div><div class="npcCssBody" style="background:'+(npc.color || '#5476a5')+'"></div><div class="npcName">'+npc.name+'</div>';
    screen.appendChild(el);
}

function showToast(text){

function formatTime(minutes){

    minutes = Math.max(0,Math.min(1439,minutes));

    const h =
        String(Math.floor(minutes / 60)).padStart(2,"0");

    const m =
        String(minutes % 60).padStart(2,"0");

    return `${h}:${m}`;
}

    game.saveSlot = slot;

    const nicknameInput =
        document.getElementById("nicknameInput");

    const nickname =
        nicknameInput
            ? nicknameInput.value.trim()
            : "";

    game.player.nickname =
        nickname.slice(0,12) || "플레이어";

    game.player.characterId =
        CHARACTER_IDS.includes(window.selectedCharacterId)
            ? window.selectedCharacterId
            : "sleepy";

    game.location = "farm";

    game.player.x = 50;
    game.player.y = 68;

    createFarm();

    enterGame();

    saveGame();

function loadGame(slot){

    const data = getSave(slot);

    if(!data) return;

    const fresh = clone(DEFAULT_GAME);

    game = Object.assign(fresh,data);

    game.player =
        Object.assign(
            fresh.player,
            data.player || {}
        );

    game.inventory =
        Object.assign(
            fresh.inventory,
            data.inventory || {}
        );

    game.stats =
        Object.assign(
            fresh.stats,
            data.stats || {}
        );

    game.npc =
        Object.assign(
            fresh.npc,
            data.npc || {}
        );

    game.spirits =
        Object.assign(
            fresh.spirits,
            data.spirits || {}
        );

    game.crops =
        Object.assign(
            fresh.crops,
            data.crops || {}
        );

    game.saveSlot = slot;

    enterGame();

}

}

function createFarm(){

    const field =
        document.getElementById("field");

    if(!field) return;

    field.innerHTML = "";

    for(let i=0;i<24;i++){

        const tile =
            document.createElement("div");

        tile.className = "cropTile";

        tile.dataset.index = i;

        const crop =
            game?.crops?.[i];

        if(crop){

            if(crop.watered){
                tile.classList.add("watered");
            }

            const icon =
                document.createElement("div");

            icon.className = "crop";

            icon.textContent =
                crop.grown
                ? "🥬"
                : "🌱";

            tile.appendChild(icon);

        }

        field.appendChild(tile);

    }

}

/* =========================================================
   TRANSITIONS
========================================================= */

function isNearFarmHouseDoor(){

    if(!game || game.location !== "farm") return false;

    return (
        game.player.x >= 8 &&
        game.player.x <= 37 &&
        game.player.y >= 25 &&
        game.player.y <= 44
    );

}

function isNearHouseExit(){

    if(!game || game.location !== "house") return false;

    return (
        game.player.x >= 35 &&
        game.player.x <= 65 &&
        game.player.y >= 74
    );

}

function enterHouse(){

    if(!game || game.location !== "farm") return false;

    setLocation("house");

    game.player.x = 50;
    game.player.y = 73;

    updatePlayer();

    showToast("집에 들어왔습니다.");

    return true;

}

function leaveHouse(){

    if(!game || game.location !== "house") return false;

    setLocation("farm");

    game.player.x = 23;
    game.player.y = 45;

    updatePlayer();

    showToast("농장으로 나왔습니다.");

    return true;

}

function getTownHomeAtPlayer(){

    if(!game || game.location !== "town") return null;

    const x=game.player.x, y=game.player.y;

    if(x>=14 && x<=25 && y>=34 && y<=46) return "mina";
    if(x>=76 && x<=87 && y>=34 && y<=46) return "theo";
    if(x>=76 && x<=87 && y>=91 && y<=98) return "elder";
    if(x>=46 && x<=55 && y>=34 && y<=46) return "rose";

    return null;

}

function enterNPCHouse(owner){

    if(!game || !NPC_DATA[owner]) return false;

    game.npcHome = owner;
    setLocation("npcHouse");
    game.npcHome = owner;
    game.player.x = 50;
    game.player.y = 74;
    updatePlayer();
    renderNPCHouse();
    showToast(`${NPC_DATA[owner].name}의 집에 들어왔습니다.`);
    return true;

}

function leaveNPCHouse(){

    if(!game || game.location !== "npcHouse") return false;

    game.npcHome = null;
    setLocation("town");
    game.player.x = 50;
    game.player.y = 46;
    updatePlayer();
    showToast("마을로 나왔습니다.");
    return true;

}

function renderNPCHouse(){

    const title=document.getElementById("npcHouseTitle");
    const owner=document.getElementById("npcHouseOwner");
    if(!title || !owner) return;
    const npc=game && game.npcHome ? NPC_DATA[game.npcHome] : null;
    if(npc){
        title.textContent=`${npc.name}의 집`;
        owner.textContent=`집주인 · ${npc.name}`;
    }else{
        title.textContent="NPC의 집";
        owner.textContent="집주인";
    }

}

function checkTransitions(){

    if(!game) return;

    const x = game.player.x;
    const y = game.player.y;

    if(game.location === "farm"){

        if(isNearFarmHouseDoor()){

            enterHouse();

            return;
        }

        if(
            x >= 97 &&
            y >= 48 &&
            y <= 82
        ){

            setLocation("town");

            game.player.x = 8;
            game.player.y = 65;

            updatePlayer();

            return;
        }

    }


    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return;
        }

    }

    if(game.location === "npcHouse"){

        if(y >= 86 && x >= 40 && x <= 60){
            leaveNPCHouse();
            return;
        }

    }


    if(game.location === "town"){

        const homeOwner = getTownHomeAtPlayer();
        if(homeOwner){
            enterNPCHouse(homeOwner);
            return;
        }

        if(
            x <= 3 &&
            y >= 45 &&
            y <= 85
        ){

            setLocation("farm");

            game.player.x = 92;
            game.player.y = 65;

            updatePlayer();

            return;
        }

        if(
            y <= 3 &&
            x >= 40 &&
            x <= 62
        ){

            setLocation("forest");

            game.player.x = 50;
            game.player.y = 91;

            updatePlayer();

            return;
        }

        if(
            x >= 97 &&
            y >= 35 &&
            y <= 65
        ){

            setLocation("sea");

            game.player.x = 8;
            game.player.y = 65;

            updatePlayer();

            return;
        }

    }


    if(game.location === "forest"){

        if(
            y >= 97 &&
            x >= 35 &&
            x <= 65
        ){

            setLocation("town");

            game.player.x = 50;
            game.player.y = 8;

            updatePlayer();

            return;
        }

    }


    if(game.location === "sea"){

        if(
            x <= 3 &&
            y >= 35 &&
            y <= 85
        ){

            setLocation("town");

            game.player.x = 92;
            game.player.y = 55;

            updatePlayer();

            return;
        }

    }

}


/* =========================================================
   MOVEMENT
========================================================= */

function canMove(nx,ny){

    if(nx < 2 || nx > 98 || ny < 2 || ny > 98){
        return false;
    }

    if(game.location === "farm"){

        /*
            집 본체 충돌.
            문 중앙은 통과 가능.
        */

        const inHouse =
            nx >= 8 &&
            nx <= 37 &&
            ny >= 8 &&
            ny <= 35;

        const door =
            nx >= 17 &&
            nx <= 27 &&
            ny >= 26 &&
            ny <= 43;

        if(inHouse && !door){
            return false;
        }

        /*
            연못
        */

        if(
            nx >= 8 &&
            nx <= 33 &&
            ny >= 65 &&
            ny <= 92
        ){
            return false;
        }

    }


    if(game.location === "town"){

        if(
            nx >= 8 &&
            nx <= 31 &&
            ny >= 13 &&
            ny <= 38
        ){
            return false;
        }

        if(
            nx >= 69 &&
            nx <= 92 &&
            ny >= 13 &&
            ny <= 38
        ){
            return false;
        }

        /*
            상점 건물.
            입구 앞은 비워둠.
        */

        if(
            nx >= 38 &&
            nx <= 63 &&
            ny >= 9 &&
            ny <= 39
        ){

            const shopDoor =
                nx >= 46 &&
                nx <= 55 &&
                ny >= 35 &&
                ny <= 44;

            if(!shopDoor){
                return false;
            }

        }

    }


    if(game.location === "forest"){

        if(
            nx >= 39 &&
            nx <= 61 &&
            ny >= 40 &&
            ny <= 63
        ){
            return false;
        }

    }


    if(game.location === "npcHouse"){

        if(nx >= 10 && nx <= 35 && ny >= 39 && ny <= 55){
            return false;
        }
        if(nx >= 68 && nx <= 90 && ny >= 43 && ny <= 58){
            return false;
        }
        if(nx >= 67 && nx <= 87 && ny >= 73 && ny <= 88){
            return false;
        }

    }

    if(game.location === "house"){

        /*
            가구 충돌
        */

        if(
            nx >= 10 &&
            nx <= 38 &&
            ny >= 39 &&
            ny <= 55
        ){
            return false;
        }

        if(
            nx >= 68 &&
            nx <= 90 &&
            ny >= 43 &&
            ny <= 58
        ){
            return false;
        }

        if(
            nx >= 67 &&
            nx <= 87 &&
            ny >= 73 &&
            ny <= 88
        ){
            return false;
        }

    }

    return true;

}


function movePlayer(dx,dy){

    if(!game) return;

    let speed = 0.38;

    if(game.spirits.wind.contract){
        speed = 0.46;
    }

    const nx =
        game.player.x + dx * speed;

    const ny =
        game.player.y + dy * speed;

    if(canMove(nx,ny)){

        game.player.x = nx;
        game.player.y = ny;

        if(Math.abs(dx)>Math.abs(dy)){

            game.player.direction =
                dx > 0 ? "right" : "left";

        }else if(dy !== 0){

            game.player.direction =
                dy > 0 ? "down" : "up";

        }

        updatePlayer();

        updateNearby();

        checkTransitions();

    }

}


function updatePlayer(){

    if(!game) return;

    playerEl.style.left =
        game.player.x + "%";

    playerEl.style.top =
        game.player.y + "%";

    const nicknameEl =
        document.getElementById("playerNickname");

    if(nicknameEl){
        nicknameEl.textContent =
            game.player.nickname || "플레이어";
    }

    const characterEl = document.getElementById("playerCharacter");
    const characterId = CHARACTER_IDS.includes(game.player.characterId) ? game.player.characterId : "sleepy";
    game.player.characterId = characterId;
    const characterSprite = CHARACTER_SPRITES[characterId];
    if(characterEl && characterSprite){
        characterEl.src = characterSprite;
        characterEl.alt = CHARACTER_NAMES[characterId] || "캐릭터";
    }
}


/* =========================================================
   TREE CHOPPING
========================================================= */

function getTreePositions(){
    return {
        farm:{
            "farm-tree1":[7,55],
            "farm-tree2":[89,22],
            "farm-tree3":[93,77],
            "farm-tree4":[27,77]
        },
        forest:{
            "forest-ft1":[8,18],
            "forest-ft2":[28,35],
            "forest-ft3":[88,20],
            "forest-ft4":[70,86],
            "forest-ft5":[12,84]
        }
    };
}

function updateChoppableTrees(){
    if(!game) return;
    document.querySelectorAll("[data-tree-id]").forEach(el=>{
        const id=el.dataset.treeId;
        el.classList.toggle("chopped", !!game.choppedTrees[id]);
    });
}

function getNearbyTree(){
    if(!game || !["farm","forest"].includes(game.location)) return null;
    let closest=null, best=Infinity;
    const positions=getTreePositions()[game.location] || {};
    Object.entries(positions).forEach(([id,pos])=>{
        if(game.choppedTrees[id]) return;
        const dx=game.player.x-pos[0], dy=game.player.y-pos[1];
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<best){best=d; closest={id,x:pos[0],y:pos[1]};}
    });
    return best<=11 ? closest : null;
}

function chopTree(){
    if(!game || !["farm","forest"].includes(game.location)){
        showToast("농장이나 숲에서만 나무를 벨 수 있습니다.");
        return;
    }
    if(game.energy < 5){
        showToast("에너지가 부족합니다.");
        return;
    }
    const tree=getNearbyTree();
    if(!tree){
        showToast("나무 가까이에서 나무 베기를 사용하세요.");
        return;
    }
    game.energy-=5;
    const amount=game.spirits.forest.contract ? 3 : 2;
    game.inventory.wood=(game.inventory.wood||0)+amount;
    game.inventory.stone=(game.inventory.stone||0)+1;
    game.stats.exp+=8;
    game.stats.farming++;
    game.choppedTrees[tree.id]=true;
    checkLevel();
    updateChoppableTrees();
    updateHUD();
    saveGame();
    showToast(`나무를 베었습니다. 나무 +${amount}`);
}

   기존 openDialogue()를 호출한다. NPC의 대화/선물/상점/호감도 로직은 그대로 유지한다. */

/* =========================================================
   NPC NEARBY
========================================================= */

function distanceToNPC(npc){

    const dx =
        game.player.x - npc.x;

    const dy =
        game.player.y - npc.y;

    return Math.sqrt(
        dx*dx + dy*dy
    );

}


function getNearbyNPC(){

    if(!game) return null;

    let closest = null;

    let distance = Infinity;

    Object.entries(NPC_DATA).forEach(([id,npc])=>{

        if(npc.location !== game.location) return;

        const d =
            distanceToNPC(npc);

        if(d < distance){

            distance = d;

            closest = {
                id,
                npc
            };

        }

    });

    if(distance <= 12){
        return closest;
    }

    return null;

}


function updateNearby(){

    if(!game) return;

    const nearby =
        getNearbyNPC();

    document
        .querySelectorAll(".npc")
        .forEach(el=>{

            if(
                nearby &&
                el.dataset.npc === nearby.id
            ){
                el.classList.add("near");
            }else{
                el.classList.remove("near");
            }

        });

}


/* =========================================================
   SPIRIT WORLD INTERACTION
========================================================= */

function isSpiritNight(){
    return game && (game.time >= 1140 || game.time < 360);
}

function createSpiritWorlds(){
    document.querySelectorAll(".spiritWorld").forEach(el=>el.remove());
    if(!game) return;

    Object.entries(SPIRIT_DATA).forEach(([id,spirit])=>{
        if(spirit.location !== game.location) return;
        if(spirit.nightOnly && !isSpiritNight()) return;

        const state = game.spirits[id];
        const el = document.createElement("div");
        el.className = "spiritWorld";
        el.dataset.spirit = id;
        el.style.left = spirit.x + "%";
        el.style.top = spirit.y + "%";
        el.innerHTML = `
            <div class="spiritWorldMark">터치 / E 상호작용</div>
            <div class="spiritWorldIcon">${spirit.icon}</div>
            <div class="spiritWorldName">${spirit.name}</div>
        `;
        screen.appendChild(el);
    });
    updateNearbySpirit();
}

function getNearbySpirit(){
    if(!game) return null;
    let closest=null, distance=Infinity;
    Object.entries(SPIRIT_DATA).forEach(([id,spirit])=>{
        if(spirit.location !== game.location) return;
        if(spirit.nightOnly && !isSpiritNight()) return;
        // 정령은 장식/상호작용 오브젝트일 뿐 이동 충돌을 만들지 않는다.
        const dx=game.player.x-spirit.x;
        const dy=game.player.y-spirit.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<distance){ distance=d; closest={id,spirit}; }
    });
    return distance<=13 ? closest : null;
}

function updateNearbySpirit(){
    const nearby=getNearbySpirit();
    document.querySelectorAll(".spiritWorld").forEach(el=>{
        el.classList.toggle("near",!!nearby && el.dataset.spirit===nearby.id);
    });
}
/* Mobile/touch spirit interaction. Tap the spirit directly to open the in-game dialogue. */
screen.addEventListener("pointerup", e=>{
    const spiritEl=e.target.closest(".spiritWorld");
    if(!spiritEl || !game) return;
    e.preventDefault();
    e.stopPropagation();
    registerActivity();
    const id=spiritEl.dataset.spirit;
    if(id && SPIRIT_DATA[id]) showSpiritDialogue(id, SPIRIT_DATA[id].talk[(game.day-1)%SPIRIT_DATA[id].talk.length]);
},{passive:false});

function spiritTalk(id){
    const spirit=SPIRIT_DATA[id];
    const state=game.spirits[id];
    if(!spirit || !state) return;
    if(state.lastTalkDay===game.day){
        showToast("오늘은 이미 이야기를 나눴습니다.");
        return;
    }
    state.lastTalkDay=game.day;
    state.affection += 1;
    showSpiritDialogue(id, spirit.talk[(game.day-1)%spirit.talk.length]);
    saveGame();
}

function spiritGift(id,itemId){
    const spirit=SPIRIT_DATA[id];
    const state=game.spirits[id];
    if(!spirit || !state || !ITEMS[itemId]) return;
    if(state.lastGiftDay===game.day){
        showToast("오늘은 이미 선물을 건넸습니다.");
        return;
    }
    const count=game.inventory[itemId]||0;
    if(count<=0){ showToast("그 아이템이 없습니다."); return; }
    game.inventory[itemId]=count-1;
    const amount=spirit.gifts[itemId]||1;
    state.affection += amount;
    state.lastGiftDay=game.day;
    showSpiritDialogue(id, `${ITEMS[itemId]?.name||itemId}을(를) 받았어. 고마워. 호감도 +${amount}`);
    saveGame();
}

function showSpiritDialogue(id,text){
    const spirit=SPIRIT_DATA[id], state=game.spirits[id];
    dialogue.classList.remove("hidden");
    dialogue.innerHTML=`
        <div class="dialogueBox">
            <div class="dialogueName">${spirit.icon} ${spirit.name}</div>
            <div class="dialogueText">${text}</div>
            <div class="spiritMood">호감도 ${state.affection} / 계약 조건 ${spirit.need}</div>
            <div class="spiritInteractBox">

/* =========================================================
   INTERACTION
========================================================= */

function interactNearby(){

    if(!game) return;

    if(game.location === "npcHouse"){
        if(game.player.y >= 82 && game.player.x >= 38 && game.player.x <= 62){
            leaveNPCHouse();
            return;
        }
    }

    const nearbySpirit = getNearbySpirit();

    if(nearbySpirit){
        showSpiritDialogue(nearbySpirit.id, SPIRIT_DATA[nearbySpirit.id].talk[(game.day-1)%SPIRIT_DATA[nearbySpirit.id].talk.length]);
        return;
    }

    const nearby =
        getNearbyNPC();

    if(nearby){

        openDialogue(
            nearby.id
        );

        return;
    }

    /*
        숲 제단
    */

    if(game.location === "forest"){

        const dx =
            game.player.x - 50;

        const dy =
            game.player.y - 52;

        if(Math.sqrt(dx*dx+dy*dy) < 15){

            openPanel("spirits");

            return;
        }

    }

    /*
        집 침대
    */

    if(game.location === "house"){

        if(
            game.player.x >= 10 &&
            game.player.x <= 42 &&
            game.player.y >= 30 &&
            game.player.y <= 60
        ){

            sleep();

            return;
        }

    }

    /*
        집 문
    */

    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return;
        }

    }

}

function chooseDialogue(index){

    if(!currentNPC) return;

    const npc =
        NPC_DATA[currentNPC];

    const data =
        npc.dialogue[dialogueIndex];

    const amount =
        data.choices[index][1];

    game.npc[currentNPC] =
        Math.max(
            0,
            (game.npc[currentNPC] || 0) + amount
        );

    if(amount > 0){

        showToast(
            `호감도 +${amount}`
        );

    }else if(amount < 0){

        showToast(
            `호감도 ${amount}`
        );

    }else{

        showToast(
            "호감도 변화 없음"
        );

    }

    game.stats.friendship +=
        amount > 0 ? 1 : 0;

    checkLevel();

    dialogueIndex++;

    if(dialogueIndex >= npc.dialogue.length){

        dialogueIndex = 0;

    }

    saveGame();

    renderDialogue();

}


function giveGift(){

    if(!currentNPC) return;

    if(game.inventory.herb > 0){

        game.inventory.herb--;

        game.npc[currentNPC] += 5;

        showToast(
            `${NPC_DATA[currentNPC].name}의 호감도 +5`
        );

    }else if(game.inventory.turnip > 0){

        game.inventory.turnip--;

        game.npc[currentNPC] += 3;

        showToast(
            `${NPC_DATA[currentNPC].name}의 호감도 +3`
        );

    }else{

        showToast(
            "선물할 아이템이 없습니다."
        );

    }

    saveGame();

    renderDialogue();

}

function buyItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.buy) return;

    if(game.money < item.buy){

        showToast("돈이 부족합니다.");

        return;
    }

    game.money -= item.buy;

    game.inventory[id] =
        (game.inventory[id] || 0) + 1;

    showToast(
        `${item.name} 1개 구매`
    );

    updateHUD();

    saveGame();

    renderShop();

}


function sellAllItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.sell) return;

    const count =
        game.inventory[id] || 0;

    if(count <= 0){

        showToast("아이템이 없습니다.");

        return;
    }

    const total =
        item.sell * count;

    game.inventory[id] = 0;

    game.money += total;

    showToast(
        `${item.name} ${count}개를 모두 판매했습니다. +${moneyText(total)}`
    );

    updateHUD();

    saveGame();

    renderShop();

}


function sellItem(id){

    const item =
        ITEMS[id];

    if(!item || !item.sell) return;

    if(
        !game.inventory[id] ||
        game.inventory[id] <= 0
    ){

        showToast("아이템이 없습니다.");

        return;
    }

    game.inventory[id]--;

    game.money += item.sell;

    showToast(
        `${item.name} 1개 판매`
    );

    updateHUD();

    saveGame();

    renderShop();

}

/* =========================================================
   FARM ACTIONS
========================================================= */

function getSelectedCropTile(){

    if(!game || game.location !== "farm"){
        return null;
    }

    const field =
        document.getElementById("field");

    const rect =
        field.getBoundingClientRect();

    const px =
        window.innerWidth *
        game.player.x / 100;

    const py =
        window.innerHeight *
        game.player.y / 100;

    if(
        px < rect.left ||
        px > rect.right ||
        py < rect.top ||
        py > rect.bottom
    ){
        return null;
    }

    const cols = 6;
    const rows = 4;

    const col =
        Math.floor(
            (px - rect.left) /
            rect.width *
            cols
        );

    const row =
        Math.floor(
            (py - rect.top) /
            rect.height *
            rows
        );

    if(
        col < 0 ||
        col >= cols ||
        row < 0 ||
        row >= rows
    ){
        return null;
    }

    return row * cols + col;

}


function plantCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 심을 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    if(game.crops[index]){

        showToast("이미 작물이 있습니다.");

        return;
    }

    let seed = null;

    if(game.inventory.turnip_seed > 0){
        seed = "turnip";
        game.inventory.turnip_seed--;
    }else if(game.inventory.potato_seed > 0){
        seed = "potato";
        game.inventory.potato_seed--;
    }else if(game.inventory.wheat_seed > 0){
        seed = "wheat";
        game.inventory.wheat_seed--;
    }

    if(!seed){

        showToast("씨앗이 없습니다.");

        return;
    }

    game.crops[index] = {
        type:seed,
        watered:false,
        grown:false,
        age:0
    };

    game.energy =
        Math.max(0,game.energy - 5);

    createFarm();

    updateHUD();

    saveGame();

    showToast("씨앗을 심었습니다.");

}


function waterCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 물을 줄 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    const crop =
        game.crops[index];

    if(!crop){

        showToast("심어진 작물이 없습니다.");

        return;
    }

    crop.watered = true;

    game.energy =
        Math.max(0,game.energy - 3);

    createFarm();

    updateHUD();

    saveGame();

    showToast("작물에 물을 줬습니다.");

}


function harvestCrop(){

    if(game.location !== "farm"){

        showToast("농장에서만 수확할 수 있습니다.");

        return;
    }

    const index =
        getSelectedCropTile();

    if(index === null){

        showToast("밭 근처로 이동하세요.");

        return;
    }

    const crop =
        game.crops[index];

    if(!crop){

        showToast("작물이 없습니다.");

        return;
    }

    if(!crop.grown){

        showToast("아직 자라지 않았습니다.");

        return;
    }

    const type =
        crop.type;

    game.inventory[type] =
        (game.inventory[type] || 0) + 1;

    delete game.crops[index];

    game.stats.farming++;

    game.stats.exp += 15;

    checkLevel();

    createFarm();

    updateHUD();

    saveGame();

    showToast(
        `${ITEMS[type].name}을 수확했습니다.`
    );

}

========================================================= */

function fish(){

    if(game.location !== "sea"){

        showToast("바다에서만 낚시할 수 있습니다.");

        return;
    }

    if(game.energy < 8){

        showToast("에너지가 부족합니다.");

        return;
    }

    game.energy -= 8;

    const success =
        Math.random() < .75;

    if(success){

        game.inventory.fish++;

        game.stats.fishing++;

        game.stats.exp += 12;

        if(
            game.spirits.water.contract
        ){
            game.inventory.fish++;
        }

        showToast("물고기를 낚았습니다.");

    }else{

        showToast("물고기를 놓쳤습니다.");

    }

    checkLevel();

    updateHUD();

    saveGame();

}

========================================================= */

function nextDay(){

    game.day++;
    game.npcWorld = {};
    initializeNPCWorld();
    updateNPCSchedules(true);

    game.energy =
        game.maxEnergy;

    game.choppedTrees = {};

    Object.values(game.crops)
        .forEach(crop=>{

            crop.age++;

            crop.watered = false;

            if(crop.age >= 1){
                crop.grown = true;
            }

        });

    createFarm();

    showToast(
        `${game.day}일차가 되었습니다.`
    );

    saveGame();

}

/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

    while(
        game.stats.exp >=
        game.stats.nextExp
    ){

        game.stats.exp -=
            game.stats.nextExp;

        game.stats.level++;

        game.stats.nextExp =
            Math.floor(
                game.stats.nextExp * 1.35
            );

        game.maxEnergy += 5;

        game.energy =
            game.maxEnergy;

        showToast(
            `레벨 ${game.stats.level} 달성!`
        );

    }

}

function updateHUD(){

    document.getElementById("timeText").textContent =
        formatTime(game.time);

/* =========================================================

window.addEventListener("keydown",e=>{

    registerActivity();

    if(
        e.key === "ArrowUp" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "w" ||
        e.key.toLowerCase() === "a" ||
        e.key.toLowerCase() === "s" ||
        e.key.toLowerCase() === "d"
    ){

        e.preventDefault();

    }

    if(e.key === "e" || e.key === "E"){

        interactNearby();

        return;
    }

    if(e.key === "Escape"){

        closePanel();

        dialogue.classList.add("hidden");

        return;
    }

    keys[e.key.toLowerCase()] = true;

});


window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


/* =========================================================
   MOVEMENT LOOP
========================================================= */

function gameLoop(timestamp){

    if(!lastTime){
        lastTime = timestamp;
    }

    const delta =
        Math.min(
            timestamp - lastTime,
            100
        );

    lastTime = timestamp;

    if(game){

        gameClockAccumulator += delta;

        /* 게임 시간은 실제 5초마다 게임 내 1분씩 흐릅니다. */
        while(gameClockAccumulator >= 5000){
            gameClockAccumulator -= 5000;
            game.time += 1;
            updateNPCSchedules(false);

            if(game.time >= 1440){
                game.time = 480;
                nextDay();
            }

            updateHUD();
        }

        updateNPCMovement(delta);

        let dx = 0;
        let dy = 0;

        if(
            keys["arrowup"] ||
            keys["w"]
        ){
            dy -= 1;
        }

        if(
            keys["arrowdown"] ||
            keys["s"]
        ){
            dy += 1;
        }

        if(
            keys["arrowleft"] ||
            keys["a"]
        ){
            dx -= 1;
        }

        if(
            keys["arrowright"] ||
            keys["d"]
        ){
            dx += 1;
        }

        if(dx !== 0 || dy !== 0){

            if(dx !== 0 && dy !== 0){

                dx *= .707;
                dy *= .707;

            }

            movePlayer(
                dx * delta / 16,
                dy * delta / 16
            );

        }

    }

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

/* =========================================================
   INACTIVITY
========================================================= */

function resetInactivityTimer(){

    if(!game) return;

    clearTimeout(inactivityTimer);

    clearTimeout(inactivityWarningTimer);

    inactiveWarning.classList.add("hidden");

    /*
        9분 후 경고
    */

    inactivityWarningTimer =
        setTimeout(()=>{

            if(!game) return;

            inactiveWarning.classList.remove(
                "hidden"
            );

        },9 * 60 * 1000);


    /*
        10분 후 시작 화면
    */

    inactivityTimer =
        setTimeout(()=>{

            if(!game) return;

            stopGame();

        },10 * 60 * 1000);

}


function registerActivity(){

    if(!game) return;

    resetInactivityTimer();

}


[
    "pointerdown",
    "pointermove",
    "touchstart"
].forEach(event=>{

    window.addEventListener(
        event,
        ()=>{
            if(game){
                resetInactivityTimer();
            }
        },
        {
            passive:true
        }
    );

});


/* =========================================================
   SPECIAL E INTERACTION
========================================================= */

function handleSpecialInteraction(){

    if(!game) return;

    /*
        집 문
    */

    if(game.location === "farm"){

        if(isNearFarmHouseDoor()){

            enterHouse();

            return true;
        }

    }


    if(game.location === "house"){

        if(isNearHouseExit()){

            leaveHouse();

            return true;
        }

    }


    /*
        나무 베기
    */

    if(getNearbyTree()){
        chopTree();
        return true;
    }

    /*
        NPC 집
    */

    if(game.location === "town"){
        const homeOwner=getTownHomeAtPlayer();
        if(homeOwner){
            enterNPCHouse(homeOwner);
            return true;
        }
    }

    if(game.location === "npcHouse" && game.player.y >= 82 && game.player.x >= 38 && game.player.x <= 62){
        leaveNPCHouse();
        return true;
    }

    /*
        상점 NPC
    */

    const npc =
        getNearbyNPC();

    if(
        npc &&
        npc.npc.shop
    ){

        openShop();

        return true;
    }

    return false;

}


/*
    기존 E 상호작용을 확장
*/

const originalInteract =
    interactNearby;

interactNearby = function(){

    if(
        handleSpecialInteraction()
    ){
        return;
    }

    originalInteract();

};
