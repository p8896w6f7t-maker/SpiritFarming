<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>정령의 계절</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    image-rendering:pixelated;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    background:#17151d;

    font-family:
        "Courier New",
        monospace;

    color:#fff;

    touch-action:none;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =========================================================
   GAME ROOT
========================================================= */

#game{
    position:relative;

    width:100vw;
    height:100vh;

    min-height:600px;

    overflow:hidden;

    background:#17151d;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen{

    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(18,16,23,.45),
            rgba(18,16,23,.75)
        ),
        #465d49;
}

.start-box{

    width:min(500px,90vw);

    padding:42px 35px;

    text-align:center;

    background:#292531;

    border:6px solid #111018;

    box-shadow:
        inset 4px 4px 0 #51495e,
        inset -4px -4px 0 #18151e,
        0 15px 40px rgba(0,0,0,.35);
}

.start-icon{

    font-size:76px;

    margin-bottom:10px;
}

.start-title{

    margin:0;

    font-size:34px;

    letter-spacing:3px;

    color:#f0d7ff;
}

.start-subtitle{

    margin:10px 0 30px;

    color:#aaa1b8;

    font-size:12px;

    line-height:1.7;
}

.start-button{

    width:100%;

    padding:15px;

    margin-top:8px;

    color:white;

    background:#5d4b70;

    border:4px solid #17131d;

    box-shadow:
        inset 3px 3px 0 #8a71a0,
        inset -3px -3px 0 #35293f;

    font-size:14px;
}

.start-button:hover{

    background:#705986;
}

.start-button:active{

    transform:translateY(2px);
}

.start-warning{

    margin-top:20px;

    color:#8d8792;

    font-size:9px;

    line-height:1.5;
}


/* =========================================================
   SAVE SELECT
========================================================= */

#saveSelect{

    position:absolute;

    inset:0;

    z-index:950;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.8);
}

#saveSelect.open{

    display:flex;
}

.save-box{

    width:min(620px,92vw);

    max-height:85vh;

    overflow:auto;

    padding:24px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.save-title{

    margin-bottom:18px;

    font-size:20px;

    color:#e5c8f5;
}

.save-slot{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:10px;

    padding:14px;

    background:#332e3b;

    border:3px solid #17141c;
}

.save-info{

    flex:1;

    text-align:left;
}

.save-name{

    font-size:14px;

    font-weight:bold;

    margin-bottom:5px;
}

.save-detail{

    color:#aaa1b8;

    font-size:10px;

    line-height:1.5;
}

.save-buttons{

    display:flex;

    gap:5px;
}

.save-button{

    padding:8px 10px;

    color:#fff;

    background:#51445e;

    border:3px solid #17131b;

    font-size:10px;
}

.save-button.new{

    background:#5c4c6e;
}

.save-button.delete{

    background:#49343e;
}

.save-button:hover{

    filter:brightness(1.2);
}


/* =========================================================
   HUD
========================================================= */

#hud{

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:76px;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 18px;

    background:#25222e;

    border-bottom:4px solid #111018;

    box-shadow:
        inset 0 -2px 0 #40394c;
}

.hud-left{

    display:flex;

    align-items:center;

    gap:10px;
}

.day-box{

    min-width:120px;

    padding:7px 11px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.day-title{

    color:#aaa1b8;

    font-size:10px;

    margin-bottom:2px;
}

.day-number{

    font-size:17px;

    font-weight:bold;
}

.season{

    color:#e8b8ff;
}

.hud-stats{

    display:flex;

    gap:8px;
}

.stat{

    min-width:110px;

    padding:7px 10px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.stat-label{

    color:#aaa1b8;

    font-size:9px;
}

.stat-value{

    margin-top:2px;

    font-size:14px;

    font-weight:bold;
}

.money{

    color:#f3d46a;
}

.energy-bar{

    width:85px;

    height:8px;

    margin-top:3px;

    background:#16141a;

    border:2px solid #0d0c10;
}

.energy-fill{

    width:100%;

    height:100%;

    background:#e6a54e;
}


/* =========================================================
   MAIN
========================================================= */

#main{

    position:absolute;

    left:0;
    right:0;
    top:76px;
    bottom:0;

    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

#sidebar{

    width:185px;

    flex-shrink:0;

    padding:12px;

    background:#211e29;

    border-right:4px solid #111018;

    z-index:90;
}

.menu-title{

    margin:3px 4px 9px;

    color:#aaa1b8;

    font-size:11px;
}

.menu-button{

    width:100%;

    margin-bottom:7px;

    padding:11px 8px;

    color:white;

    text-align:left;

    background:#332f3d;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:11px;
}

.menu-button:hover{

    background:#423c4e;
}

.menu-button.active{

    background:#5b4b6d;

    border-color:#80699b;
}


/* =========================================================
   SCREEN
========================================================= */

#screen{

    position:relative;

    flex:1;

    min-width:0;

    overflow:hidden;

    background:#536b55;
}


/* =========================================================
   MAP
========================================================= */

.location{

    position:absolute;

    inset:0;

    display:none;

    overflow:hidden;
}

.location.active{

    display:block;
}


/* =========================================================
   FARM
========================================================= */

#farm{

    background:
        linear-gradient(
            #789a70 0 18%,
            #64845f 18% 100%
        );
}


/* =========================================================
   FARM PATH
========================================================= */

.farm-path-horizontal{

    position:absolute;

    left:0;
    right:0;

    top:65%;

    height:90px;

    background:#c6aa79;

    border-top:5px solid #9a8059;
    border-bottom:5px solid #9a8059;
}

.farm-path-right{

    position:absolute;

    right:0;

    top:55%;

    width:100px;

    height:110px;

    background:#c6aa79;

    border-top:5px solid #9a8059;
    border-bottom:5px solid #9a8059;
}


/* =========================================================
   HOUSE
========================================================= */

.house{

    position:absolute;

    left:7%;
    top:8%;

    width:210px;
    height:150px;

    background:#b47d61;

    border:6px solid #30221f;

    z-index:5;
}

.house-roof{

    position:absolute;

    left:-20px;
    top:-55px;

    width:240px;
    height:85px;

    background:#704e5a;

    border:6px solid #30221f;

    transform:skewX(-20deg);
}

.house-door{

    position:absolute;

    left:78px;
    bottom:0;

    width:48px;
    height:70px;

    background:#543b36;

    border:5px solid #30221f;
}

.house-window{

    position:absolute;

    top:35px;

    width:40px;
    height:40px;

    background:#9ed2d8;

    border:5px solid #30221f;
}

.house-window.left{

    left:20px;
}

.house-window.right{

    right:20px;
}


/* =========================================================
   FARM FIELD
========================================================= */

.field{

    position:absolute;

    left:35%;
    top:25%;

    display:grid;

    grid-template-columns:
        repeat(5,54px);

    grid-template-rows:
        repeat(4,54px);

    gap:4px;

    padding:8px;

    background:#513c30;

    border:5px solid #30241f;

    z-index:5;
}

.crop-tile{

    width:54px;
    height:54px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#795a3e;

    border:3px solid #4a3528;

    font-size:27px;

    cursor:pointer;
}

.crop-tile.watered{

    background:#566b72;
}

.crop-tile.ready{

    animation:pulse 1s infinite;
}

.crop-tile.empty::after{

    content:"+";

    color:#a47b59;

    font-size:18px;
}

@keyframes pulse{

    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.35);
    }
}


/* =========================================================
   POND
========================================================= */

.pond{

    position:absolute;

    right:9%;
    top:18%;

    width:170px;
    height:110px;

    border-radius:50%;

    background:#4b8da0;

    border:7px solid #304e56;

    box-shadow:
        inset 0 8px 0 #71b4c2;

    z-index:5;
}


/* =========================================================
   TREES
========================================================= */

.tree{

    position:absolute;

    font-size:70px;

    pointer-events:none;

    z-index:4;
}

.tree.t1{

    left:8%;
    bottom:8%;
}

.tree.t2{

    right:25%;
    bottom:7%;
}

.tree.t3{

    right:5%;
    bottom:28%;
}


/* =========================================================
   TOWN
========================================================= */

#town{

    background:
        linear-gradient(
            #9a907d 0 30%,
            #857b6a 30% 100%
        );
}

.town-road{

    position:absolute;

    left:0;
    right:0;

    top:52%;

    height:110px;

    background:#c5a878;

    border-top:5px solid #8d7551;
    border-bottom:5px solid #8d7551;
}

.town-road-up{

    position:absolute;

    left:50%;

    top:0;

    width:100px;
    height:60%;

    transform:translateX(-50%);

    background:#c5a878;

    border-left:5px solid #8d7551;
    border-right:5px solid #8d7551;
}

.shop{

    position:absolute;

    width:180px;
    height:150px;

    background:#b47765;

    border:6px solid #4a302d;

    z-index:5;
}

.shop.one{

    left:10%;
    top:18%;
}

.shop.two{

    right:10%;
    top:18%;
}

.shop-roof{

    position:absolute;

    left:-8px;
    top:-42px;

    width:184px;
    height:55px;

    background:#704b57;

    border:6px solid #4a302d;
}

.shop-door{

    position:absolute;

    left:67px;
    bottom:0;

    width:45px;
    height:70px;

    background:#563d37;

    border:5px solid #4a302d;
}

.town-npc{

    position:absolute;

    font-size:40px;

    z-index:20;

    pointer-events:none;
}

.npc-a{

    left:40%;
    top:45%;
}

.npc-b{

    right:30%;
    top:65%;
}


/* =========================================================
   FOREST
========================================================= */

#forest{

    background:
        linear-gradient(
            #456149 0 30%,
            #334c38 30% 100%
        );
}

.forest-ground{

    position:absolute;

    inset:30% 0 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            #526e48 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 70% 40%,
            #526e48 0 4px,
            transparent 5px
        );
}

.forest-tree{

    position:absolute;

    font-size:82px;

    pointer-events:none;

    z-index:5;
}

.forest-tree:nth-child(1){

    left:7%;
    top:12%;
}

.forest-tree:nth-child(2){

    left:27%;
    top:7%;
}

.forest-tree:nth-child(3){

    right:25%;
    top:12%;
}

.forest-tree:nth-child(4){

    right:5%;
    top:8%;
}

.forest-center{

    position:absolute;

    left:50%;
    top:48%;

    width:190px;
    height:190px;

    transform:
        translate(-50%,-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#25352a;

    border:6px solid #18231c;

    font-size:90px;

    box-shadow:
        0 0 30px rgba(185,150,255,.18);

    z-index:8;
}


/* =========================================================
   PLAYER
========================================================= */

.player{

    position:absolute;

    width:46px;
    height:58px;

    z-index:80;

    transform:
        translate(-50%,-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    user-select:none;

    pointer-events:none;

    transition:
        left .04s linear,
        top .04s linear;
}

.player-sprite{

    font-size:38px;

    line-height:1;

    transition:
        transform .05s linear;
}

.player.flip .player-sprite{

    transform:scaleX(-1);
}

.player-name{

    position:absolute;

    top:-21px;
    left:50%;

    transform:translateX(-50%);

    padding:2px 5px;

    background:#27232e;

    border:2px solid #111018;

    color:white;

    font-size:8px;

    white-space:nowrap;
}


/* =========================================================
   PLAYER SHADOW
========================================================= */

.player-shadow{

    position:absolute;

    left:50%;
    bottom:-3px;

    width:28px;
    height:7px;

    transform:translateX(-50%);

    background:#2c2630;

    border-radius:50%;

    z-index:-1;
}


/* =========================================================
   LOCATION NAME
========================================================= */

.location-name{

    position:absolute;

    left:22px;
    top:18px;

    padding:7px 12px;

    background:rgba(37,34,46,.85);

    border:3px solid #111018;

    color:#e6d5ee;

    font-size:11px;

    z-index:25;
}


/* =========================================================
   INFO
========================================================= */

#info{

    position:absolute;

    right:15px;
    bottom:88px;

    width:220px;

    padding:12px;

    background:#25222e;

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e;

    z-index:85;
}

.info-title{

    color:#dcbfff;

    margin-bottom:7px;

    font-size:13px;
}

.info-text{

    color:#c5bdca;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   ACTION BAR
========================================================= */

#actionbar{

    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    display:flex;

    gap:6px;

    padding:7px;

    background:#25222e;

    border:4px solid #111018;

    z-index:90;
}

.action{

    width:90px;
    height:42px;

    background:#383342;

    border:3px solid #14121a;

    color:white;

    font-size:10px;
}

.action:hover{

    background:#51485d;
}


/* =========================================================
   MOBILE CONTROLLER
========================================================= */

#mobileControls{

    position:absolute;

    left:15px;
    bottom:20px;

    width:150px;
    height:150px;

    z-index:100;

    display:none;
}

.control{

    position:absolute;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:rgba(37,34,46,.9);

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:20px;

    touch-action:none;

    user-select:none;
}

.control:active{

    background:#655172;

    transform:scale(.93);
}

.control.up{

    left:50px;
    top:0;
}

.control.left{

    left:0;
    top:50px;
}

.control.down{

    left:50px;
    top:50px;
}

.control.right{

    left:100px;
    top:50px;
}


/* =========================================================
   PANEL
========================================================= */

#panel{

    position:absolute;

    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.72);
}

#panel.open{

    display:flex;
}

.panel-box{

    width:min(600px,90vw);

    max-height:82vh;

    overflow:auto;

    padding:22px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.panel-close{

    float:right;

    padding:5px 10px;

    color:white;

    background:#4b3948;

    border:3px solid #17131b;
}

.panel-title{

    margin-bottom:18px;

    font-size:20px;

    color:#e5c8f5;
}


/* =========================================================
   PANEL CARDS
========================================================= */

.card{

    padding:13px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.card-title{

    font-size:13px;

    font-weight:bold;

    margin-bottom:8px;
}

.card-text{

    color:#aaa1b8;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   STATS
========================================================= */

.stat-row{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    gap:10px;
}

.stat-name{

    width:70px;

    font-size:10px;
}

.stat-track{

    flex:1;

    height:10px;

    background:#16141a;

    border:2px solid #0d0c10;
}

.stat-track-fill{

    height:100%;

    background:#8b6ca2;
}

.stat-number{

    width:35px;

    text-align:right;

    font-size:10px;
}


/* =========================================================
   MAP PANEL
========================================================= */

.map-container{

    position:relative;

    height:300px;

    background:#536b55;

    border:4px solid #17141c;

    overflow:hidden;
}

.map-area{

    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#756a58;

    border:4px solid #332b25;

    color:white;

    font-size:11px;

    font-weight:bold;
}

.map-farm{

    left:8%;
    bottom:15%;

    width:32%;
    height:42%;

    background:#6e8d62;
}

.map-town{

    left:39%;
    top:27%;

    width:27%;
    height:40%;

    background:#968873;
}

.map-forest{

    right:7%;
    top:10%;

    width:30%;
    height:43%;

    background:#3d5c43;
}

.map-road1{

    position:absolute;

    left:32%;
    bottom:32%;

    width:16%;
    height:35px;

    background:#c3a875;
}

.map-road2{

    position:absolute;

    left:51%;
    top:17%;

    width:35px;
    height:30%;

    background:#c3a875;
}

.map-player{

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#f0c57c;

    border:3px solid #352b2b;

}


/* =========================================================
   INVENTORY
========================================================= */

.inventory-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.inventory-item{

    min-height:90px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#332e3b;

    border:3px solid #17141c;

    font-size:28px;
}

.inventory-count{

    margin-top:6px;

    font-size:10px;

    color:#c5bdca;
}


/* =========================================================
   SPIRIT
========================================================= */

.spirit-card{

    display:flex;

    align-items:center;

    gap:15px;

    padding:12px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.spirit-icon{

    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#24202b;

    border:3px solid #51495e;

    font-size:42px;
}

.spirit-name{

    margin-bottom:4px;

    font-size:13px;

    font-weight:bold;
}

.hearts{

    color:#e4a6ff;

    letter-spacing:2px;

    font-size:12px;
}

.contract-button{

    margin-top:7px;

    padding:7px 10px;

    color:white;

    background:#59456a;

    border:3px solid #18141e;

    font-size:10px;
}

.contract-button:disabled{

    opacity:.4;
}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:absolute;

    left:50%;
    top:18px;

    transform:
        translate(-50%,-20px);

    padding:10px 18px;

    background:#292531;

    border:4px solid #111018;

    font-size:11px;

    opacity:0;

    pointer-events:none;

<script>

/* =========================================================
   GAME DATA
========================================================= */

const game = {

    started:false,

    saveSlot:1,

    day:1,

    season:"봄",

    time:360,

    energy:100,

    maxEnergy:100,

    money:500,

    location:"farm",

    selectedCrop:0,

    inventory:{

        seed:5,

        crop:0

    },

    crops:[],

    player:{

        x:50,

        y:75,

        speed:0.75,

        direction:"down"

    },

    locations:{

        farm:{
            x:50,
            y:75
        },

        town:{
            x:50,
            y:70
        },

        forest:{
            x:50,
            y:78
        }

    },

    stats:{

        level:1,

        exp:0,

        farming:1,

        fishing:1,

        gathering:1,

        strength:1,

        luck:1

    },

    spirits:{

        earth:{

            name:"대지의 정령",

            icon:"🌱",

            affection:0,

            contracted:false,

            power:
                "땅을 빠르게 개간할 수 있다."

        },

        water:{

            name:"물의 정령",

            icon:"💧",

            affection:0,

            contracted:false,

            power:
                "물을 주면 주변 밭까지 함께 적신다."

        },

        forest:{

            name:"숲의 정령",

            icon:"🌲",

            affection:0,

            contracted:false,

            power:
                "채집물의 발견 확률이 증가한다."

        }

    }

};


/* =========================================================
   FARM CREATION
========================================================= */

function createFarm(){

    const field =
        document.getElementById("field");

    field.innerHTML="";

    if(
        !game.crops ||
        game.crops.length!==20
    ){

        game.crops=[];

        for(let i=0;i<20;i++){

            game.crops.push({

                planted:false,

                watered:false,

                grown:false

            });

        }

    }


    for(let i=0;i<20;i++){

        const tile =
            document.createElement("div");

        tile.className=
            "crop-tile empty";

        tile.dataset.index=i;

        tile.onclick=()=>{

            game.selectedCrop=i;

            selectCrop(i);

        };

        field.appendChild(tile);

    }

    updateCrops();

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("day")
        .textContent=
        game.day;


    document
        .getElementById("time")
        .textContent=
        formatTime(game.time);


    document
        .getElementById("energy")
        .textContent=
        game.energy;


    document
        .getElementById("money")
        .textContent=
        game.money;


    document
        .getElementById("energyFill")
        .style.width=
        (
            game.energy/
            game.maxEnergy*
            100
        )+"%";


    document
        .getElementById("locationLabel")
        .textContent=
        locationName(game.location);

}


function locationName(location){

    if(location==="farm")
        return "농장";

    if(location==="town")
        return "마을";

    if(location==="forest")
        return "숲";

    return "";

}


/* =========================================================
   TIME
========================================================= */

function formatTime(minutes){

    let h=
        Math.floor(minutes/60);

    let m=
        minutes%60;


    if(h>23){

        h=23;

        m=59;

    }


    return String(h)
        .padStart(2,"0")
        +
        ":"
        +
        String(m)
        .padStart(2,"0");

}


function addTime(minutes){

    game.time+=minutes;

    if(game.time>=1440){

        game.time=1440;

        showToast(
            "오늘은 너무 늦었다."
        );

    }

    updateHUD();

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

    const player =
        document.getElementById("player");


    player.style.left =
        game.player.x+"%";


    player.style.top =
        game.player.y+"%";


    if(
        game.player.direction==="left"
    ){

        player.classList.add("flip");

    }

    else if(
        game.player.direction==="right"
    ){

        player.classList.remove("flip");

    }

}


/* =========================================================
   KEY INPUT
========================================================= */

const keys={};


document.addEventListener(
    "keydown",
    event=>{

        registerActivity();


        const movementKeys=[

            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",

            "w",
            "a",
            "s",
            "d",

            "W",
            "A",
            "S",
            "D"

        ];


        if(
            movementKeys.includes(
                event.key
            )
        ){

            event.preventDefault();

            keys[event.key]=true;

        }


        if(event.key==="Escape"){

            closePanel();

        }

    }
);


document.addEventListener(
    "keyup",
    event=>{

        keys[event.key]=false;

    }
);


/* =========================================================
   MOBILE CONTROL
========================================================= */

document
    .querySelectorAll(".control")
    .forEach(button=>{

        const key=
            button.dataset.key;


        button.addEventListener(
            "touchstart",
            event=>{

                event.preventDefault();

                registerActivity();

                keys[key]=true;

            },
            {
                passive:false
            }
        );


        button.addEventListener(
            "touchend",
            event=>{

                event.preventDefault();

                keys[key]=false;

            },
            {
                passive:false
            }
        );


        button.addEventListener(
            "touchcancel",
            ()=>{

                keys[key]=false;

            }
        );


        button.addEventListener(
            "mousedown",
            ()=>{

                registerActivity();

                keys[key]=true;

            }
        );


        button.addEventListener(
            "mouseup",
            ()=>{

                keys[key]=false;

            }
        );


        button.addEventListener(
            "mouseleave",
            ()=>{

                keys[key]=false;

            }
        );

    });


/* =========================================================
   MOVEMENT LOOP
========================================================= */

let lastFrame=0;


function gameLoop(timestamp){

    if(
        game.started &&
        timestamp-lastFrame>16
    ){

        movePlayer();

        lastFrame=timestamp;

    }


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(){

    if(!game.started)
        return;


    if(
        document
            .getElementById("panel")
            .classList.contains("open")
    ){

        return;

    }


    let dx=0;
    let dy=0;


    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx-=1;

        game.player.direction=
            "left";

    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx+=1;

        game.player.direction=
            "right";

    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dy-=1;

        game.player.direction=
            "up";

    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dy+=1;

        game.player.direction=
            "down";

    }


    if(
        dx===0 &&
        dy===0
    ){

        return;

    }


    if(
        dx!==0 &&
        dy!==0
    ){

        dx*=0.707;

        dy*=0.707;

    }


    const nextX =
        game.player.x +
        dx *
        game.player.speed;


    const nextY =
        game.player.y +
        dy *
        game.player.speed;


    if(
        canMoveTo(
            nextX,
            nextY
        )
    ){

        game.player.x=nextX;

        game.player.y=nextY;

    }


    updatePlayer();


    checkExit();


}


/* =========================================================
   COLLISION
========================================================= */

function canMoveTo(x,y){

    const margin=3;


    if(
        x<margin ||
        x>100-margin ||
        y<margin ||
        y>100-margin
    ){

        return false;

    }


    /*
       농장 충돌
    */

    if(game.location==="farm"){

        /*
           집
        */

        if(
            rectCollision(
                x,
                y,
                7,
                8,
                210,
                150
            )
        ){

            return false;

        }


        /*
           밭
        */

        if(
            rectCollision(
                x,
                y,
                34,
                25,
                28,
                27
            )
        ){

            return false;

        }


        /*
           연못
        */

        if(
            ellipseCollision(
                x,
                y,
                91,
                18,
                18,
                13
            )
        ){

            return false;

        }

    }


    /*
       마을 충돌
    */

    if(game.location==="town"){

        if(
            rectCollision(
                x,
                y,
                10,
                18,
                23,
                25
            )
        ){

            return false;

        }


        if(
            rectCollision(
                x,
                y,
                68,
                18,
                23,
                25
            )
        ){

            return false;

        }

    }


    /*
       숲 충돌
    */

    if(game.location==="forest"){

        if(
            ellipseCollision(
                x,
                y,
                50,
                48,
                14,
                14
            )
        ){

            /*
               정령 중심부는 통과하지 못하게
            */

            return false;

        }

    }


    return true;

}


function rectCollision(
    x,
    y,
    left,
    top,
    width,
    height
){

    const px=
        x;

    const py=
        y;


    const rx=
        left;

    const ry=
        top;


    const rw=
        width/3.6;

    const rh=
        height/3.6;


    return(
        px>rx &&
        px<rx+rw &&
        py>ry &&
        py<ry+rh
    );

}


function ellipseCollision(
    x,
    y,
    cx,
    cy,
    rx,
    ry
){

    const dx=
        (x-cx)/rx;

    const dy=
        (y-cy)/ry;


    return(
        dx*dx+
        dy*dy<1
    );

}


/* =========================================================
   EXIT SYSTEM
========================================================= */

function checkExit(){

    /*
       농장 오른쪽 출구
       → 마을
    */

    if(
        game.location==="farm" &&
        game.player.x>96 &&
        game.player.y>53 &&
        game.player.y<82
    ){

        changeLocation(
            "town",
            "left"
        );

        return;

    }


    /*
       마을 왼쪽 출구
       → 농장
    */

    if(
        game.location==="town" &&
        game.player.x<4 &&
        game.player.y>53 &&
        game.player.y<82
    ){

        changeLocation(
            "farm",
            "right"
        );

        return;

    }


    /*
       마을 위쪽 출구
       → 숲
    */

    if(
        game.location==="town" &&
        game.player.y<4 &&
        game.player.x>42 &&
        game.player.x<58
    ){

        changeLocation(
            "forest",
            "bottom"
        );

        return;

    }


    /*
       숲 아래쪽 출구
       → 마을
    */

    if(
        game.location==="forest" &&
        game.player.y>96 &&
        game.player.x>42 &&
        game.player.x<58
    ){

        changeLocation(
            "town",
            "top"
        );

    }

}


/* =========================================================
   LOCATION CHANGE
========================================================= */

function changeLocation(
    location,
    entrance
){

    game.location=
        location;


    /*
       출입구 위치
    */

    if(location==="town"){

        if(entrance==="left"){

            game.player.x=7;
            game.player.y=67;

        }

        if(entrance==="top"){

            game.player.x=50;
            game.player.y=7;

        }

    }


    if(location==="farm"){

        if(entrance==="right"){

            game.player.x=93;
            game.player.y=67;

        }

    }


    if(location==="forest"){

        if(entrance==="bottom"){

            game.player.x=50;
            game.player.y=90;

        }

    }


    document
        .querySelectorAll(".location")
        .forEach(
            element=>{
                element.classList.remove(
                    "active"
                );
            }
        );


    document
        .getElementById(location)
        .classList.add("active");


    updatePlayer();

    updateHUD();


    updateInfo(
        locationMessage(
            location
        )
    );

}


function locationMessage(location){

    if(location==="farm"){

        return(
            "작은 농장이다.<br>" +
            "밭을 관리하고 작물을 키워보자."
        );

    }


    if(location==="town"){

        return(
            "작은 마을이다.<br>" +
            "주민들과 이야기를 나눠보자."
        );

    }


    if(location==="forest"){

        return(
            "오래된 숲이다.<br>" +
            "숲 깊은 곳에서 정령의 기척이 느껴진다."
        );

    }

    return "";

}


/* =========================================================
   CROP SELECT
========================================================= */

function selectCrop(index){

    game.selectedCrop=index;

    const crop=
        game.crops[index];


    if(!crop.planted){

        updateInfo(
            "빈 밭이다.<br>" +
            "씨앗을 심을 수 있다."
        );

    }

    else if(crop.grown){

        updateInfo(
            "작물이 다 자랐다.<br>" +
            "수확할 수 있다."
        );

    }

    else if(crop.watered){

        updateInfo(
            "오늘 물을 줬다.<br>" +
            "잘 자라고 있다."
        );

    }

    else{

        updateInfo(
            "작물이 말라 있다.<br>" +
            "물을 줘야 한다."
        );

    }

}


/* =========================================================
   PLANT
========================================================= */

function plantCrop(){

    registerActivity();


    if(game.location!=="farm"){

        showToast(
            "농장에서만 씨앗을 심을 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(crop.planted){

        showToast(
            "이미 무언가 심겨 있다."
        );

        return;

    }


    if(game.inventory.seed<=0){

        showToast(
            "씨앗이 없다."
        );

        return;

    }


    if(game.energy<5){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.inventory.seed--;

    game.energy-=5;

    crop.planted=true;

    crop.watered=false;

    crop.grown=false;


    game.stats.farming++;


    addTime(10);

    updateCrops();

    showToast(
        "씨앗을 심었다."
    );

}


/* =========================================================
   WATER
========================================================= */

function waterCrop(){

    registerActivity();


    if(game.location!=="farm"){

        showToast(
            "농장에서만 물을 줄 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(!crop.planted){

        showToast(
            "심어진 작물이 없다."
        );

        return;

    }


    if(crop.grown){

        showToast(
            "이미 다 자랐다."
        );

        return;

    }


    if(crop.watered){

        showToast(
            "오늘은 이미 물을 줬다."
        );

        return;

    }


    if(game.energy<3){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.energy-=3;

    crop.watered=true;


    /*
       물의 정령 계약
    */

    if(
        game.spirits.water.contracted
    ){

        const index=
            game.selectedCrop;

        const nearby=[
            index-1,
            index+1,
            index-5,
            index+5
        ];


        nearby.forEach(
            i=>{

                if(
                    game.crops[i]
                ){

                    game.crops[i]
                        .watered=true;

                }

            }
        );

    }


    addTime(5);

    updateCrops();

    showToast(
        "물을 줬다."
    );

}


/* =========================================================
   HARVEST
========================================================= */

function harvestCrop(){

    registerActivity();


    if(game.location!=="farm"){

        showToast(
            "농장에서만 수확할 수 있다."
        );

        return;

    }


    const crop=
        game.crops[
            game.selectedCrop
        ];


    if(!crop.grown){

        showToast(
            "아직 다 자라지 않았다."
        );

        return;

    }


    crop.planted=false;

    crop.watered=false;

    crop.grown=false;


    game.inventory.crop++;

    game.money+=80;


    game.stats.exp+=10;


    checkLevel();


    addTime(10);

    updateCrops();

    updateHUD();


    showToast(
        "작물을 수확했다! +₩80"
    );

}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel(){

    const need=
        game.stats.level*100;


    if(
        game.stats.exp>=need
    ){

        game.stats.exp-=need;

        game.stats.level++;

        game.maxEnergy+=5;

        game.energy=
            game.maxEnergy;


        showToast(
            "레벨 업! Lv."+game.stats.level
        );

    }

}


/* =========================================================
   REST
========================================================= */

function rest(){

    registerActivity();


    if(
        game.energy>=
        game.maxEnergy
    ){

        showToast(
            "이미 체력이 충분하다."
        );

        return;

    }


    game.energy=
        Math.min(
            game.maxEnergy,
            game.energy+25
        );


    addTime(60);


    showToast(
        "잠시 쉬었다."
    );

}


/* =========================================================
   END DAY
========================================================= */

function endDay(){

    registerActivity();


    if(
        !confirm(
            "오늘 하루를 끝내고 잠자리에 들까요?"
        )
    ){

        return;

    }


    game.day++;

    game.time=360;

    game.energy=
        game.maxEnergy;


    game.crops.forEach(
        crop=>{

            if(
                crop.planted &&
                crop.watered
            ){

                crop.grown=true;

            }

            crop.watered=false;

        }
    );


    updateCrops();

    updateHUD();

    saveCurrentGame(false);


    showToast(
        game.day+
        "일째 아침이 되었다."
    );

}


/* =========================================================
   CROP DISPLAY
========================================================= */

function updateCrops(){

    const tiles=
        document.querySelectorAll(
            ".crop-tile"
        );


    tiles.forEach(
        (tile,i)=>{

            const crop=
                game.crops[i];


            tile.className=
                "crop-tile";


            if(!crop.planted){

                tile.classList.add(
                    "empty"
                );

                tile.textContent="";

                return;

            }


            if(crop.grown){

                tile.classList.add(
                    "ready"
                );

                tile.textContent=
                    "🥕";

            }

            else{

                tile.textContent=
                    "🌱";

            }


            if(crop.watered){

                tile.classList.add(
                    "watered"
                );

            }

        }
    );

}

function createStatRow(
    name,
    value
){

    const width=
        Math.min(
            100,
            value*10
        );


    return `

        <div class="stat-row">

            <div class="stat-name">
                ${name}
            </div>

            <div class="stat-track">

                <div
                    class="stat-track-fill"
                    style="
                    width:${width}%;
                    ">
                </div>

            </div>

            <div class="stat-number">
                ${value}
            </div>

        </div>

    `;

}


function getContracts(){

    const contracts=[];


    Object.values(
        game.spirits
    )
    .forEach(
        spirit=>{

            if(
                spirit.contracted
            ){

                contracts.push(
                    spirit.name
                );

            }

        }
    );


    return contracts.join(
        "<br>"
    );

}

        document.getElementById(
            "toast"

/* =========================================================
   SAVE SYSTEM
   3 SLOTS
========================================================= */

function saveKey(slot){

    return(
        "spiritSeasonSave_"+slot
    );

}


function saveCurrentGame(
    showMessage=true
){

    if(!game.started)
        return;


    const saveData=
        JSON.stringify(game);


    localStorage.setItem(
        saveKey(
            game.saveSlot
        ),
        saveData
    );


    if(showMessage){

        showToast(
            "슬롯 "+
            game.saveSlot+
            "에 저장했다."
        );

    }

}


/* =========================================================
   LOAD SAVE
========================================================= */

function loadSave(slot){

    const data=
        localStorage.getItem(
            saveKey(slot)
        );


    if(!data){

        startNewGame(slot);

        return;

    }


    try{

        const parsed=
            JSON.parse(data);


        Object.assign(
            game,
            parsed
        );


        game.saveSlot=slot;

        game.started=true;


        hideStartScreen();

        createFarm();

        updateHUD();

        updatePlayer();

        changeLocation(
            game.location,
            null
        );


        resetInactivityTimer();


        showToast(
            "슬롯 "+
            slot+
            "을 불러왔다."
        );

    }

    catch(error){

        console.error(error);

        showToast(
            "저장 데이터를 읽을 수 없다."
        );

    }

}

   SAVE SELECT UI

function openSaveSelect(){

            "saveSelect"
        )
        .classList.add(
            "open"
        );

}

    document
        .getElementById(

        )
        .classList.remove(
            "open"
        );

}


function renderSaveSlots(){

    const container=
        document.getElementById(
            "saveSlots"
        );


    container.innerHTML="";


    for(
        let slot=1;
        slot<=3;
        slot++
    ){

        const raw=
            localStorage.getItem(
                saveKey(slot)
            );


        let html="";


        if(raw){

            try{

                const data=
                    JSON.parse(raw);


                html=`

                    <div class="save-slot">

                        <div class="save-info">

                            <div class="save-name">

                                슬롯 ${slot}

                            </div>

                            <div class="save-detail">

                                ${data.day}일차
                                ${data.season}
                                ·
                                ${locationName(data.location)}
                                <br>

                                ₩${data.money}
                                ·
                                Lv.${data.stats.level}

                            </div>

                        </div>


                        <div class="save-buttons">

                            <button
                                class="save-button"
                                onclick="
                                loadSave(${slot})
                                ">

                                불러오기

                            </button>


                            <button
                                class="save-button delete"
                                onclick="
                                deleteSave(${slot})
                                ">

                                삭제

                            </button>

                        </div>

                    </div>

                `;

            }

            catch(error){

                html=`

                    <div class="save-slot">

                        <div class="save-info">

                            <div class="save-name">
                                슬롯 ${slot}
                            </div>

                            <div class="save-detail">
                                저장 데이터 오류
                            </div>

                        </div>

                        <button
                            class="save-button delete"
                            onclick="
                            deleteSave(${slot})
                            ">

                            삭제

                        </button>

                    </div>

                `;

            }

        }

        else{

            html=`

                <div class="save-slot">

                    <div class="save-info">

                        <div class="save-name">

                            슬롯 ${slot}

                        </div>

                        <div class="save-detail">

                            비어 있음

                        </div>

                    </div>


                    <button
                        class="save-button new"
                        onclick="
                        startNewGame(${slot})
                        ">

                        새 게임

                    </button>

                </div>

            `;

        }


        container.innerHTML+=html;

    }

}


/* =========================================================
   DELETE SAVE
========================================================= */

function deleteSave(slot){

    if(
        !confirm(
            "슬롯 "+
            slot+
            "의 저장 데이터를 삭제할까요?"
        )
    ){

        return;

    }


    localStorage.removeItem(

    );


    renderSaveSlots();


    showToast(

    );

}

function showStartScreen(){

    game.started=false;


    Object.keys(keys)
        .forEach(
            key=>{
                keys[key]=false;
            }
        );


    closePanel();


    document
        .getElementById(
            "startScreen"
        )
        .style.display=
            "flex";


    document
        .getElementById(
            "saveSelect"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   INACTIVITY SYSTEM
   10 MINUTES
========================================================= */

const INACTIVE_LIMIT=
    10*60*1000;


let inactivityTimer;

let warningTimer;


function resetInactivityTimer(){

    if(!game.started)
        return;


    clearTimeout(
        inactivityTimer
    );

    clearTimeout(
        warningTimer
    );


    document
        .getElementById(
            "inactiveWarning"
        )
        .classList.remove(
            "show"
        );


    /*
       9분 30초에 경고
    */

    warningTimer=
        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "inactiveWarning"
                    )
                    .classList.add(
                        "show"
                    );

            },
            9.5*60*1000
        );


    /*
       10분 후 시작 화면
    */

    inactivityTimer=
        setTimeout(
            ()=>{

                showStartScreen();


                showToast(
                    "오랫동안 움직임이 없어 게임을 종료했다."
                );

            },
            INACTIVE_LIMIT
        );

}


function registerActivity(){

    if(!game.started)
        return;


    resetInactivityTimer();

}


/* =========================================================
   GLOBAL ACTIVITY
========================================================= */

[
    "mousedown",
    "touchstart",
    "pointerdown"
]
.forEach(
    eventName=>{

        document.addEventListener(
            eventName,
            ()=>{

                registerActivity();

            },
            {
                passive:true
            }
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

createFarm();

updateHUD();

updatePlayer();


/*
   처음 웹에 들어오면
   무조건 시작 화면부터.
*/

showStartScreen();


</script>
