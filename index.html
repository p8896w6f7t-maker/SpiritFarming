<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>정령의 계절</title>

<style>

/* =========================================================
   기본 설정
========================================================= */

*{
    box-sizing:border-box;
    image-rendering:pixelated;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#17151d;
    color:#fff;

    font-family:
        "Courier New",
        monospace;

    touch-action:none;
}

button{
    font-family:inherit;
}


/* =========================================================
   게임 전체
========================================================= */

#game{
    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#17151d;
}


/* =========================================================
   시작 화면
========================================================= */

#startScreen{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(20,18,27,.45),
            rgba(20,18,27,.75)
        ),
        #536b55;
}

.startBox{
    width:min(480px,90vw);

    padding:40px 32px;

    text-align:center;

    background:#292531;

    border:6px solid #111018;

    box-shadow:
        inset 4px 4px 0 #51495e,
        inset -4px -4px 0 #17141c,
        0 20px 50px rgba(0,0,0,.4);
}

.startIcon{
    font-size:72px;

    margin-bottom:8px;
}

.startTitle{
    margin:0;

    color:#ead6f5;

    font-size:32px;

    letter-spacing:3px;
}

.startSub{
    margin:12px 0 28px;

    color:#aaa1b8;

    font-size:11px;

    line-height:1.8;
}

.startButton{
    width:100%;

    padding:16px;

    color:white;

    background:#5d4b70;

    border:4px solid #15121a;

    box-shadow:
        inset 3px 3px 0 #8a71a0,
        inset -3px -3px 0 #35293f;

    font-size:14px;

    cursor:pointer;
}

.startButton:hover{
    background:#705986;
}

.startButton:active{
    transform:translateY(2px);
}

.startNote{
    margin-top:18px;

    color:#77717e;

    font-size:9px;

    line-height:1.6;
}


/* =========================================================
   저장 슬롯 화면
========================================================= */

#saveScreen{
    position:absolute;

    inset:0;

    z-index:1100;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.82);
}

#saveScreen.open{
    display:flex;
}

.saveBox{
    width:min(620px,92vw);

    max-height:85vh;

    overflow:auto;

    padding:24px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.saveTitle{
    margin-bottom:18px;

    color:#e5c8f5;

    font-size:20px;
}

.saveSlot{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:14px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.saveInfo{
    flex:1;
}

.saveName{
    margin-bottom:5px;

    font-size:13px;
    font-weight:bold;
}

.saveDetail{
    color:#aaa1b8;

    font-size:9px;

    line-height:1.6;
}

.saveButtons{
    display:flex;

    gap:5px;
}

.saveButton{
    padding:8px 11px;

    color:white;

    background:#51445e;

    border:3px solid #17131b;

    font-size:9px;

    cursor:pointer;
}

.saveButton:hover{
    background:#6a5875;
}

.saveButton.new{
    background:#5d4b70;
}

.saveButton.delete{
    background:#49343e;
}

.backButton{
    margin-top:5px;

    padding:9px 15px;

    color:white;

    background:#403a47;

    border:3px solid #17131b;

    cursor:pointer;

    font-size:10px;
}


/* =========================================================
   HUD
========================================================= */

#hud{
    position:absolute;

    left:0;
    right:0;
    top:0;

    height:76px;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:9px 18px;

    background:#25222e;

    border-bottom:4px solid #111018;

    box-shadow:
        inset 0 -2px 0 #40394c;
}

.hudLeft{
    display:flex;

    gap:10px;
}

.dayBox{
    min-width:120px;

    padding:7px 11px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.hudLabel{
    color:#aaa1b8;

    font-size:9px;
}

.hudValue{
    margin-top:2px;

    font-size:16px;
    font-weight:bold;
}

.spring{
    color:#e8b8ff;
}

.hudRight{
    display:flex;

    gap:8px;
}

.statBox{
    min-width:110px;

    padding:7px 10px;

    background:#302c3b;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;
}

.energyBar{
    width:85px;
    height:8px;

    margin-top:3px;

    background:#151319;

    border:2px solid #0c0b0f;
}

.energyFill{
    width:100%;
    height:100%;

    background:#e6a54e;
}

.money{
    color:#f3d46a;
}


/* =========================================================
   메인
========================================================= */

#main{
    position:absolute;

    left:0;
    right:0;
    top:76px;
    bottom:0;

    display:flex;
}


/* =========================================================
   사이드 메뉴
========================================================= */

#sidebar{
    width:185px;

    flex-shrink:0;

    padding:12px;

    background:#211e29;

    border-right:4px solid #111018;

    z-index:90;
}

.menuTitle{
    margin:4px;

    color:#aaa1b8;

    font-size:11px;
}

.menuButton{
    width:100%;

    padding:11px 8px;

    margin-bottom:7px;

    color:white;

    text-align:left;

    background:#332f3d;

    border:3px solid #14121a;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    cursor:pointer;

    font-size:10px;
}

.menuButton:hover{
    background:#453d50;
}


/* =========================================================
   게임 화면
========================================================= */

#screen{
    position:relative;

    flex:1;

    min-width:0;

    overflow:hidden;

    background:#536b55;
}


/* =========================================================
   지역
========================================================= */

.location{
    position:absolute;

    inset:0;

    display:none;

    overflow:hidden;
}

.location.active{
    display:block;
}


/* =========================================================
   농장
========================================================= */

#farm{
    background:
        linear-gradient(
            #789a70 0 18%,
            #64845f 18% 100%
        );
}

.locationName{
    position:absolute;

    left:18px;
    top:16px;

    padding:7px 12px;

    background:rgba(37,34,46,.86);

    border:3px solid #111018;

    color:#ead8f2;

    font-size:11px;

    z-index:30;
}

.farmPath{
    position:absolute;

    left:0;
    right:0;

    top:64%;

    height:100px;

    background:#c5a878;

    border-top:5px solid #9b8058;
    border-bottom:5px solid #9b8058;
}

.farmExit{
    position:absolute;

    right:0;
    top:54%;

    width:90px;
    height:120px;

    background:#c5a878;

    border-top:5px solid #9b8058;
    border-bottom:5px solid #9b8058;
}

.house{
    position:absolute;

    left:7%;
    top:9%;

    width:210px;
    height:150px;

    background:#b47d61;

    border:6px solid #30221f;

    z-index:10;
}

.houseRoof{
    position:absolute;

    left:-20px;
    top:-55px;

    width:240px;
    height:85px;

    background:#704e5a;

    border:6px solid #30221f;

    transform:skewX(-20deg);
}

.houseDoor{
    position:absolute;

    left:78px;
    bottom:0;

    width:48px;
    height:70px;

    background:#543b36;

    border:5px solid #30221f;
}

.houseWindow{
    position:absolute;

    top:35px;

    width:40px;
    height:40px;

    background:#9ed2d8;

    border:5px solid #30221f;
}

.houseWindow.left{
    left:20px;
}

.houseWindow.right{
    right:20px;
}

.field{
    position:absolute;

    left:35%;
    top:25%;

    display:grid;

    grid-template-columns:repeat(5,54px);
    grid-template-rows:repeat(4,54px);

    gap:4px;

    padding:8px;

    background:#513c30;

    border:5px solid #30241f;

    z-index:10;
}

.crop{
    width:54px;
    height:54px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#795a3e;

    border:3px solid #4a3528;

    font-size:27px;

    cursor:pointer;
}

.crop.watered{
    background:#566b72;
}

.crop.ready{
    animation:pulse 1s infinite;
}

.crop.empty::after{
    content:"+";

    color:#a47b59;
}

@keyframes pulse{
    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.4);
    }
}

.pond{
    position:absolute;

    right:9%;
    top:18%;

    width:170px;
    height:110px;

    border-radius:50%;

    background:#4b8da0;

    border:7px solid #304e56;

    box-shadow:
        inset 0 8px 0 #71b4c2;

    z-index:10;
}

.tree{
    position:absolute;

    font-size:70px;

    z-index:5;

    pointer-events:none;
}

.tree1{
    left:8%;
    bottom:8%;
}

.tree2{
    right:25%;
    bottom:7%;
}

.tree3{
    right:5%;
    bottom:28%;
}


/* =========================================================
   마을
========================================================= */

#town{
    background:
        linear-gradient(
            #9a907d 0 30%,
            #857b6a 30% 100%
        );
}

.townRoadHorizontal{
    position:absolute;

    left:0;
    right:0;

    top:52%;

    height:110px;

    background:#c5a878;

    border-top:5px solid #8d7551;
    border-bottom:5px solid #8d7551;
}

.townRoadVertical{
    position:absolute;

    left:50%;

    top:0;

    width:100px;
    height:58%;

    transform:translateX(-50%);

    background:#c5a878;

    border-left:5px solid #8d7551;
    border-right:5px solid #8d7551;
}

.shop{
    position:absolute;

    width:180px;
    height:150px;

    background:#b47765;

    border:6px solid #4a302d;

    z-index:10;
}

.shop1{
    left:10%;
    top:18%;
}

.shop2{
    right:10%;
    top:18%;
}

.shopRoof{
    position:absolute;

    left:-8px;
    top:-42px;

    width:184px;
    height:55px;

    background:#704b57;

    border:6px solid #4a302d;
}

.shopDoor{
    position:absolute;

    left:67px;
    bottom:0;

    width:45px;
    height:70px;

    background:#563d37;

    border:5px solid #4a302d;
}

.npc{
    position:absolute;

    font-size:40px;

    z-index:20;

    pointer-events:none;
}

.npc1{
    left:39%;
    top:44%;
}

.npc2{
    right:29%;
    top:64%;
}


/* =========================================================
   숲
========================================================= */

#forest{
    background:
        linear-gradient(
            #456149 0 30%,
            #334c38 30% 100%
        );
}

.forestGround{
    position:absolute;

    inset:30% 0 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            #526e48 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 70% 40%,
            #526e48 0 4px,
            transparent 5px
        );
}

.forestTree{
    position:absolute;

    font-size:82px;

    z-index:5;

    pointer-events:none;
}

.ft1{
    left:7%;
    top:12%;
}

.ft2{
    left:27%;
    top:7%;
}

.ft3{
    right:25%;
    top:12%;
}

.ft4{
    right:5%;
    top:8%;
}

.spiritStone{
    position:absolute;

    left:50%;
    top:48%;

    width:180px;
    height:180px;

    transform:translate(-50%,-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#25352a;

    border:6px solid #18231c;

    box-shadow:
        0 0 30px rgba(185,150,255,.2);

    font-size:85px;

    z-index:10;
}


/* =========================================================
   플레이어
========================================================= */

#player{
    position:absolute;

    width:48px;
    height:60px;

    transform:translate(-50%,-50%);

    z-index:100;

    pointer-events:none;

    user-select:none;

    display:flex;

    align-items:center;
    justify-content:center;
}

.playerSprite{
    font-size:38px;

    line-height:1;

    transition:
        transform .05s linear;
}

#player.flip .playerSprite{
    transform:scaleX(-1);
}

.playerName{
    position:absolute;

    left:50%;
    top:-21px;

    transform:translateX(-50%);

    padding:2px 5px;

    color:white;

    background:#27232e;

    border:2px solid #111018;

    font-size:8px;

    white-space:nowrap;
}

.playerShadow{
    position:absolute;

    left:50%;
    bottom:-2px;

    width:28px;
    height:7px;

    transform:translateX(-50%);

    background:#2c2630;

    border-radius:50%;

    z-index:-1;
}


/* =========================================================
   정보
========================================================= */

#info{
    position:absolute;

    right:15px;
    bottom:87px;

    width:220px;

    padding:12px;

    background:#25222e;

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e;

    z-index:85;
}

.infoTitle{
    margin-bottom:7px;

    color:#dcbfff;

    font-size:13px;
}

.infoText{
    color:#c5bdca;

    font-size:10px;

    line-height:1.6;
}


/* =========================================================
   액션바
========================================================= */

#actionBar{
    position:absolute;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    display:flex;

    gap:6px;

    padding:7px;

    background:#25222e;

    border:4px solid #111018;

    z-index:90;
}

.actionButton{
    width:90px;
    height:42px;

    color:white;

    background:#383342;

    border:3px solid #14121a;

    font-size:10px;

    cursor:pointer;
}

.actionButton:hover{
    background:#51485d;
}


/* =========================================================
   모바일 방향키
========================================================= */

#mobileControls{
    position:absolute;

    left:15px;
    bottom:20px;

    width:150px;
    height:150px;

    z-index:120;

    display:none;
}

.control{
    position:absolute;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    background:rgba(37,34,46,.9);

    border:4px solid #111018;

    box-shadow:
        inset 2px 2px 0 #51495e,
        inset -2px -2px 0 #1c1923;

    font-size:20px;

    touch-action:none;

    user-select:none;
}

.control:active{
    background:#655172;

    transform:scale(.93);
}

.up{
    left:50px;
    top:0;
}

.left{
    left:0;
    top:50px;
}

.down{
    left:50px;
    top:50px;
}

.right{
    left:100px;
    top:50px;
}


/* =========================================================
   패널
========================================================= */

#panel{
    position:absolute;

    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(8,7,12,.72);
}

#panel.open{
    display:flex;
}

.panelBox{
    width:min(600px,90vw);

    max-height:82vh;

    overflow:auto;

    padding:22px;

    background:#292531;

    border:5px solid #111018;

    box-shadow:
        inset 3px 3px 0 #51495e,
        inset -3px -3px 0 #17141c;
}

.panelClose{
    float:right;

    padding:5px 10px;

    color:white;

    background:#4b3948;

    border:3px solid #17131b;

    cursor:pointer;
}

.panelTitle{
    margin-bottom:18px;

    color:#e5c8f5;

    font-size:20px;
}


/* =========================================================
   패널 카드
========================================================= */

.card{
    padding:13px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.cardTitle{
    margin-bottom:7px;

    font-size:13px;
    font-weight:bold;
}

.cardText{
    color:#aaa1b8;

    font-size:10px;

    line-height:1.7;
}


/* =========================================================
   캐릭터 스탯
========================================================= */

.statRow{
    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;
}

.statName{
    width:60px;

    font-size:10px;
}

.statTrack{
    flex:1;

    height:10px;

    background:#16141a;

    border:2px solid #0d0c10;
}

.statTrackFill{
    height:100%;

    background:#8b6ca2;
}

.statNumber{
    width:25px;

    text-align:right;

    font-size:10px;
}


/* =========================================================
   지도
========================================================= */

.map{
    position:relative;

    height:310px;

    background:#536b55;

    border:4px solid #17141c;
}

.mapArea{
    position:absolute;

    display:flex;

    align-items:center;
    justify-content:center;

    border:4px solid #332b25;

    color:white;

    font-size:11px;
    font-weight:bold;
}

.mapFarm{
    left:8%;
    bottom:15%;

    width:32%;
    height:42%;

    background:#6e8d62;
}

.mapTown{
    left:39%;
    top:28%;

    width:27%;
    height:40%;

    background:#968873;
}

.mapForest{
    right:7%;
    top:10%;

    width:30%;
    height:43%;

    background:#3d5c43;
}

.mapRoadH{
    position:absolute;

    left:32%;
    bottom:32%;

    width:18%;
    height:35px;

    background:#c3a875;
}

.mapRoadV{
    position:absolute;

    left:51%;
    top:17%;

    width:35px;
    height:30%;

    background:#c3a875;
}

.mapPlayer{
    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#f0c57c;

    border:3px solid #352b2b;
}


/* =========================================================
   인벤토리
========================================================= */

.inventoryGrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.inventoryItem{
    min-height:90px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#332e3b;

    border:3px solid #17141c;

    font-size:28px;
}

.inventoryCount{
    margin-top:6px;

    color:#c5bdca;

    font-size:9px;
}


/* =========================================================
   정령
========================================================= */

.spiritCard{
    display:flex;

    align-items:center;

    gap:15px;

    padding:12px;

    margin-bottom:10px;

    background:#332e3b;

    border:3px solid #17141c;
}

.spiritIcon{
    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#24202b;

    border:3px solid #51495e;

    font-size:42px;
}

.spiritName{
    margin-bottom:4px;

    font-size:13px;
    font-weight:bold;
}

.hearts{
    color:#e4a6ff;

    letter-spacing:2px;
}

.contractButton{
    margin-top:7px;

    padding:7px 10px;

    color:white;

    background:#59456a;

    border:3px solid #18141e;

    cursor:pointer;

    font-size:10px;
}

.contractButton:disabled{
    opacity:.4;
}


/* =========================================================
   토스트
========================================================= */

#toast{
    position:absolute;

    left:50%;
    top:18px;

    transform:
        translate(-50%,-20px);

    padding:10px 18px;

    background:#292531;

    border:4px solid #111018;

    font-size:11px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:500;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   비활성 경고
========================================================= */

#inactiveWarning{
    position:absolute;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    padding:8px 14px;

    background:#372b35;

    border:3px solid #72536b;

    color:#e4cbdc;

    font-size:9px;

    opacity:0;

    z-index:600;

    pointer-events:none;
}

#inactiveWarning.show{
    opacity:1;
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:700px){

    #hud{

<script>

/* =========================================================
   게임 데이터
========================================================= */

const DEFAULT_GAME = {

    day:1,

    season:"봄",

    time:360,

    energy:100,

    maxEnergy:100,

    money:500,

    location:"farm",

    selectedCrop:0,

    saveSlot:1,

    inventory:{
        seed:5,
        crop:0,
        wood:0,
        stone:0
    },

    crops:[],

    player:{
        x:50,
        y:75,
        speed:.8,
        direction:"down"
    },

    locations:{
        farm:{
            x:50,
            y:75
        },

        town:{
            x:8,
            y:67
        },

        forest:{
            x:50,
            y:90
        }
    },

    stats:{
        level:1,
        exp:0,
        farming:1,
        fishing:1,
        gathering:1,
        strength:1,
        luck:1
    },

    spirits:{

        earth:{
            name:"대지의 정령",
            icon:"🌱",
            affection:0,
            contracted:false,
            power:"땅을 빠르게 개간할 수 있다."
        },

        water:{
            name:"물의 정령",
            icon:"💧",
            affection:0,
            contracted:false,
            power:"물을 주면 주변 밭까지 함께 적신다."
        },

        forest:{
            name:"숲의 정령",
            icon:"🌲",
            affection:0,
            contracted:false,
            power:"채집물의 발견 확률이 증가한다."
        }

    }

};


/* =========================================================
   게임 객체
========================================================= */

let game;

let keys = {};

let selectedCrop = 0;

let toastTimer = null;

let inactivityTimer = null;

let warningTimer = null;


/* =========================================================
   새 게임 데이터 생성
========================================================= */

function createDefaultGame(){

    const data =
        JSON.parse(
            JSON.stringify(
                DEFAULT_GAME
            )
        );


    data.crops=[];


    for(
        let i=0;
        i<20;
        i++
    ){

        data.crops.push({

            planted:false,

            watered:false,

            grown:false

        });

    }


    return data;

}


/* =========================================================
   저장 키
========================================================= */

function getSaveKey(slot){

    return "spiritSeasonSave_" + slot;

}


/* =========================================================
   시작 화면 → 저장 화면
========================================================= */

function showSaveScreen(){

    renderSaveSlots();


    document
        .getElementById("saveScreen")
        .classList.add("open");

}


/* =========================================================
   저장 화면 닫기
========================================================= */

function hideSaveScreen(){

    document
        .getElementById("saveScreen")
        .classList.remove("open");

}


/* =========================================================
   저장 슬롯 출력
========================================================= */

function renderSaveSlots(){

    const container =
        document.getElementById(
            "saveSlots"
        );


    container.innerHTML="";


    for(
        let slot=1;
        slot<=3;
        slot++
    ){

        const raw =
            localStorage.getItem(
                getSaveKey(slot)
            );


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className="saveSlot";


        if(!raw){

            wrapper.innerHTML=`

                <div class="saveInfo">

                    <div class="saveName">
                        슬롯 ${slot}
                    </div>

                    <div class="saveDetail">
                        비어 있음
                    </div>

                </div>


                <div class="saveButtons">

                    <button
                        type="button"
                        class="saveButton new"
                        onclick="
                            startNewGame(${slot})
                        ">

                        새 게임

                    </button>

                </div>

            `;

        }

        else{

            let data=null;


            try{

                data=
                    JSON.parse(raw);

            }

            catch(error){

                data=null;

            }


            if(!data){

                wrapper.innerHTML=`

                    <div class="saveInfo">

                        <div class="saveName">
                            슬롯 ${slot}
                        </div>

                        <div class="saveDetail">
                            저장 데이터 오류
                        </div>

                    </div>

                    <button
                        type="button"
                        class="saveButton delete"
                        onclick="
                            deleteSave(${slot})
                        ">

                        삭제

                    </button>

                `;

            }

            else{

                wrapper.innerHTML=`

                    <div class="saveInfo">

                        <div class="saveName">
                            슬롯 ${slot}
                        </div>

                        <div class="saveDetail">

                            ${data.day}일차
                            ·
                            ${data.season}
                            ·
                            ${getLocationName(data.location)}

                            <br>

                            ₩${data.money}
                            ·
                            Lv.${data.stats.level}

                        </div>

                    </div>


                    <div class="saveButtons">

                        <button
                            type="button"
                            class="saveButton"
                            onclick="
                                loadGame(${slot})
                            ">

                            불러오기

                        </button>


                        <button
                            type="button"
                            class="saveButton delete"
                            onclick="
                                deleteSave(${slot})
                            ">

                            삭제

                        </button>

                    </div>

                `;

            }

        }


        container.appendChild(
            wrapper
        );

    }

}


/* =========================================================
   새 게임
========================================================= */

function startNewGame(slot){

    game =
        createDefaultGame();


    game.saveSlot =
        slot;


    selectedCrop=0;


    document
        .getElementById("startScreen")
        .style.display="none";


    document
        .getElementById("saveScreen")
        .classList.remove("open");


    createFarm();

    updateHUD();

    updatePlayer();

    setLocation(
        "farm"
    );


    resetInactivityTimer();


    showToast(
        "새로운 하루가 시작되었다."
    );

}


/* =========================================================
   저장 불러오기
========================================================= */

function loadGame(slot){

    const raw =
        localStorage.getItem(
            getSaveKey(slot)
        );


    if(!raw){

        startNewGame(slot);

        return;

    }


    try{

        game =
            JSON.parse(raw);


        /*
           누락된 데이터 보정
        */

        if(!game.inventory){

            game.inventory={
                seed:5,
                crop:0,
                wood:0,
                stone:0
            };

        }


        if(!game.stats){

            game.stats={
                level:1,
                exp:0,
                farming:1,
                fishing:1,
                gathering:1,
                strength:1,
                luck:1
            };

        }


        if(!game.spirits){

            game.spirits =
                createDefaultGame().spirits;

        }


        if(!game.crops){

            game.crops=[];

        }


        while(
            game.crops.length<20
        ){

            game.crops.push({

                planted:false,
                watered:false,
                grown:false

            });

        }


        game.saveSlot=slot;


        document
            .getElementById("startScreen")
            .style.display="none";


        document
            .getElementById("saveScreen")
            .classList.remove("open");


        createFarm();

        updateHUD();

        updatePlayer();

        setLocation(
            game.location
        );


        resetInactivityTimer();


        showToast(
            "슬롯 "+
            slot+
            "을 불러왔다."
        );

    }

    catch(error){

        console.error(error);

        alert(
            "저장 데이터를 불러오지 못했습니다."
        );

    }

}


/* =========================================================
   저장
========================================================= */

function saveGame(){

    if(!game){

        return;

    }


    localStorage.setItem(

        getSaveKey(
            game.saveSlot
        ),

        JSON.stringify(game)

    );

}


/* =========================================================
   수동 저장
========================================================= */

function manualSave(){

    if(!game){

        return;

    }


    registerActivity();

    saveGame();


    showToast(
        "슬롯 "+
        game.saveSlot+
        "에 저장했다."
    );

}


/* =========================================================
   저장 삭제
========================================================= */

function deleteSave(slot){

    if(
        !confirm(
            "슬롯 "+
            slot+
            "의 저장 데이터를 삭제할까요?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        getSaveKey(slot)
    );


    renderSaveSlots();


    showToast(
        "저장 데이터를 삭제했다."
    );

}


/* =========================================================
   농장 생성
========================================================= */

function createFarm(){

    const field =
        document.getElementById(
            "field"
        );


    field.innerHTML="";


    for(
        let i=0;
        i<20;
        i++
    ){

        const tile =
            document.createElement(
                "div"
            );


        tile.className=
            "crop";


        tile.dataset.index=i;


        tile.addEventListener(
            "click",
            function(){

                selectedCrop=i;

                game.selectedCrop=i;

                updateCropInfo();

            }
        );


        field.appendChild(
            tile
        );

    }


    updateCrops();

}


/* =========================================================
   작물 화면
========================================================= */

function updateCrops(){

    const tiles =
        document.querySelectorAll(
            ".crop"
        );


    if(!game.crops){

        return;

    }


    tiles.forEach(
        function(tile,index){

            const crop =
                game.crops[index];


            if(!crop){

                return;

            }


            tile.className="crop";


            if(!crop.planted){

                tile.classList.add(
                    "empty"
                );

                tile.textContent="";

                return;

            }


            if(crop.grown){

                tile.classList.add(
                    "ready"
                );

                tile.textContent="🥕";

            }

            else{

                tile.textContent="🌱";

            }


            if(crop.watered){

                tile.classList.add(
                    "watered"
                );

            }

        }
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!game){

        return;

    }


    document
        .getElementById("day")
        .textContent=
        game.day;


    document
        .getElementById("time")
        .textContent=
        formatTime(game.time);


    document
        .getElementById("energy")
        .textContent=
        game.energy;


    document
        .getElementById("money")
        .textContent=
        game.money;


    document
        .getElementById("energyFill")
        .style.width=
        (
            game.energy/
            game.maxEnergy*
            100
        )+"%";


    document
        .getElementById("locationLabel")
        .textContent=
        getLocationName(
            game.location
        );

}


/* =========================================================
   시간
========================================================= */

function formatTime(minutes){

    let h =
        Math.floor(
            minutes/60
        );


    let m =
        minutes%60;


    if(h>23){

        h=23;
        m=59;

    }


    return (
        String(h).padStart(2,"0")
        +
        ":"
        +
        String(m).padStart(2,"0")
    );

}


function addTime(minutes){

    game.time +=
        minutes;


    if(
        game.time>=1440
    ){

        game.time=1440;

    }


    updateHUD();

}


/* =========================================================
   위치 이름
========================================================= */

function getLocationName(location){

    if(location==="farm"){

        return "농장";

    }


    if(location==="town"){

        return "마을";

    }


    if(location==="forest"){

        return "숲";

    }


    return "";

}


/* =========================================================
   플레이어 표시
========================================================= */

function updatePlayer(){

    const player =
        document.getElementById(
            "player"
        );


    if(!player || !game){

        return;

    }


    player.style.left =
        game.player.x+"%";


    player.style.top =
        game.player.y+"%";


    if(
        game.player.direction==="left"
    ){

        player.classList.add(
            "flip"
        );

    }

    else if(
        game.player.direction==="right"
    ){

        player.classList.remove(
            "flip"
        );

    }

}


/* =========================================================
   키보드 입력
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        registerActivity();


        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "w",
                "a",
                "s",
                "d",
                "W",
                "A",
                "S",
                "D"
            ].includes(
                event.key
            )
        ){

            event.preventDefault();

            keys[event.key]=true;

        }


        if(
            event.key==="Escape"
        ){

            closePanel();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event){

        keys[event.key]=false;

    }
);


/* =========================================================
   모바일 버튼
========================================================= */

/* =========================================================
   플레이어 이동
========================================================= */

function movePlayer(){

    if(
        !game
    ){

        return;

    }


    if(
        document
            .getElementById("panel")
            .classList
            .contains("open")
    ){

        return;

    }


    let dx=0;

    let dy=0;


    if(
        keys["ArrowLeft"] ||
        keys["a"] ||
        keys["A"]
    ){

        dx--;

        game.player.direction=
            "left";

    }


    if(
        keys["ArrowRight"] ||
        keys["d"] ||
        keys["D"]
    ){

        dx++;

        game.player.direction=
            "right";

    }


    if(
        keys["ArrowUp"] ||
        keys["w"] ||
        keys["W"]
    ){

        dy--;

        game.player.direction=
            "up";

    }


    if(
        keys["ArrowDown"] ||
        keys["s"] ||
        keys["S"]
    ){

        dy++;

        game.player.direction=
            "down";

    }


    if(
        dx===0 &&
        dy===0
    ){

        return;

    }


    if(
        dx!==0 &&
        dy!==0
    ){

        dx*=.707;

        dy*=.707;

    }


    const nextX =
        game.player.x+
        dx*
        game.player.speed;


    const nextY =
        game.player.y+
        dy*
        game.player.speed;


    if(
        canMove(
            nextX,
            nextY
        )
    ){

        game.player.x=
            nextX;

        game.player.y=
            nextY;

    }


    updatePlayer();

    checkExit();

}


/* =========================================================
   이동 충돌
========================================================= */

function canMove(x,y){

    /*
       화면 기본 경계
    */

    if(
        x<3 ||
        x>97 ||
        y<5 ||
        y>95
    ){

        return false;

    }


    /* =========================
       농장
    ========================= */

    if(
        game.location==="farm"
    ){

        /*
           집
        */

        if(
            inside(
                x,
                y,
                7,
                9,
                22,
                28
            )
        ){

            return false;

        }


        /*
           밭
        */

        if(
            inside(
                x,
                y,
                34,
                24,
                29,
                30
            )
        ){

            return false;

        }


        /*
           연못
        */

        if(
            ellipse(
                x,
                y,
                91,
                23,
                8,
                7
            )
        ){

            return false;

        }

    }


    /* =========================
       마을
    ========================= */

    if(
        game.location==="town"
    ){

        /*
           왼쪽 상점
        */

        if(
            inside(
                x,
                y,
                9,
                18,
                25,
                27
            )
        ){

            return false;

        }


        /*
           오른쪽 상점
        */

        if(
            inside(
                x,
                y,
                67,
                18,
                25,
                27
            )
        ){

            return false;

        }

    }


    /* =========================
       숲
    ========================= */

    if(
        game.location==="forest"
    ){

        /*
           정령석
        */

        if(
            ellipse(
                x,
                y,
                50,
                48,
                12,
                12
            )
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   사각형 충돌
========================================================= */

function inside(
    x,
    y,
    left,
    top,
    width,
    height
){

    return(
        x>left &&
        x<left+width &&
        y>top &&
        y<top+height
    );

}


/* =========================================================
   원형 충돌
========================================================= */

function ellipse(
    x,
    y,
    cx,
    cy,
    rx,
    ry
){

    const dx=
        (x-cx)/rx;

    const dy=
        (y-cy)/ry;


    return(
        dx*dx+
        dy*dy<1
    );

}


/* =========================================================
   길 출구
========================================================= */

function checkExit(){

    /*
       농장 오른쪽
       → 마을
    */

    if(
        game.location==="farm" &&
        game.player.x>=96 &&
        game.player.y>=54 &&
        game.player.y<=80
    ){

        changeLocation(
            "town",
            "fromFarm"
        );

        return;

    }


    /*
       마을 왼쪽
       → 농장
    */

    if(
        game.location==="town" &&
        game.player.x<=4 &&
        game.player.y>=54 &&
        game.player.y<=80
    ){

        changeLocation(
            "farm",
            "fromTown"
        );

        return;

    }


    /*
       마을 위쪽
       → 숲
    */

    if(
        game.location==="town" &&
        game.player.y<=5 &&
        game.player.x>=42 &&
        game.player.x<=58
    ){

        changeLocation(
            "forest",
            "fromTown"
        );

        return;

    }


    /*
       숲 아래쪽
       → 마을
    */

    if(
        game.location==="forest" &&
        game.player.y>=94 &&
        game.player.x>=42 &&
        game.player.x<=58
    ){

        changeLocation(
            "town",
            "fromForest"
        );

    }

}

function changeLocation(

    entrance
){

    */

    if(
        location==="town"
    ){

        if(
            entrance==="fromFarm"
        ){

            game.player.x=7;

            game.player.y=67;

        }


        if(
            entrance==="fromForest"
        ){

            game.player.x=50;

            game.player.y=88;

        }

    }


    if(
        location==="farm"
    ){

        if(
            entrance==="fromTown"
        ){

            game.player.x=92;

            game.player.y=67;

        }

    }


    if(
        location==="forest"
    ){

        if(
            entrance==="fromTown"
        ){

            game.player.x=50;

            game.player.y=88;

        }

    }


    document
        .querySelectorAll(".location")
        .forEach(
            function(el){

                el.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(
            location
        )
        .classList.add(
            "active"
        );


    updatePlayer();

    updateHUD();


    updateInfo(
        getLocationMessage(
            location
        )
    );


    showToast(
        getLocationName(
            location
        )
    );

/* =========================================================

========================================================= */

function plantCrop(){

    registerActivity();


    if(
        game.location!=="farm"
    ){

        showToast(
            "농장에서만 심을 수 있다."
        );

        return;

    }


    const crop =
        game.crops[
            selectedCrop
        ];


    if(
        crop.planted
    ){

        showToast(
            "이미 작물이 있다."
        );

        return;

    }


    if(
        game.inventory.seed<=0
    ){

        showToast(
            "씨앗이 없다."
        );

        return;

    }


    if(
        game.energy<5
    ){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.inventory.seed--;

    game.energy-=5;

    crop.planted=true;

    crop.watered=false;

    crop.grown=false;


    game.stats.farming++;


    addTime(10);

    updateCrops();

    updateHUD();


    showToast(
        "씨앗을 심었다."
    );

}


/* =========================================================
   물주기
========================================================= */

function waterCrop(){

    registerActivity();


    if(
        game.location!=="farm"
    ){

        showToast(
            "농장에서만 물을 줄 수 있다."
        );

        return;

    }


    const crop =
        game.crops[
            selectedCrop
        ];


    if(
        !crop.planted
    ){

        showToast(
            "작물이 없다."
        );

        return;

    }


    if(
        crop.grown
    ){

        showToast(
            "이미 다 자랐다."
        );

        return;

    }


    if(
        crop.watered
    ){

        showToast(
            "이미 물을 줬다."
        );

        return;

    }


    if(
        game.energy<3
    ){

        showToast(
            "체력이 부족하다."
        );

        return;

    }


    game.energy-=3;

    crop.watered=true;


    /*
       물의 정령 계약 효과
    */

    if(
        game.spirits.water.contracted
    ){

        const nearby=[
            selectedCrop-1,
            selectedCrop+1,
            selectedCrop-5,
            selectedCrop+5
        ];


        nearby.forEach(
            function(index){

                if(
                    game.crops[index]
                ){

                    game.crops[index]
                        .watered=true;

                }

            }
        );

    }


    addTime(5);

    updateCrops();

    updateHUD();


    showToast(
        "물을 줬다."
    );

}

function harvestCrop(){

    registerActivity();


    if(
        game.location!=="farm"
    ){

        showToast(
            "농장에서만 수확할 수 있다."
        );

    }

    if(
        !crop.grown
    ){

        showToast(

    crop.planted=false;

    game.stats.exp+=10;

    addTime(10);

    updateCrops();

    updateHUD();


    showToast(

    );

}


/* =========================================================
   레벨
========================================================= */

function checkLevel(){

    const required =
        game.stats.level*100;


    if(
        game.stats.exp>=required
    ){

        game.stats.exp-=required;

        game.stats.level++;

        game.maxEnergy+=5;

        game.energy=
            game.maxEnergy;


        showToast(
            "레벨 업! Lv."+
            game.stats.level
        );

    }

}


/* =========================================================
   휴식
========================================================= */

function rest(){

    registerActivity();


    if(
        game.energy>=
        game.maxEnergy
    ){

        showToast(
            "체력이 이미 가득하다."
        );

        return;

    }


    game.energy=
        Math.min(
            game.maxEnergy,
            game.energy+25
        );


    addTime(60);


    showToast(
        "잠시 쉬었다."
    );

}


/* =========================================================
   취침
========================================================= */

function sleep(){

    registerActivity();


    if(
        !confirm(
            "오늘 하루를 끝내고 잠자리에 들까요?"
        )
    ){

        return;

    }


    game.day++;

    game.time=360;

    game.energy=
        game.maxEnergy;


    game.crops.forEach(
        function(crop){

            if(
                crop.planted &&
                crop.watered
            ){

                crop.grown=true;

            }


            crop.watered=false;

        }
    );


    updateCrops();

    updateHUD();

    saveGame();


    showToast(
        game.day+
        "일째 아침이 되었다."
    );

}

        game.spirits

    .forEach(

                entry[0];

            const spirit=
                entry[1];

            for(

                            }

                        ${

                            `

                                style="

                                color:#dcbfff;
                                ">

function contractSpirit(id){

    registerActivity();


    const spirit=
        game.spirits[id];


    if(
        spirit.affection<3
    ){

        showToast(
            "아직 정령과 충분히 가까워지지 않았다."
        );

        return;

    }


    spirit.contracted=true;


    closePanel();


    showToast(
        spirit.name+
        "과 계약했다!"
    );

}


/* =========================================================
   계약 정령 출력
========================================================= */

function getContracts(){

    const list=[];


    Object.values(
        game.spirits
    )
    .forEach(
        function(spirit){

            if(
                spirit.contracted
            ){

                list.push(
                    spirit.name
                );

            }

        }
    );


    return list.join("<br>");

}

            }

            else{

                openSpirits();

            }

        }
    );


/* =========================================================
   패널
========================================================= */

function openPanel(
    title,
    content
){

    document
        .getElementById("panelTitle")
        .textContent=
        title;


    document
        .getElementById("panelContent")
        .innerHTML=
        content;


    document
        .getElementById("panel")
        .classList.add("open");

}


function closePanel(){

    document
        .getElementById("panel")
        .classList.remove(
            "open"
        );

}


/* =========================================================
   토스트
========================================================= */

function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );


    toast.innerHTML=
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer=
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   10분 비활성 처리
========================================================= */

const INACTIVE_TIME =
    10*60*1000;


const WARNING_TIME =
    9*60*1000;


function resetInactivityTimer(){

    if(!game){

        return;

    }


    clearTimeout(
        inactivityTimer
    );

    clearTimeout(
        warningTimer
    );


    document
        .getElementById(
            "inactiveWarning"
        )
        .classList.remove(
            "show"
        );


    warningTimer=
        setTimeout(
            function(){

                document
                    .getElementById(
                        "inactiveWarning"
                    )
                    .classList.add(
                        "show"
                    );

            },
            WARNING_TIME
        );


    inactivityTimer=
        setTimeout(
            function(){

                /*
                   현재 상태 자동 저장
                */

                saveGame();


                /*
                   게임 시작 화면으로
                */

                stopGame();


                showToast(
                    "오랫동안 활동이 없어 게임을 종료했다."
                );

            },
            INACTIVE_TIME
        );

}


/* =========================================================
   활동 감지
========================================================= */

function registerActivity(){

    if(!game){

        return;

    }


    resetInactivityTimer();

}


/* =========================================================
   게임 종료
========================================================= */

function stopGame(){

    clearTimeout(
        inactivityTimer
    );

    clearTimeout(
        warningTimer
    );


    keys={};


    closePanel();


    document
        .getElementById(
            "saveScreen"
        )
        .classList.remove(
            "open"
        );


    document
        .getElementById(
            "startScreen"
        )
        .style.display=
        "flex";


    game=null;

}


/* =========================================================
   전역 활동 감지
========================================================= */

[
    "mousedown",
    "touchstart",
    "pointerdown"
]
.forEach(
    function(eventName){

        document.addEventListener(
            eventName,
            function(){

                registerActivity();

            },
            {
                passive:true
            }
        );

    }
);


/* =========================================================
   초기 상태
========================================================= */

createFarm();

updateHUD();

updatePlayer();


/*
   웹에 처음 들어오면
   게임 시작 화면만 표시.
*/

document
    .getElementById(
        "startScreen"
    )
    .style.display=
    "flex";

</script>
